<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PRL en el taller: del almacén a la cabina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Misma familia visual que «Del plano al corte» y «Del árbol al mueble». */
:root{
  color-scheme:dark;
  --bg:#1C2B28; --panel:#26383A; --panel2:#30464A; --ink:#EEF3EC; --ink2:#AFC0B9; --line:#47605F;
  --am:#F2C230; --ro:#EE6049; --ve:#63D192; --az:#8DB6FF;
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow","Segoe UI",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
select{background:#101A18;border:1px solid var(--line);padding:5px 6px;max-width:100%}
:focus-visible{outline:2px solid var(--am);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "vis der";gap:10px}
#app.ancho{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "der"}
#app.ancho #vis{display:none}
header{grid-area:top;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
h1{margin:0;font:700 26px/1 var(--f-disp);letter-spacing:.01em}
h1 small{display:block;font:500 12px/1.2 var(--f-body);letter-spacing:0;opacity:.8;margin-top:3px}
#etapas{display:flex;gap:3px;flex:1 1 auto;min-width:0;overflow-x:auto}
#etapas span{padding:3px 9px;font:600 15px var(--f-disp);letter-spacing:.03em;color:var(--ink2);white-space:nowrap;border-bottom:2px solid var(--line)}
#etapas span.hecho{color:var(--ve);border-color:var(--ve)}
#etapas span.ya{color:var(--ink);border-color:var(--am)}
.nota{display:flex;align-items:baseline;gap:7px;margin-left:auto;color:var(--ink2);font-size:13px}
.nota b{font:600 22px var(--f-num);color:var(--ink)}
#vis{grid-area:vis;background:var(--panel);border:1px solid var(--line);min-height:0;display:flex;flex-direction:column;overflow:hidden}
#vtabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--line);min-height:38px}
#vtabs .tit{font:600 16px var(--f-disp);letter-spacing:.03em;color:var(--ink2)}
#vtabs .zoom{margin-left:auto;display:flex;gap:3px}
#vtabs button{border:1px solid var(--line);background:var(--panel2);padding:3px 9px;font:600 15px var(--f-disp);min-width:32px}
#hoja{background:#8C9792;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px;touch-action:none;overflow:hidden;position:relative}
#hoja.tres{background:#E9E5DA;padding:0}
#hoja.html{background:#E9E5DA;align-items:flex-start;overflow:auto;touch-action:auto;padding:12px}
#hoja svg{display:block;width:100%;height:100%;max-height:100%;user-select:none;-webkit-user-select:none}
#der{grid-area:der;background:var(--panel);border:1px solid var(--line);overflow:auto;min-height:0;padding:12px 14px 14px;min-width:0}
h2{margin:0 0 6px;font:700 26px/1.1 var(--f-disp);text-wrap:balance}
p.ins{margin:0 0 10px;color:var(--ink2)}
p.ins b{color:var(--ink)}
.enun{font-size:17px;line-height:1.45;margin:0 0 12px}
.enun b{color:var(--am)}
.msg{margin:0 0 10px;padding:8px 11px;border:1px solid var(--line);background:#101A18;font-weight:500}
.msg.mal{border-color:var(--ro);color:#FFD4CB}
.msg.bien{border-color:var(--ve);color:#CFF3DE}
.pri{border:0;background:var(--am);color:#1C2B28;font-weight:600;padding:9px 16px}
.pri:disabled{opacity:.42;cursor:not-allowed}
.sec{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;font-weight:500}
.sec:disabled{opacity:.42;cursor:not-allowed}
.fila{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input.txt{width:100%;max-width:360px;padding:8px 9px;background:#101A18;border:1px solid var(--line);margin:0 0 10px;display:block}
label.et{display:block;margin:0 0 3px;font-size:13px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 14px var(--f-disp);letter-spacing:.03em;text-align:left;color:var(--ink2);padding:3px 5px;border-bottom:1px solid var(--line)}
td{padding:3px 5px;border-bottom:1px solid rgba(71,96,95,.55);vertical-align:top}
.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.banda{background:var(--panel2);padding:3px 6px;font:600 15px var(--f-disp);letter-spacing:.04em;margin-top:10px}
.cert{display:block;width:100%;max-width:1150px;border:1px solid var(--line);margin:0 0 8px}
.cod{display:block;font:600 14px var(--f-num);margin-bottom:8px;word-break:break-all}
.res2{font-weight:600;margin:10px 0}
.ayu{font-size:13px;color:var(--ink2);margin:6px 0}
.fant{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--am);color:#1C2B28;font-weight:600;padding:5px 10px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.por{border:1px solid var(--am);background:#101A18;padding:10px 12px;margin:0 0 10px;line-height:1.42;position:relative}
.por b.t{color:var(--am);font:600 16px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
.por.grande{font-size:17px;padding:14px 40px 14px 16px}
.por .x{position:absolute;right:6px;top:6px;border:1px solid var(--line);background:var(--panel2);width:30px;height:30px;font-size:18px;line-height:1;padding:0}
.ops{display:grid;gap:6px;margin:0 0 10px}
.op{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);padding:9px 11px;font-size:15.5px}
.op:hover{border-color:var(--am)}
.op i{flex:0 0 24px;height:24px;border:1px solid var(--ink2);font:600 14px/22px var(--f-num);font-style:normal;text-align:center;color:var(--am)}
.op.mal{border-color:var(--ro);background:#3a201b;color:#FFD4CB}
.op.bien{border-color:var(--ve);background:#16302A;color:#CFF3DE}
.op:disabled{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:2px solid var(--line);background:var(--panel2);padding:6px 12px;font:600 16px var(--f-disp);letter-spacing:.03em;touch-action:none;user-select:none}
.chip.sel{border-color:var(--am);background:#3b4a2a}
.chip.ok{border-color:var(--ve);color:var(--ve);background:#16302A;cursor:default}
.campo{display:grid;grid-template-columns:minmax(0,1fr) 120px 40px;gap:8px;align-items:center;margin:0 0 8px}
.campo label{font-size:15px}
.campo input{width:100%;padding:7px 8px;background:#101A18;border:1px solid var(--line);text-align:right;font:500 16px var(--f-num)}
.campo input.ok{border-color:var(--ve);color:var(--ve);background:#16302A}
.campo input.mal{border-color:var(--ro);color:#FFD4CB;background:#3a201b}
.campo.ancho{grid-template-columns:minmax(0,1fr)}
.campo.ancho input{text-align:left}
.campo span{color:var(--ink2);font-size:14px}
.sel2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center;margin:0 0 7px}
.sel2 select.ok{border-color:var(--ve);color:var(--ve);background:#16302A}
.sel2 select.mal,.enc select.mal{border-color:var(--ro);color:#FFD4CB;background:#3a201b}
.enc select.ok{border-color:var(--ve);color:var(--ve);background:#16302A}
.ord{display:grid;gap:5px;margin:0 0 10px}
.ord div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;font-size:16px}
.ord div b{font:600 15px var(--f-num);color:var(--am);width:22px}
.ord div span{flex:1}
.ord button{border:1px solid var(--line);background:#101A18;width:34px;height:30px;padding:0}
.enc{width:100%}
.enc td{padding:5px 4px}
.enc select{width:100%;font-size:14px}
.enc .pz{font-weight:600}
.enc .cond{display:block;font-size:13px;color:var(--ink2);font-weight:400}
.etqE{display:inline-block;margin:0 8px 6px 0;padding:3px 10px;border-radius:12px;background:var(--am);color:#1B1408;font-weight:700;font-size:15px}
.nc{display:inline-block;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#1C2B28;text-align:center;font:600 13px/22px var(--f-num);padding:0 4px;margin-right:4px}
.paso{font:500 13px var(--f-num);color:var(--ink2);margin:0 0 4px}
.ficha{background:#fff;color:#17201C;border:1px solid #B9C2BD;max-width:760px;width:100%;margin:0 auto;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.ficha .fc{background:#1C2B28;color:#fff;padding:10px 14px;font:700 24px var(--f-disp)}
.ficha .fc small{display:block;font:500 14px var(--f-body);opacity:.85}
.ficha table{font-size:14.5px}
.ficha td{border-bottom:1px solid #E2E5E1;padding:5px 12px}
.ficha td:first-child{color:#55615B;width:38%;font-weight:600}
.ficha .tapado{background:#D8DDD9;color:#55615B;padding:1px 8px;font-style:italic}
.anexo{background:#fff;color:#17201C;width:100%;font-size:13.5px}
.anexo th{color:#55615B;border-bottom:1px solid #B9C2BD;font-size:13.5px}
.anexo td{border-bottom:1px solid #E2E5E1}
#hoja .guiaE svg{width:auto;height:auto;display:inline-block;max-height:none}
.guiaE{width:100%;box-sizing:border-box;background:#fff;color:#17201C;padding:12px 16px;max-width:760px;margin:0 auto;font-size:15.5px;line-height:1.45}
.guiaE li{margin:0 0 6px}.guiaE li.si{background:#FFF1B8;outline:2px solid #C8891E;padding:2px 4px}
.vf{display:flex;gap:6px;margin:0 0 10px}
.vf .op{justify-content:center}
.op.marc{border-color:var(--am);background:#3b4a2a}
.op.marc i{background:var(--am);color:#1C2B28}
.chip.malc{border-color:var(--ro);color:#FFD4CB;background:#3a201b}
.sel2.largo{grid-template-columns:minmax(0,1fr)}
.sel2.largo select{font-size:13px}
#incsel{font-size:13.5px}
@media (max-width:900px){
  html,body{height:auto}
  #app,#app.ancho{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "vis" "der"}
  #hoja{min-height:0;height:auto;aspect-ratio:10/7}
  .enc tr:first-child{display:none}.enc,.enc tbody,.enc tr,.enc td{display:block;width:100%}.enc tr{border-bottom:1px solid var(--line);padding:6px 0}.enc td{border:0;padding:3px 0}.enc td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--ink2)}
  #hoja.html{height:auto;max-height:none;min-height:0}
  .campo{grid-template-columns:minmax(0,1fr) 100px 34px}
  .sel2{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header><h1>PRL en el taller<small>Autor: Gustavo Hernández Sánchez</small></h1><div id="etapas"></div><div class="nota">Nota <b id="nota">10,00</b></div></header>
  <section id="vis"><div id="vtabs"></div><div id="hoja"></div></section>
  <section id="der"></section><input type="file" id="fpar" accept=".txt,text/plain" hidden>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* utilidades comunes (tomadas de «Del árbol al mueble») */

const VW=1000,VH=700;
function RNG(s){let a=s>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1)),rf=(r,a,b)=>a+r()*(b-a),pick=(r,L)=>L[Math.floor(r()*L.length)];
function baraja(r,L){const o=[...L];for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}
const F=v=>Math.round(v*10)/10;
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const FONT="font-family=\"Barlow,Arial,sans-serif\"";
const tx=(x,y,t,sz=22,an='middle',col='#17201C',w=600)=>`<text x="${F(x)}" y="${F(y)}" ${FONT} font-size="${sz}" font-weight="${w}" text-anchor="${an}" fill="${col}">${esc(t)}</text>`;
const fondo=(c='#F4F1E8')=>`<rect x="0" y="0" width="${VW}" height="${VH}" fill="${c}"/>`;
const svgDe=(cuerpo,extra='')=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH}" ${extra}>${cuerpo}</svg>`;
const tono=(hex,k)=>{const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*k))));return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')};


const normal=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase().replace(/\s+/g,' ');
function semilla(n){let h=2166136261;for(const c of normal(n)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const rngDe=(nom,int,f)=>RNG(semilla(nom+'#'+int+'#'+f));
const coma=(v,d=2)=>Number(v).toFixed(d).replace('.',',');
const n1=v=>String(Math.round(v*100000)/100000).replace('.',',');
function opsCon(r,ok,malas,n=4){const o=baraja(r,[ok,...baraja(r,malas.filter(m=>m!==ok)).slice(0,n-1)]);return {ops:o,sol:o.indexOf(ok)}}


const T3={ok:false,R:null,vista:null,cache:{}};
(function(){try{if(!window.THREE)return;const c=document.createElement('canvas');T3.ok=!!(c.getContext('webgl')||c.getContext('experimental-webgl'))}catch(e){}})();
function t3R(){if(T3.R)return T3.R;const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));R.outputEncoding=THREE.sRGBEncoding;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.setClearColor(0xE9E5DA);T3.R=R;return R}
const cnv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function tex(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const matT=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({map:tex(c),roughness:.72,metalness:0},o));
const matC=(col,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(col).convertSRGBToLinear(),roughness:.7,metalness:0},o));


function t3Montar(cont,cfg){const R=t3R(),S=new THREE.Scene(),C=new THREE.PerspectiveCamera(32,1,.05,400);
 S.add(new THREE.HemisphereLight(0xFFF4E2,0x6E6458,.5));const L=new THREE.DirectionalLight(0xFFFFFF,1.0);L.position.set(6,12,8);L.castShadow=true;L.shadow.mapSize.set(2048,2048);const sc=cfg.sombra||8;Object.assign(L.shadow.camera,{left:-sc,right:sc,top:sc,bottom:-sc,near:.5,far:60});L.shadow.bias=-.0006;S.add(L);const L2=new THREE.DirectionalLight(0xFFF2E0,.25);L2.position.set(-8,4,-6);S.add(L2);
 const cv=R.domElement;cont.innerHTML='';cont.appendChild(cv);cv.style.cssText='display:block;width:100%;height:100%;touch-action:none;cursor:grab';const capa=document.createElement('div');capa.style.cssText='position:absolute;inset:0;pointer-events:none;overflow:hidden';cont.appendChild(capa);const giro=document.createElement('div');giro.className='giro3d';giro.innerHTML=(matchMedia('(pointer:coarse)').matches?'👆 Desliza el dedo para girar la vista':'🖱️ Arrastra para girar · rueda del ratón para acercar');giro.style.cssText='position:absolute;left:10px;bottom:10px;pointer-events:none;background:rgba(23,32,28,.82);color:#fff;font:600 14px Inter,Arial,sans-serif;padding:6px 12px;border-radius:16px;transition:opacity .6s';cont.appendChild(giro);
 const V={key:cfg.key,cv,S,C,cfg,cam:Object.assign({th:-.6,el:.45,d:12,t:new THREE.Vector3()},cfg.cam||{}),anim:[],sucio:true,vivo:true,capa};
 V.ctx=cfg.construir(S,V)||{};if(cfg.actualizar)cfg.actualizar(V.ctx,cfg,V);
 const aplicaCam=()=>{const c=V.cam;C.position.set(c.t.x+c.d*Math.cos(c.el)*Math.sin(c.th),c.t.y+c.d*Math.sin(c.el),c.t.z+c.d*Math.cos(c.el)*Math.cos(c.th));C.lookAt(c.t)};
 V.medir=()=>{const w=cont.clientWidth||600,h=cont.clientHeight||420;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();V.sucio=true};
 V.ir=(p)=>{const c=V.cam,a={th:c.th,el:c.el,d:c.d},t0=performance.now();let dth=p.th-a.th;while(dth>Math.PI)dth-=2*Math.PI;while(dth<-Math.PI)dth+=2*Math.PI;V.anim.push(t=>{const k=Math.min(1,(t-t0)/650),e=1-Math.pow(1-k,3);c.th=a.th+dth*e;c.el=a.el+(p.el-a.el)*e;c.d=a.d+((p.d||a.d)-a.d)*e;if(p.t){c.t.lerp(p.t,e*.25)}return k<1})};
 V.etiquetas=()=>{if(!cfg.etiquetas){capa.innerHTML='';return}const L=cfg.etiquetas(V.ctx,V)||[],w=cv.clientWidth,h=cv.clientHeight,rc=new THREE.Raycaster();capa.innerHTML=L.map(e=>{let oc=false;if(e.obj){const dir=e.p.clone().sub(C.position),dist=dir.length();rc.set(C.position,dir.normalize());const hit=rc.intersectObjects(S.children,true).find(x=>x.object.visible&&!(x.object.material&&x.object.material.transparent));oc=hit&&hit.object!==e.obj&&hit.distance<dist-.02}const p=e.p.clone().project(C);if(p.z>1)return '';if(oc)e={...e,css:(e.css||'')+';opacity:.55;outline:2px dashed #fff'};const x=(p.x+1)/2*w,y=(1-p.y)/2*h;return `<div style="position:absolute;left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;transform:translate(-50%,-50%);${e.css||''}">${e.h}</div>`}).join('')};
 const bucle=t=>{if(!V.vivo)return;if(!cv.isConnected){V.parar();return}let mov=false;V.anim=V.anim.filter(f=>{mov=true;return f(t)});if(cfg.cada&&cfg.cada(V.ctx,t))mov=true;if(mov||V.sucio){aplicaCam();R.render(S,C);V.etiquetas();V.sucio=false}requestAnimationFrame(bucle)};
 V.parar=()=>{V.vivo=false;try{ro.disconnect()}catch(e){}S.traverse(o=>{if(o.geometry)o.geometry.dispose();const m=o.material;(Array.isArray(m)?m:m?[m]:[]).forEach(x=>{if(x.map&&!x.map.compartida)x.map.dispose();x.dispose()})})};
 V.update=d=>{for(const k in d)if(typeof d[k]!=='function'&&!['presets','cam','key'].includes(k))V.cfg[k]=d[k];if(cfg.actualizar)cfg.actualizar(V.ctx,d,V);V.sucio=true};
 V.foto=(pre)=>{if(pre&&cfg.presets&&cfg.presets[pre]){const p=cfg.presets[pre];Object.assign(V.cam,{th:p.th,el:p.el,d:p.d||V.cam.d});V.anim=[]}aplicaCam();R.render(S,C);try{return cv.toDataURL('image/jpeg',.88)}catch(e){return null}};
 /* ratón y dedo: arrastrar gira; rueda acerca; clic selecciona */
 let arr=null;cv.addEventListener('pointerdown',e=>{arr={x:e.clientX,y:e.clientY,th:V.cam.th,el:V.cam.el,mov:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}cv.style.cursor='grabbing'});

/* ---------- máquinas fijas: preguntas, imprevistos, fallos para revisar y cambio de útil ----------

const MAQ={
 esc:{n:'Escuadradora',util:'el disco',ref:RC('la escuadradora'),
  qs:[
   r=>{const g=pick(r,[16,19,22,25,30,38,40]);return N(`Vas a cortar una pieza de <b>${g} mm</b> de grueso. ¿A qué altura sobre la mesa pones el disco?`,[{id:'h',et:'Altura del disco sobre la mesa',sol:g+15,tol:5,u:'mm'}],v=>`El disco debe sobresalir de la pieza entre 10 y 20 mm, con al menos un diente completo fuera: entre ${g+10} y ${g+20} mm ${RC('la escuadradora')}.`,`Correcto: entre ${g+10} y ${g+20} mm. Más bajo roza más dientes y quema el corte; más alto deja más disco al descubierto.`)},
   ()=>Q('¿Dónde te colocas para cortar en la escuadradora?','A la izquierda del disco, junto al carro, nunca en la línea de corte',['Justo detrás del disco, en la línea de corte, para empujar recto','A la derecha, junto a la guía paralela','Donde haya sitio, no importa'],'Un recorte puede salir despedido hacia atrás: tu puesto es a la izquierda del disco, junto al carro '+RC('la escuadradora')+'.','Fuera de la línea de corte, a la izquierda, junto al carro.'),
   ()=>Q('Usas la guía paralela como tope de medida para cortar con el carro una pieza pequeña. ¿Cómo la colocas?','Retrasada, por detrás del disco: la pieza cortada queda libre y no retrocede',['Adelantada, a lo largo de todo el disco','Quitada: se corta a ojo','Adelantada y apretando la pieza contra ella'],'Como tope, la guía va siempre retrasada: si la pieza queda atrapada entre la guía y el disco, retrocede '+RC('la escuadradora')+'.','Guía retrasada: la pieza cortada queda libre.'),
   ()=>Q('¿Dónde va el cuchillo divisor?','Alineado con el disco y a menos de 8 mm de sus dientes',['A unos 30 mm del disco, para que no roce','Se quita para cortar tableros finos','Delante del disco, por donde entra la pieza'],'El cuchillo divisor impide que la pieza se cierre sobre el disco y retroceda: alineado y a menos de 8 mm '+RC('la escuadradora')+'.','A menos de 8 mm y alineado con el disco.'),
   r=>{const w=pick(r,[60,90,120,150,180,220,240,300,380,450]),peq=w<=250;return Q(`Vas a cortar con la guía lateral una pieza de <b>${w} mm</b> de ancho. ¿Usas el empujador?`,peq?'Sí: es una pieza pequeña y se corta con la guía lateral':'No hace falta: el empujador es para piezas de hasta 250 mm',peq?['No: el empujador solo se usa con el carro','No: se termina el corte con la mano','Solo si la pieza es de melamina']:['Sí: siempre, con cualquier pieza','Sí, y además se bloquea el carro','No: se termina con la mano pasando por encima del disco'],'En nuestra escuadradora el empujador se usa con piezas pequeñas (hasta 250 mm) y al cortar con la guía lateral.',peq?'Pieza pequeña con la guía lateral: con empujador.':'Pieza de más de 250 mm: sin empujador, con las manos lejos del disco.')},
   ()=>Q('Vas a cambiar el disco. ¿Te pones guantes?','No: en las máquinas no se usan guantes, tampoco al cambiar el útil',['Sí, guantes de trabajo, porque el disco corta','Sí, de nitrilo','Solo si el disco está caliente'],'En nuestro taller, ningún guante en las máquinas: tampoco para cambiar el útil.','Sin guantes, con la máquina desconectada.'),
   ()=>Q('¿En qué sentido se afloja la tuerca del disco de nuestra escuadradora?','En el mismo sentido en que gira el disco',['En sentido contrario al giro del disco, como cualquier tuerca','Da igual: se afloja en los dos sentidos','Con la máquina en marcha, para que salga sola'],'En nuestra escuadradora la tuerca del disco se afloja en el mismo sentido de giro del disco.','En el sentido de giro del disco.')],
  imp:[
   ()=>Q('Mientras cortas, la pieza empieza a cerrarse sobre el disco y notas que quiere retroceder.','Detengo el avance sin acercar las manos al disco, paro la máquina y aviso al profesor',['Empujo más fuerte para terminar rápido','Saco la pieza tirando hacia mí con el disco en marcha','Sujeto la pieza con la mano junto al disco'],'Es el inicio de un retroceso: no se fuerza ni se tira de la pieza; se para y se revisa el cuchillo divisor '+RC('la escuadradora')+'.','Se para y se avisa: un retroceso lanza la pieza hacia ti.'),
   ()=>Q('Un recorte pequeño se ha quedado junto al disco en marcha.','Lo dejo: paro la máquina y espero a que el disco se detenga antes de retirarlo',['Lo retiro rápido con la mano','Lo aparto con un listón con el disco en marcha','Paso el brazo por encima del disco para cogerlo'],'No se retiran recortes ni se pasa el brazo por encima del disco en marcha '+RC('la escuadradora')+'.','Nada de retirar recortes con el disco en marcha.')],
  def:[{p:'protector',d:'El protector está subido muy por encima de la pieza: deja casi todo el disco al descubierto.',x:'El protector va bajado hasta casi tocar la pieza.',inc:'sinres'},
   {p:'cuchillo',d:'El cuchillo divisor está desmontado.',x:'Sin cuchillo divisor la pieza se cierra sobre el disco y retrocede. Quitarlo es una incidencia muy grave.',inc:'anular'},
   {p:'aspiracion',d:'La manguera de aspiración está suelta.',x:'Toda máquina trabaja con la aspiración conectada: el polvo de madera es cancerígeno en exposición prolongada.',inc:'comprobar'},
   {p:'disco',d:'El disco está subido casi al máximo para cortar un tablero de 19 mm.',x:'El disco sobresale de la pieza entre 10 y 20 mm. Demasiado alto deja más disco al descubierto.',inc:'comprobar'}],
  cambio:['Desenroscar la tuerca girándola en el sentido de giro del disco','Montar el disco nuevo con los dientes en el sentido de giro y comprobar el cuchillo divisor']},
 cep:{n:'Cepilladora',util:'las cuchillas',ref:RC('la cepilladora'),
  qs:[
   ()=>Q('¿Cuánto material quitas en cada pasada?','De 1 a 2 mm: pasadas finas',['5 mm, como en la regruesadora','10 mm, para terminar antes','Todo de una vez'],'En la cepilladora, pasadas finas, de 1 a 2 mm '+RC('la cepilladora')+'.','Pasadas finas, de 1 a 2 mm.'),
   r=>{const c=pick(r,['cara','canto']);return Q(`Vas a cepillar el ${c} de referencia. ¿Dónde va el puente protector?`,c==='cara'?'Bajado sobre la pieza, cubriendo el eje':'Arrimado a la pieza, cubriendo el resto del eje',['Levantado del todo, para ver bien las cuchillas','Quitado: estorba con piezas anchas','Da igual, mientras no toques el eje'],'El puente protector siempre cubre el eje: bajado sobre la pieza al cepillar la cara y arrimado a ella al cepillar el canto '+RC('la cepilladora')+'.','El puente siempre cubre el eje.')},
   r=>{const l=pick(r,[180,220,250,280]),g=pick(r,[12,15,18]);return Q(`Tienes que cepillar una pieza de <b>${l} mm</b> de largo y <b>${g} mm</b> de grueso.`,'Con empujador: es una pieza corta y fina',['Con las manos, que así se controla mejor','Sujetándola de los extremos con los dedos','Mejor sin puente protector, para que pase'],'Piezas cortas, finas o estrechas: con empujador '+RC('la cepilladora')+'.','Pieza corta o fina: empujador.')},
   ()=>Q('¿Cómo colocas la pieza para cepillar la cara de referencia?','Con la cara más cóncava hacia abajo, sobre la mesa de entrada',['Con la cara convexa hacia abajo, para que balancee','De canto contra la guía','Da igual la cara, la cepilladora la endereza'],'La cara más cóncava, hacia abajo y apoyada en la mesa de entrada '+RC('la cepilladora')+'.','Cara cóncava abajo, sobre la mesa de entrada.'),
   ()=>Q('¿Dónde van tus manos al cepillar?','Sobre la pieza, pasando por encima del puente, nunca por delante del eje',['Empujando la pieza por la testa, a la altura del eje','Por debajo de la pieza','Una sujeta la pieza y la otra el puente'],'Las manos van sobre la pieza y pasan por encima del puente '+RC('la cepilladora')+'.','Manos sobre la pieza y por encima del puente.'),
   ()=>Q('¿Cómo deben estar las mesas de la cepilladora?','La de salida, enrasada con el filo de las cuchillas; la de entrada, más baja lo que quieres quitar',['Las dos a la misma altura','La de salida más baja que la de entrada','La de entrada enrasada con las cuchillas'],'La mesa de salida está enrasada con el filo de las cuchillas y la de entrada, más baja en la medida de la viruta '+RM('cepilladora')+'.','Salida enrasada con las cuchillas; entrada más baja.'),
   ()=>Q('Acabas de parar la cepilladora y el eje parece quieto. ¿Limpias ya la mesa?','No: el eje puede seguir girando aunque parezca quieto (efecto estroboscópico); espero a que pare del todo',['Sí, si ya no se oye','Sí, con la mano, con cuidado','Sí, con un listón aunque gire'],'Por el efecto estroboscópico, el eje parece parado sin estarlo. Nunca se limpian las mesas con la máquina en marcha '+RM('cepilladora')+'.','Se espera a que el eje pare de verdad.')],
  imp:[()=>Q('Al revisar la pieza antes de cepillar ves una grapa clavada.','La quito antes de cepillar: el metal rompe la cuchilla y sale proyectado',['La cepillo igual: la cuchilla la corta','Cepillo por la otra cara y listo','Le doy la vuelta para que la grapa quede arriba'],'Se comprueba que la pieza no tenga clavos, grapas ni nudos sueltos antes de empezar '+RC('la cepilladora')+'.','Sin metales: rompen la cuchilla y salen proyectados.')],
  def:[{p:'puente',d:'El puente protector está quitado y el eje queda al descubierto.',x:'El puente protector cubre siempre el eje. Quitarlo es una incidencia muy grave.',inc:'anular'},
   {p:'aspiracion',d:'La manguera de aspiración está suelta.',x:'La aspiración va conectada antes de arrancar.',inc:'comprobar'},
   {p:'guia',d:'La guía está inclinada, no a 90° con la mesa.',x:'La guía va a 90° con la mesa: con ella se saca el canto a escuadra. Se ajusta con la máquina parada.',inc:'comprobar'}],
  cambio:['Aflojar los tornillos de las cuchillas con la llave','Montar las cuchillas, enrasarlas con la mesa de salida y apretar los tornillos']},
 reg:{n:'Regruesadora',util:'las cuchillas',ref:RC('la regruesadora'),
  qs:[
   r=>{const g1=pick(r,[18,20,22,25,27]),dd=ri(r,6,19),g0=g1+dd;return N(`Una pieza de <b>${g0} mm</b> de grueso tiene que quedar a <b>${g1} mm</b>. Como mucho se quitan 5 mm por pasada. ¿Cuántas pasadas haces como mínimo?`,[{id:'n',et:'Pasadas',sol:Math.ceil(dd/5),tol:0,u:''}],`Hay que quitar ${dd} mm, a 5 mm como mucho por pasada ${RC('la regruesadora')}.`,`Correcto: ${dd} mm en pasadas de 5 mm como mucho son ${Math.ceil(dd/5)} pasadas; la última, fina.`)},
   r=>{const l=pick(r,[250,300,350,380,450,600,900]),ok=l>=400;return Q(`¿Puedes regruesar una pieza de <b>${l} mm</b> de largo?`,ok?'Sí: supera el largo mínimo de 400 mm':'No: es más corta que la distancia entre rodillos (largo mínimo 400 mm)',ok?['No: tiene que medir al menos 1000 mm','No: las piezas cortas van a la cepilladora con la mano','Solo si se pasan dos juntas']:['Sí, empujándola con la mano hasta que la cojan los rodillos','Sí, si se pasa junto a otra más larga','Sí: no hay largo mínimo'],'No se pasan piezas más cortas que la distancia entre rodillos: largo mínimo 400 mm '+RC('la regruesadora')+'.',ok?'Supera los 400 mm: se puede regruesar.':'Por debajo de 400 mm, no se regruesa.')},
   ()=>Q('¿Dónde te colocas al pasar piezas por la regruesadora?','A un lado, nunca en línea con la pieza: puede retroceder',['Justo detrás de la pieza, empujándola','Delante de la salida, para recogerla','Mirando por la boca de entrada'],'Colócate a un lado, nunca en línea con la pieza '+RC('la regruesadora')+'.','A un lado: la pieza puede retroceder.'),
   ()=>Q('Tienes piezas de 22 mm y de 25 mm de grueso. ¿Las pasas a la vez?','No: de una en una, o juntas solo si tienen el mismo grueso',['Sí, para ahorrar tiempo','Sí, la más gruesa encima de la fina','Sí, si caben a lo ancho'],'Con piezas de distinto grueso a la vez, la fina no queda sujeta y retrocede '+RC('la regruesadora')+' '+RM('regruesadora')+'.','Nunca piezas de distinto grueso a la vez.'),
   ()=>Q('La última pieza se queda a medias bajo las lengüetas antirretroceso. ¿Qué haces?','La empujo con la pieza siguiente o con un empujador, nunca metiendo la mano bajo las lengüetas',['Meto la mano por debajo de las lengüetas y la empujo','Tiro de ella hacia atrás','Levanto el cárter con la máquina en marcha'],'No se meten las manos bajo el dispositivo antirretroceso: el tramo final se empuja con la pieza siguiente y la última con un empujador '+RM('regruesadora')+'.','Con la pieza siguiente o con un empujador.'),
   ()=>Q('La regruesadora tiene cárter abatible. ¿Qué debe cumplir?','No puede arrancar con el cárter abierto ni abrirse con la máquina en marcha',['Se puede abrir entre pieza y pieza, aunque gire','Basta con que esté cerrado al arrancar','Puede quedarse abierto si no metes la mano'],'Con cárter abatible, los elementos móviles no arrancan antes de cerrarlo y no puede abrirse mientras se mueven '+RM('regruesadora')+'.','Cerrado siempre que haya movimiento.'),
   ()=>Q('¿Para qué sirven las lengüetas antirretroceso de la regruesadora?','Frenan la pieza si intenta retroceder',['Empujan la pieza hacia dentro','Limpian la viruta','Marcan el grueso final'],'Las lengüetas antirretroceso frenan la pieza si intenta retroceder '+RC('la regruesadora')+'.','Frenan el retroceso de la pieza.')],
  imp:[()=>Q('Una pieza se ha atascado dentro de la regruesadora.','Paro, espero a que se detenga y desconecto antes de sacarla',['Meto la mano por la boca de entrada para empujarla','La empujo con otra pieza a la fuerza, con la máquina en marcha','Subo la mesa para que pase'],'No se mira ni se mete la mano por la boca de entrada. Los ajustes, con la máquina parada '+RC('la regruesadora')+'.','Parar, esperar, desconectar y luego sacarla.')],
  def:[{p:'carter',d:'El cárter protector está abierto.',x:'Con el cárter abierto el árbol de cuchillas queda accesible: la máquina no se arranca así.',inc:'sinres'},
   {p:'aspiracion',d:'La manguera de aspiración está suelta.',x:'La aspiración va conectada antes de arrancar.',inc:'comprobar'},
   {p:'pieza',d:'En la mesa de entrada hay una pieza de 250 mm de largo lista para pasar.',x:'El largo mínimo es de 400 mm: una pieza más corta no la cogen los dos rodillos.',inc:'proced'}],
  cambio:['Aflojar los tornillos de las cuchillas con la llave','Montar las cuchillas nuevas y apretar los tornillos según el fabricante']},
 tupi:{n:'Tupí',util:'la fresa',ref:RC('la tupí'),
  qs:[
   ()=>Q('¿En qué sentido avanzas la pieza en la tupí?','Contra el giro de la fresa',['A favor del giro, para que la fresa la arrastre','Da igual el sentido','Primero a favor y luego en contra'],'A favor del giro, la fresa arrastra la pieza y la lanza: se avanza siempre contra el giro '+RC('la tupí')+'.','Siempre contra el giro.'),
   ()=>Q('¿Qué fresas se usan con avance manual?','Las marcadas MAN, bien apretadas y a sus revoluciones',['Cualquiera, si corta bien','Las de mayor diámetro','Las de la CNC'],'Fresas MAN, para avance manual, bien apretadas y a sus revoluciones '+RC('la tupí')+'.','Fresas MAN.'),
   ()=>Q('Cambias a una fresa de mayor diámetro. ¿Qué pasa con las revoluciones?','Hay que bajarlas: cuanto mayor es el diámetro, menos revoluciones',['Hay que subirlas','No cambian','Se ponen al máximo para que corte limpio'],'Cuanto mayor es el diámetro de la fresa, menos revoluciones: vienen en la fresa y en la tabla de la máquina '+RC('la tupí')+'.','Más diámetro, menos revoluciones.'),
   r=>{const l=pick(r,[120,150,180,200]);return Q(`Tienes que fresar el canto de una pieza corta de <b>${l} mm</b>.`,'Con una plantilla con asas o con el carro de espigar',['A mano, sujetándola por los extremos','Con la capota quitada para ver mejor','Contra la guía y terminando con los dedos'],'Piezas cortas o estrechas: con plantilla o con el carro '+RC('la tupí')+'.','Plantilla o carro: las manos lejos de la fresa.')},
   ()=>Q('¿Qué parte de la fresa puede verse desde tu puesto?','Solo la que trabaja; el resto, cubierto por la capota, las guías y los prensores',['Toda, para controlar el corte','La mitad de delante','Ninguna: se trabaja a ciegas'],'Desde tu puesto solo debe verse la parte de la fresa que trabaja '+RC('la tupí')+'. Es trabajar a «útil no visto» '+RM('tupí')+'.','Solo asoma lo que trabaja.'),
   r=>{const mm=pick(r,[10,12,15]);return Q(`Hay que rebajar <b>${mm} mm</b> el canto de unas piezas.`,'En varias pasadas pequeñas',['De una sola pasada','Empujando más rápido para que no se queme','Con la fresa más grande que haya'],'Pasadas pequeñas; si hay que quitar mucho, en varias '+RC('la tupí')+' '+RM('tupí')+'.','En varias pasadas.')},
   ()=>Q('¿Cómo deben estar las dos medias guías?','En el mismo plano y acercadas a la fresa para cerrar el hueco',['Muy separadas, para que la fresa respire','Una adelantada respecto a la otra siempre','Quitadas, si hay plantilla o no'],'Las dos medias guías, en el mismo plano vertical y cerrando el hueco hasta la fresa '+RM('tupí')+' '+RC('la tupí')+'.','Mismo plano y hueco cerrado.'),
   ()=>Q('¿Quién puede trabajar en la tupí?','Quien está formado y sabe montar las protecciones de cada operación, y siempre avisando al profesor',['Cualquiera que haya visto cómo se usa','El primero que llegue','Cualquiera, si la pieza es pequeña'],'La tupí solo la usa personal bien formado, capaz de montar las protecciones correctas para cada operación '+RM('tupí')+'.','Solo personal formado, con aviso al profesor.')],
  imp:[()=>Q('La pieza que vas a fresar tiene un nudo suelto.','La aparto: con nudos sueltos, fendas o clavos no se fresa',['La paso igual, despacio','Le pego el nudo con cola y fresa en el momento','Fresa a favor del giro para que no salte'],'Revisa la madera: sin nudos sueltos, fendas ni clavos '+RC('la tupí')+'.','Una pieza con nudos sueltos puede romperse y salir proyectada.')],
  def:[{p:'capota',d:'La capota está quitada: la fresa y el eje quedan al descubierto.',x:'La fresa va cubierta en todo lo que no trabaja. Quitar la capota es una incidencia muy grave.',inc:'anular'},
   {p:'guias',d:'Las medias guías están muy separadas de la fresa y dejan un hueco grande.',x:'Las medias guías se acercan a la fresa para cerrar el hueco.',inc:'comprobar'},
   {p:'prensores',d:'Los prensores están subidos y no aprietan la pieza.',x:'Los prensores aprietan la pieza contra la mesa y contra la guía; así las manos quedan lejos de la fresa.',inc:'sinres'},
   {p:'aspiracion',d:'La manguera de aspiración está suelta.',x:'La aspiración va conectada antes de arrancar.',inc:'comprobar'}],
  cambio:['Aflojar la tuerca del eje y quitar la fresa','Montar la fresa MAN lo más abajo posible, con los anillos y la tuerca bien apretados y su sentido de corte igual al giro']},
 cinta:{n:'Sierra de cinta',util:'la cinta',ref:RC('la sierra de cinta'),
  qs:[
   ()=>Q('¿A qué altura pones el protector regulable?','Justo por encima de la pieza',['Arriba del todo, para ver la cinta','A media altura, siempre igual','Pegado a la mesa'],'El protector, con la guía superior, se baja hasta justo encima de la pieza: la cinta queda cubierta en todo lo que no corta '+RC('la sierra de cinta')+'.','Justo por encima de la pieza.'),
   ()=>Q('Estás terminando un corte al hilo con la guía paralela. ¿Cómo empujas el final?','Con el empujador',['Con los dedos, despacio','Tirando de la pieza desde detrás de la cinta','Con la otra pieza'],'Termina el corte con el empujador; las piezas pequeñas, siempre con él '+RC('la sierra de cinta')+'.','Con el empujador.'),
   ()=>Q('Te has equivocado de trazo a mitad de corte. ¿Sacas la pieza hacia atrás con la cinta en marcha?','No: la cinta puede salirse de los volantes',['Sí, despacio','Sí, si la cinta es ancha','Sí, girando la pieza a la vez'],'No tires de la pieza hacia atrás con la cinta en marcha: puede salirse de los volantes '+RC('la sierra de cinta')+'.','Nunca hacia atrás con la cinta en marcha.'),
   ()=>Q('Tienes que cortar una pieza redonda.','Sujeta en una cuna, nunca suelta',['Sujetándola con las dos manos junto a la cinta','Apoyada solo en la guía paralela','Haciéndola rodar mientras corta'],'Las piezas redondas o que no asientan bien se cortan sujetas en una cuna '+RC('la sierra de cinta')+'.','En una cuna.'),
   ()=>Q('¿Dónde van las guías de la cinta?','Por encima y por debajo de la mesa',['Solo por encima','Solo por debajo','No lleva guías'],'La cinta va guiada por encima y por debajo de la mesa de trabajo '+RM('sierra de cinta')+'.','Arriba y abajo de la mesa.'),
   ()=>Q('¿Dónde van tus manos al cortar en la sierra de cinta?','A los lados de la línea de corte; delante de la cinta, solo el empujador',['Delante de la cinta, empujando la pieza','Una delante y otra detrás de la cinta','Cruzadas, para sujetar mejor'],'Las manos, a los lados de la línea de corte; delante de la cinta, solo el empujador '+RC('la sierra de cinta')+'.','Manos a los lados de la línea de corte.'),
   ()=>Q('¿Qué hay que cuidar en los volantes?','Que estén en el mismo plano vertical y limpios de resina, serrín y virutas',['Que estén engrasados por fuera','Que giren lo más rápido posible','Nada: son parte del motor'],'Los volantes, en el mismo plano vertical; y el bandaje, limpio de resinas, serrín y virutas '+RM('sierra de cinta')+'.','Mismo plano y limpios.')],
  imp:[()=>Q('La cinta empieza a sonar raro mientras cortas.','Paro la máquina y aviso; no abro las puertas hasta que los volantes se detengan',['Sigo cortando más despacio','Abro la puerta del volante para mirar','Aprieto la tensión con la máquina en marcha'],'Si la cinta se rompe o suena raro, para la máquina y avisa; no abras las puertas hasta que los volantes se detengan '+RC('la sierra de cinta')+'.','Parar y avisar.')],
  def:[{p:'protector',d:'El protector regulable está subido del todo y la cinta queda al descubierto.',x:'El protector se baja hasta justo encima de la pieza.',inc:'sinres'},

  cambio:['Abrir las puertas y destensar la cinta con el volante de tensión','Montar la cinta con los dientes hacia abajo y hacia ti, tensarla, centrarla y ajustar las guías']},
 ingl:{n:'Ingletadora',util:'el disco',ref:RC('la ingletadora'),
  qs:[
   ()=>Q('¿A qué distancia del disco va la mano que sujeta la pieza?','A más de 10 cm, sin cruzar los brazos',['A 2 o 3 cm, para sujetar bien','Pegada al disco, del lado del recorte','Da igual si el protector está puesto'],'Las manos, a más de 10 cm del disco; nunca con los brazos cruzados '+RC('la ingletadora')+'.','A más de 10 cm del disco.'),
   ()=>Q('¿Cómo sujetas la pieza en la ingletadora?','Con el prensor, apoyada en la mesa y contra la guía',['A pulso, levantada de la mesa','Con la mano, sin prensor','Apoyada solo en la guía'],'La sujeción nunca es manual: se usan prensores '+RM('tronzadora')+'. La pieza, siempre apoyada en la mesa y en la guía '+RC('la ingletadora')+'.','Con prensor, nunca a pulso.'),
   ()=>Q('Cortas varias piezas iguales con un tope. ¿Cómo queda el recorte del otro lado?','Libre, nunca encajado contra el disco',['Encajado entre el disco y otro tope','Sujeto con la mano junto al disco','Da igual'],'Sujeta la pieza del lado del tope; el recorte del otro lado debe quedar libre '+RC('la ingletadora')+'.','El recorte, libre.'),
   ()=>Q('¿Puedes cortar en la ingletadora a lo largo de la fibra?','No: es solo para tronzar',['Sí, si la pieza es estrecha','Sí, con el cabezal inclinado','Sí, si se sujeta con la mano'],'La ingletadora es solo para tronzar: no se corta a lo largo de la fibra '+RC('la ingletadora')+'.','Solo para tronzar.'),
   ()=>Q('Terminado el corte, ¿qué haces?','Suelto el interruptor con el cabezal abajo, espero a que el disco pare y luego lo subo',['Subo el cabezal con el disco girando','Retiro el recorte con el disco aún girando','Dejo la máquina en marcha para el siguiente corte'],'Suelta el interruptor con el cabezal abajo y espera a que el disco se pare; después súbelo y retira pieza y recorte '+RC('la ingletadora')+'.','Esperar a que el disco pare antes de subirlo.'),
   ()=>Q('La pieza que vas a tronzar está curvada. ¿Cómo la apoyas?','Con la curva hacia la guía, tocando la guía y la mesa justo en la línea de corte',['Con la curva hacia ti','Levantada para que quede recta','Da igual cómo'],'Si en la línea de corte queda hueco, la pieza se cierra sobre el disco y lo atrapa '+RC('la ingletadora')+'.','Tocando la guía en la línea de corte.'),
   ()=>Q('¿Para qué sirve el anclaje del disco en reposo?','Impide que el cabezal baje solo: hay que liberarlo con el gatillo antes de bajar',['Para que el disco gire más rápido','Para bloquear la mesa en 45°','Para sujetar la pieza'],'La tronzadora lleva un anclaje automático del disco en reposo, con un gatillo que hay que accionar antes de bajar; así un muelle roto no deja caer el disco '+RM('tronzadora')+'.','Evita la caída brusca del disco.'),
   ()=>Q('¿Cuántas piezas cortas a la vez?','Una sola, nunca varias apiladas',['Dos, si son iguales','Todas las que quepan','Tres como máximo'],'Una sola pieza cada vez, nunca varias apiladas '+RC('la ingletadora')+'.','Una sola pieza.')],
  imp:[()=>Q('El protector móvil se engancha y no vuelve a cubrir el disco.','Paro, desconecto y aviso: el protector no se sujeta ni se anula',['Lo sujeto con cinta para que no moleste','Sigo cortando con cuidado','Lo quito hasta que lo arreglen'],'No sujetes ni anules el protector móvil '+RC('la ingletadora')+'.','Parar y avisar; nunca anular el protector.')],

 escop:{n:'Escopleadora',util:'la broca',ref:RC('la escopleadora'),
  qs:[
   ()=>Q('¿Cómo sujetas la pieza en la escopleadora?','Con el prensor, nunca a mano',['Con la mano izquierda, apretando fuerte','Apoyada en la mesa, sin sujetar','Con un compañero que la aguante'],'La pieza, siempre sujeta con el prensor: nunca a mano '+RC('la escopleadora')+'.','Con el prensor.'),
   ()=>Q('Has montado la broca. ¿Qué haces con la llave del portabrocas?','La retiro antes de arrancar',['La dejo puesta para el siguiente cambio','La dejo en la mesa, junto a la broca','La dejo puesta si la broca está bien apretada'],'La broca, bien apretada, y la llave del portabrocas, fuera '+RC('la escopleadora')+'.','La llave, fuera.'),
   ()=>Q('¿Cómo se ensancha y se limpia la caja?','Moviendo la mesa poco a poco: la broca no se fuerza de lado',['Empujando la broca hacia un lado con fuerza','A golpes, para que corte antes','Con la broca de taladrar normal'],'La broca corta bien de punta y peor de lado: forzada lateralmente vibra y puede partirse '+RC('la escopleadora')+'.','Poco a poco, sin forzar de lado.'),
   r=>{const e=pick(r,[25,30,32,35,40]);return N(`La espiga mide <b>${e} mm</b> de largo. ¿Qué profundidad das a la escopleadura?`,[{id:'p',et:'Profundidad de la caja',sol:e+2.5,tol:.5,u:'mm'}],`La caja se hace de 2 a 3 mm más profunda que el largo de la espiga ${RC('la escopleadora')}.`,`Correcto: ${e+2} o ${e+3} mm, de 2 a 3 mm más que la espiga.`)},
   ()=>Q('¿Cuándo mides la caja o sueltas la pieza?','Cuando la broca se ha parado',['Con la broca girando, para no perder tiempo','Mientras retiras la broca','Cuando la broca deja de sonar fuerte'],'Espera a que la broca pare para medir o soltar la pieza '+RC('la escopleadora')+'.','Con la broca parada.'),
   ()=>Q('¿Qué broca se monta en la escopleadora?','Una broca de escoplear, con su sentido de corte igual al giro de la máquina',['Cualquier broca de taladrar','Una broca de pala','Una broca de metal'],'Tiene dos cortes, de punta y de lado; no vale una broca de taladrar, y su sentido de corte debe ser el del giro '+RC('la escopleadora')+'.','Broca de escoplear, con el sentido de giro correcto.')],
  imp:[()=>Q('La broca vibra y hace ruido al ensanchar la caja.','Paro: la estoy forzando de lado y puede partirse',['Aprieto más para acabar antes','Subo la velocidad','La sujeto con la mano para que no vibre'],'No fuerces la broca de lado: avanza poco cada vez '+RC('la escopleadora')+'.','Una broca forzada vibra y puede partirse.')],
  def:[{p:'llave',d:'La llave está puesta en el portabrocas.',x:'Con la máquina en marcha la llave sale despedida: se retira antes de arrancar.',inc:'comprobar'},

 lij:{n:'Lijadora de banda vertical',util:'la banda',ref:'(normas de la lijadora del taller)',
  qs:[

   ()=>Q('¿Cómo debe estar la mesa de apoyo respecto a la banda?','Muy cerca, con un hueco mínimo, para que la pieza no se meta entre las dos',['Separada varios centímetros','Sin mesa: se lija a pulso','Por encima de la banda'],'Si queda hueco entre la mesa y la banda, la pieza o los dedos pueden quedar atrapados.','Hueco mínimo entre mesa y banda.'),
   r=>{const l=pick(r,[40,60,80]);return Q(`Tienes que lijar una pieza pequeña de <b>${l} mm</b>.`,'Con un soporte o una plantilla, sin acercar los dedos a la banda',['Sujetándola con la punta de los dedos','Con guantes, para no lijarte los dedos','Contra la banda, sin mesa'],'Las piezas pequeñas se sujetan con un soporte o una plantilla: los dedos, lejos de la banda.','Con soporte o plantilla.')},
   ()=>Q('¿Cómo debe ser la ropa al trabajar en la lijadora?','Ajustada, sobre todo en muñecas y codos: la banda arrastra',['Holgada, para moverse mejor','Con las mangas sueltas para no pasar calor','Da igual, la banda no corta'],'Se evitan las ropas no sujetas al cuerpo, en particular en muñecas y codos '+RM('lijadoras')+'.','Ropa ajustada.'),
   ()=>Q('Vas a cambiar la banda de lija.','Con la máquina parada y desconectada: ningún ajuste con la máquina encendida',['Con la máquina en marcha a poca velocidad','Desenchufando solo si la banda está rota','Con guantes y en marcha'],'No se hace ningún ajuste con las máquinas encendidas '+RM('lijadoras')+'.','Ajustes y cambios, con la máquina desconectada.'),
   ()=>Q('¿Por qué es tan importante la aspiración en la lijadora?','El lijado levanta mucho polvo fino, que es cancerígeno en exposición prolongada',['Para que la banda dure más','Para que la máquina haga menos ruido','No es importante si se trabaja poco tiempo'],'La exposición continuada al polvo fino de madera provoca enfermedades respiratorias y está catalogada como cancerígena '+RD('resumen 1')+'.','El polvo fino de lijado es el más peligroso.')],
  imp:[()=>Q('La banda se desplaza hacia un lado y roza la carcasa.','Paro, espero a que se detenga y aviso para centrarla',['La empujo con la mano para centrarla','Sigo lijando, ya se centrará','Aflojo la tensión con la máquina en marcha'],'Ningún ajuste con la máquina encendida '+RM('lijadoras')+'.','Parar y avisar.')],
  def:[{p:'mesa',d:'La mesa de apoyo está muy separada de la banda y deja un hueco grande.',x:'La mesa va muy cerca de la banda: en el hueco se meten la pieza o los dedos.',inc:'comprobar'},
   {p:'carcasa',d:'La carcasa que cubre la banda por detrás está abierta.',x:'Las partes móviles de la lijadora van protegidas '+RM('lijadoras')+'.',inc:'sinres'},
   {p:'aspiracion',d:'La manguera de aspiración está suelta.',x:'La aspiración va conectada antes de arrancar.',inc:'comprobar'}],
  cambio:['Abrir la carcasa y destensar la banda','Montar la banda nueva en el sentido que marca la flecha, tensarla y centrarla']}};

 taladro:{n:'Taladro atornillador',bat:1,qs:[

 circ:{n:'Sierra circular de mano',qs:[
  ()=>Q('¿Cómo debe funcionar el protector inferior de la sierra circular?','Debe volver solo a cubrir el disco; nunca se ata ni se bloquea',['Se ata abierto para ver la línea','Se quita para cortar tableros finos','Se bloquea con una cuña si molesta'],'El resguardo, operativo y nunca anulado o retirado, por mucho que «moleste» '+RD('bloque 3')+'.','El protector nunca se anula.'),
  ()=>Q('¿Qué provoca el retroceso de una sierra circular de mano?','Que el disco se bloquee o muerda la madera por un nudo, por las tensiones de la fibra o por avanzar mal',['Que el disco esté muy afilado','Cortar despacio','Usar la guía paralela'],'El retroceso ocurre cuando el disco se bloquea o muerde la madera por nudos, tensiones o una dirección de avance incorrecta '+RD('resumen 3')+'.','Nudos, tensiones o avance incorrecto.'),
  ()=>Q('Terminas el corte con la sierra circular.','Espero a que el disco se pare antes de apoyar la sierra',['La dejo en el suelo aún girando','La apoyo de lado sobre el tablero','La cuelgo del cable'],'No apoyes la herramienta mientras el órgano de corte siga en movimiento '+RD('bloque 3')+'.','Esperar a que el disco pare.'),
  ()=>Q('¿Por dónde va el cable mientras cortas?','Por detrás de mí, lejos de la línea de corte',['Por delante del disco','Por encima del tablero, en la línea de corte','Enrollado al brazo'],'Los cables discurren siempre por detrás del operario, fuera de la trayectoria de corte '+RD('resumen 3')+'.','Cable por detrás.')]},
 calar:{n:'Sierra de calar',qs:[
  ()=>Q('El tablero vibra mucho al cortarlo con la sierra de calar.','Lo sujeto al banco con sargentos',['Lo sujeto con la mano libre cerca de la hoja','Lo piso con el pie','Corto más rápido'],'Todas las piezas, rígidamente fijadas al banco con sargentos o gatos antes de accionar el gatillo '+RD('resumen 3')+'.','Pieza sujeta con sargentos.'),
  ()=>Q('Vas a cambiar la hoja de la sierra de calar.','Con la sierra desenchufada',['Con la sierra enchufada y el seguro puesto','Con la hoja aún moviéndose','Con guantes y enchufada'],'Todo cambio de accesorio exige desenchufar la herramienta '+RD('resumen 3')+'.','Desenchufada.'),
  ()=>Q('Estás cortando un tablero apoyado en el banco con la sierra de calar.','Compruebo antes que debajo de la línea de corte no hay nada ni nadie: la hoja sale por debajo',['Corto sobre la superficie del banco','Pongo la mano debajo para sujetar el recorte','Corto encima de un cable'],'Tu mano libre nunca debe estar en la trayectoria de la herramienta '+RD('bloque 3')+'.','La hoja sale por debajo de la pieza.'),
  ()=>Q('Acabas un corte curvo. ¿Cuándo sacas la hoja?','Cuando la hoja se ha parado',['Con la hoja aún moviéndose','Tirando hacia atrás en marcha','Girando la sierra en el corte'],'Espera a que el órgano de corte se detenga por completo antes de apoyar o retirar la herramienta '+RD('bloque 3')+'.','Con la hoja parada.')]},
 router:{n:'Fresadora de mano',qs:[
  ()=>Q('¿En qué sentido avanzas la fresadora de mano?','Contra el giro de la fresa',['A favor del giro, que avanza sola','Da igual','Primero a favor, luego en contra'],'A favor del giro la máquina rueda de forma descontrolada sobre la madera y se produce un rechazo inmediato '+RD('resumen 3')+'.','Siempre contra el giro.'),
  ()=>Q('Vas a cambiar la fresa.','Con la fresadora desenchufada',['Con la fresadora enchufada y el interruptor apagado','Con la fresa aún girando despacio','Con guantes de trabajo, enchufada'],'Jamás se manipula el cabezal de una máquina conectada '+RD('resumen 3')+'.','Desenchufada.'),
  ()=>Q('¿Cómo sujetas la fresadora de mano?','Con las dos manos en sus empuñaduras',['Con una mano, y con la otra sujeto la pieza','Con una mano, para tener la otra libre','Por el cable'],'Sujeta siempre la herramienta con ambas manos cuando el fabricante lo indique '+RD('bloque 3')+'.','Con las dos manos.'),
  ()=>Q('Hay que hacer un canelador profundo con la fresadora de mano.','En varias pasadas, bajando la fresa poco a poco',['De una sola pasada, empujando fuerte','Con la fresa más grande','Avanzando a favor del giro para que corte más'],'Las pasadas profundas hacen que la fresa muerda la madera y se produzca un rechazo '+RD('resumen 3')+'.','Varias pasadas poco profundas.')]},
 orbital:{n:'Lijadora orbital',qs:[
  ()=>Q('Llevas toda la mañana con la lijadora orbital y notas los dedos blancos y dormidos.','Son las vibraciones mano-brazo (síndrome de Raynaud): hay que hacer pausas y limitar el tiempo. Lo regula el RD 1311/2005',['Es el polvo de lijar; con mascarilla se quita','No tiene importancia','Es el ruido de la máquina'],'Las vibraciones mano-brazo, en uso prolongado, provocan el síndrome de Raynaud (RD 1311/2005) '+RD('bloque 3')+'.','Vibraciones: pausas y tiempos limitados.'),
  ()=>Q('Acabas de apagar la lijadora orbital y el plato todavía gira.','Espero a que se detenga por completo antes de apoyarla',['La apoyo de lado','La dejo boca abajo en el banco','La sujeto en el aire unos segundos'],'No apoyes la herramienta mientras el órgano de corte siga en movimiento '+RD('bloque 3')+'.','Esperar a que el plato pare.'),
  ()=>Q('¿Qué haces con el polvo que levanta la lijadora orbital?','Conecto la lijadora a un aspirador por su toma de extracción',['Lo soplo con aire comprimido','Lo barro con escoba al final','Nada: es poco polvo'],'Siempre que sea viable, la herramienta se conecta a un aspirador acoplado a su toma de extracción '+RD('resumen 3')+'.','Aspiración acoplada a la herramienta.'),
  ()=>Q('¿Usas guantes con la lijadora orbital?','No: en nuestro taller no se usan guantes con ninguna máquina',['Sí, contra las vibraciones','Sí, de nitrilo','Solo con lijas gruesas'],'En nuestro taller, los guantes solo se usan en el almacén, para manipular madera y tableros.','Sin guantes.')]},
 clav:{n:'Clavadora neumática',qs:[

 else if(k==='circ'){caja(g,.3,.02,.2,C3.acero,0,y,0);cil(g,.1,.008,'#9AA3A6',.0,y+.04,0,{rz:Math.PI/2});cil(g,.11,.06,'#E07B22',.04,y+.08,0,{rz:Math.PI/2,arco:Math.PI});caja(g,.1,.1,.12,'#E07B22',-.08,y+.12,0)}
 else if(k==='calar'){caja(g,.08,.1,.22,'#2F6FB0',0,y+.11,0);caja(g,.1,.015,.2,C3.acero,0,y+.05,0);caja(g,.008,.09,.02,'#9AA3A6',0,y,-.06)}
 else if(k==='router'){cil(g,.08,.02,C3.acero,0,y+.01,0);cil(g,.05,.2,'#2F6FB0',0,y+.14,0);cil(g,.015,.14,C3.negro,-.1,y+.12,0,{rz:Math.PI/2});cil(g,.015,.14,C3.negro,.1,y+.12,0,{rz:Math.PI/2})}
 else if(k==='orbital'){caja(g,.12,.03,.12,'#333',0,y+.015,0);caja(g,.1,.1,.12,'#2F6FB0',0,y+.08,0);cil(g,.02,.1,C3.negro,0,y+.12,.1,{rx:Math.PI/2})}
 else if(k==='clav'){caja(g,.06,.18,.22,'#2F6FB0',0,y+.12,0);caja(g,.05,.12,.05,C3.negro,0,y+.05,.08);manguera(g,V3(0,y+.03,.1),V3(.4,y,.4),'#E0B020',.01)}
 else{caja(g,.07,.07,.2,'#E07B22',0,y+.14,0);caja(g,.06,.14,.06,C3.negro,0,y+.05,.06);cil(g,.025,.06,'#777',0,y+.14,-.12,{rx:Math.PI/2})}}

/* la orden de trabajo rota entre intentos: dos intentos seguidos no repiten orden */
function ordenDe(nom,vez){const perm=baraja(RNG(semilla(nom+'#ordenes')),ORDENES.map((_,i)=>i));return ORDENES[perm[(Math.max(1,vez)-1)%perm.length]]}
function varias(r,okL,noL,nOk,nNo){const ok=tomar(r,okL,nOk),no=tomar(r,noL,nNo),ops=baraja(r,[...ok,...no]);return {ops,sol:ops.map((o,i)=>ok.includes(o)?i:-1).filter(i=>i>=0)}}
/* un paso de ordenar a partir de grupos: de cada grupo con varias opciones se toma una sola, para que el orden no sea dudoso */
function ordenGrupos(r,G,quitar=0){let L=G.map(g=>pick(r,g));const q=tomar(r,L.map((_,i)=>i).slice(1,-1),quitar);L=L.filter((_,i)=>!q.includes(i));const ids=L.map((_,i)=>i),ini=baraja(r,ids);if(ini.every((v,i)=>v===i))ini.reverse();return {items:ini,nom:i=>L[i],val:i=>i}}
const normQ=(r,i)=>{const [t,n]=NORMAS[i];return Q(`¿Qué norma regula ${t.charAt(0).toLowerCase()+t.slice(1)}?`,n,NORMAS.map(x=>x[1]).filter(x=>x!==n),'Repasa el marco normativo '+RD('bloque 1 y resúmenes técnicos')+'.',`${n}.`)};

const PFH='8f63732a48bea89838cc14135f3007c26eabe930788c8a8ac85c3e339ec542cd',PFURL='https://ghersan935-creator.github.io/Escuadradora/prl.html';

function pfGuia(){const li=a=>'<ol style="margin:6px 0 14px;padding-left:22px;line-height:1.5">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>',h=t=>`<h3 style="margin:16px 0 4px;font:700 19px var(--f-disp);color:var(--am)">${t}</h3>`,cu=centro()?PFURL+'?c='+encodeURIComponent(centro()):PFURL;
 return `<div style="border:2px solid #c8891e;background:#fff6e0;color:#3a2a10;border-radius:8px;padding:10px 14px;margin:0 0 6px;line-height:1.5"><b style="font-size:17px">Enlaces: cuál dar al alumnado y cuál es el suyo</b><br><b>Para el alumnado:</b> <span style="font-family:monospace;word-break:break-all">${pfEsc(cu)}</span><br><b>Para usted:</b> ese mismo enlace terminado en <span style="font-family:monospace">#profesor</span>, más la clave.<br>Es el mismo juego; solo cambia el final de la dirección. No comparta con el alumnado ni <span style="font-family:monospace">#profesor</span> ni la clave. Si quiere que el certificado lleve el nombre de su centro, cree su enlace en la pestaña «Mi centro».</div>
${h('Qué es y para quién')}<p class="ins">Un juego de una sola página sobre la <b>prevención de riesgos laborales en fabricación</b>, para el alumnado de 1.º de carpintería y mueble (Fabricación en Carpintería y Mueble y Prototipos en Carpintería y Mueble). Recorre un turno completo del aula-taller, del almacén de madera a la cabina de barnizado. Evalúa y enseña a la vez: cada fallo explica qué ha pasado y dónde repasarlo (documento de PRL, carteles de las máquinas, normas del aula-taller o manual de buenas prácticas). No necesita instalación, registro ni conexión a ningún servicio.</p>
${h('Qué aprende el alumno')}${li(['Reconocer las señales de seguridad por su forma y su color, y las normas del aula-taller.','Distinguir la protección colectiva de la individual.','Manipular, apilar y almacenar madera y tableros con seguridad (almacén y transporte).','Reconocer peligros reales en el taller y clasificarlos con la lista de incidencias de PRL del módulo, con su gravedad y su descuento.','Revisar una máquina antes de arrancarla: resguardos, aspiración, útil y pieza.','Elegir los EPI de cada puesto (sin guantes en ninguna máquina) y los de la cabina (filtro A y nitrilo).','Ordenar la puesta en marcha y el cambio de útil con la máquina desconectada.','Las normas propias de cada máquina: escuadradora, cepilladora, regruesadora, tupí, sierra de cinta, ingletadora, escopleadora y lijadora de banda vertical.','Usar con seguridad la maquinaria electroportátil y las herramientas manuales.','Leer los pictogramas de peligro, consultar la ficha de datos de seguridad y trabajar en la cabina sin riesgo de incendio o explosión.','Actuar ante un accidente (PAS y 112) y ante un conato de incendio; distinguir accidente y enfermedad profesional.','Calcular la nota de PRL de un trimestre y dejar el puesto limpio y ordenado.'])}
${h('Fases')}<table><tr><td><b>Calentamiento</b></td><td>Señales, normas del aula-taller y protección colectiva o individual. Sin nota.</td></tr><tr><td><b>1 · Taller (15 %)</b></td><td>Preparación, tres preguntas del almacén de madera, inspección del taller en 3D (6 peligros de 12 posibles, entre 16 puntos) y una de normativa.</td></tr><tr><td><b>2 · Máquinas fijas (30 %)</b></td><td>Tres máquinas de la orden de trabajo. En cada una: revisión en 3D con un fallo al azar, dos preguntas propias y un imprevisto. Además, EPI y puesta en marcha en la primera y cambio de útil en la segunda.</td></tr><tr><td><b>3 · Electroportátiles (20 %)</b></td><td>Dos herramientas: EPI, comprobaciones antes de enchufar, dos preguntas de cada una, doble aislamiento, herramientas manuales y normativa.</td></tr><tr><td><b>4 · Acabados (20 %)</b></td><td>Pictogramas de la etiqueta, ficha de seguridad, EPI de la cabina, orden de trabajo en la cabina, cinco preguntas y normativa.</td></tr><tr><td><b>5 · Fin del turno (15 %)</b></td><td>Accidente o enfermedad, PAS, qué hacer mientras llega la ayuda, 112, extintor, clasificar incidencias, nota de PRL de un trimestre, limpieza final y normativa.</td></tr></table>
${h('Cómo se puntúa')}<p class="ins">Cada fase parte de 10. Cada error resta 0,25 (también los de PRL más graves: el aviso explica cuánto restarían en la nota real) y cada ayuda gráfica, 0,5. Repetir el mismo error sin cambiar nada no vuelve a restar. No se avanza con una respuesta mal. El certificado dice <b>«Apto»</b> solo con un 5 o más de nota final <b>y</b> un 5 o más en las máquinas fijas.</p>
${h('Ayudas que ofrece el juego')}${li(['<b>Ejemplo resuelto</b> al empezar cada fase. No resta.','<b>Instrucciones grandes</b> la primera vez que se entra en cada fase, con su recordatorio en el mismo sitio.','<b>Pista al fallar</b>, con la referencia al material donde está la explicación. Resta solo el error (0,25).','<b>Ayuda gráfica</b> en la inspección (señala un objeto con peligro) y en la revisión de las máquinas (resalta la parte con el fallo). Resta 0,5.','<b>Taller y máquinas en 3D</b> que se giran con el ratón, con las partes de cada máquina rotuladas. Si el ordenador no admite 3D, el juego muestra un plano y descripciones equivalentes.'])}
${h('Por qué no sirve copiar')}<p class="ins">La orden de trabajo (10 distintas) rota entre intentos y decide las máquinas, las herramientas y el producto de acabado. Dentro de ella cambian al azar: los 6 peligros de la inspección y su variante, el fallo de cada máquina, las preguntas de cada banco y sus datos numéricos (gruesos, largos, anchos, espigas), el accidente, el fuego, las incidencias del trimestre y el orden de todas las opciones.</p>
${h('Cómo usarlo en clase')}<p class="ins">Una partida dura aproximadamente entre 60 y 80 minutos la primera vez. Conviene tener a mano el documento de PRL, la presentación y los carteles de las máquinas. La partida se guarda sola en el ordenador y se puede llevar a otro con «Guardar en un archivo». El alumno puede repetir cuantas veces quiera. Al terminar entrega el certificado PDF y usted lo comprueba en la pestaña «Comprobar certificados». Superar el juego no autoriza a usar ninguna máquina.</p>
${h('Criterios del taller aplicados')}${li(['Incidencias: lista del sistema de evaluación de PRL del 25/08/2026 (leves, graves y muy graves).','EPI en todas las máquinas, fijas y portátiles: gafas o pantalla, protección auditiva, calzado de seguridad y ropa ajustada. La mascarilla es opcional. Ningún guante en máquinas ni con herramientas manuales, tampoco al cambiar el útil; los guantes, solo en el almacén para manipular madera y tableros.','En la cabina, a pistola: gafas o pantalla, mascarilla con filtro para vapores orgánicos (tipo A), guantes de nitrilo, calzado y ropa de trabajo o mono.','Escuadradora: sin incisor; disco de 10 a 20 mm sobre la pieza; empujador con piezas de hasta 250 mm y con la guía lateral; guía retrasada como tope; la tuerca del disco se afloja en el sentido de giro.','En el almacén el alumno trabaja con autonomía, con el profesor presente; al almacén de herrajes y herramientas no entra.','Criterios propuestos por el autor del juego y pendientes de revisión: los de la lijadora de banda vertical (apoyo en la mesa donde baja la banda, hueco mínimo entre mesa y banda, soporte para piezas pequeñas), los de la pistola de calor y algunos de la sierra de calar y la clavadora neumática (zona bajo el corte, desconectar el aire antes de desatascar).'])}
${h('Limitaciones')}<p class="ins">No enseña el tacto de las máquinas. No hay servidor: las partidas y el número de intento se guardan en el navegador de cada alumno. El código del certificado detecta cambios en el nombre o en la nota, pero el archivo del juego es público; si la nota cuenta para la evaluación, el certificado no debería ser la única prueba.</p>
${h('Autoría y uso')}<p class="ins">${AUTORIA} Esta página y su clave son solo para el profesorado: no las comparta con el alumnado.</p>`}

 else if(a==='mcomp')compMulti();
 else if(a==='ocomp')compOrden();
 else if(a==='oup'||a==='odn'){const o=G.st.o,i=+v,j=a==='oup'?i-1:i+1;[o[i],o[j]]=[o[j],o[i]];G.msg=null;pinta()}
 else if(a==='vt'){const s=G.st.sel=G.st.sel||new Set(),i=+v;s.has(i)?s.delete(i):s.add(i);G.msg=null;pintaPanel()}
 else if(a==='vcomp')compVarias();
 else if(a==='ecomp')compEpi();
 else if(a==='idec')decideInsp();
 else if(a==='icer'){G.st.cur=null;G.msg=null;pintaPanel();syncVista()}
 else if(a==='parte')tocaParte(v);
 else if(a==='ayuda')usarAyuda();
 else if(a==='zoom')zoom(+v);
 else if(a==='t3p'){if(T3.vista&&T3.vista.cfg.presets)T3.vista.ir(T3.vista.cfg.presets[v])}
 else if(a==='desc')descargar();
 else if(a==='otra'){REV=false;G=nuevo();pinta()}
 else if(a==='pfent')pfEntra();
 else if(!PFOK){}
 else if(a==='pftab'){PFT=v;pinta()}
 else if(a==='compC'){const n=$('#pn').value,c=$('#pc').value;G.prof={n,c,r:await compCert(n,c)};pinta()}
 else if(a==='pfsal'){PFOK=false;REV=false;try{localStorage.removeItem('prof-'+JUEGO)}catch(e){}G=nuevo();G.fase='prof';G.prof={n:'',c:'',r:null};pinta()}
 else if(a==='pfrev'){REV=true;revEmpieza();pinta()}
 else if(a==='pfcen'){PFC=($('#pfc').value||'').replace(/[<>&"'`]/g,'').replace(/\s+/g,' ').trim();pinta()}
 else if(a==='pfcop'){try{navigator.clipboard.writeText(PFURL+'?c='+encodeURIComponent(PFC));el.textContent='Copiado'}catch(e){}}
 else if(REV&&a==='revF'){G.fase=v;G.ip[v]=0;G.st={};G.msg=null;pinta()}
 else if(REV&&a==='revRes')resolver();
 else if(REV&&a==='revFin'){G.fase='fin';emitir();pinta()}
 else if(REV&&a==='revSal'){REV=false;G=nuevo();G.fase='prof';G.prof={n:'',c:'',r:null};pinta()}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;if(t.dataset&&t.dataset.nf){e.preventDefault();compNum(t.dataset.nf,t.value)}else if(t.id==='pfk')pfEntra();else if(t.id==='nom'){const b=$('[data-a="empezar"]');if(b)b.click()}else if(t.id==='pfc'){const b=$('[data-a="pfcen"]');if(b)b.click()}});
document.addEventListener('change',e=>{const t=e.target;if(!t.isConnected)return;if(t.dataset.nf)compNum(t.dataset.nf,t.value);else if(t.dataset.mi!==undefined){G.st.v[t.dataset.mi]=t.value;G.st.mal&&(G.st.mal[t.dataset.mi]=false);t.className=''}});
$('#fpar').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)cargaPartida(await f.text())});
/* zoom y desplazamiento del dibujo plano; pulsar el plano del taller */
(()=>{const h=$('#hoja');let pan=null;h.addEventListener('wheel',e=>{if(!$('#hoja svg'))return;e.preventDefault();const r=h.getBoundingClientRect();zoom(e.deltaY<0?1:-1,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
 h.addEventListener('pointerdown',e=>{if(!$('#hoja svg'))return;pan={x:e.clientX,y:e.clientY,mov:false,vb:G.vb?[...G.vb]:null}});
 h.addEventListener('pointermove',e=>{if(!pan||!pan.vb)return;const d=Math.hypot(e.clientX-pan.x,e.clientY-pan.y);if(d>6)pan.mov=true;if(!pan.mov)return;const r=h.getBoundingClientRect(),v=pan.vb;G.vb=[Math.max(0,Math.min(VW-v[2],v[0]-(e.clientX-pan.x)*v[2]/r.width)),Math.max(0,Math.min(VH-v[3],v[1]-(e.clientY-pan.y)*v[3]/r.height)),v[2],v[3]];aplicaVb()});
 h.addEventListener('pointerup',e=>{const p0=pan;pan=null;if(!p0||p0.mov)return;const g=e.target.closest('[data-o]');if(g){tocaPunto(g.dataset.o);pintaVis()}})})();
G=nuevo();pinta();
function vistaProfesor(){if(location.hash==='#profesor'&&(G.fase==='inicio'||G.fase==='prof')){G.fase='prof';G.prof={n:'',c:'',r:null};pinta()}}
addEventListener('hashchange',vistaProfesor);vistaProfesor();

</script>
</body>
