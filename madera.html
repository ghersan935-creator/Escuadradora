<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Del árbol al mueble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Misma familia visual que «Del plano al corte»: el dibujo a la izquierda y el trabajo a la derecha. */
:root{
  color-scheme:dark;
  --bg:#1C2B28; --panel:#26383A; --panel2:#30464A; --ink:#EEF3EC; --ink2:#AFC0B9; --line:#47605F;
  --am:#F2C230; --ro:#EE6049; --ve:#63D192; --az:#8DB6FF;
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow","Segoe UI",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
select{background:#101A18;border:1px solid var(--line);padding:5px 6px;max-width:100%}
:focus-visible{outline:2px solid var(--am);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "vis der";gap:10px}
#app.ancho{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "der"}
#app.ancho #vis{display:none}
header{grid-area:top;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
h1{margin:0;font:700 26px/1 var(--f-disp);letter-spacing:.01em}
h1 small{display:block;font:500 12px/1.2 var(--f-body);letter-spacing:0;opacity:.8;margin-top:3px}
#etapas{display:flex;gap:3px;flex:1 1 auto;min-width:0;overflow-x:auto}
#etapas span{padding:3px 9px;font:600 15px var(--f-disp);letter-spacing:.03em;color:var(--ink2);white-space:nowrap;border-bottom:2px solid var(--line)}
#etapas span.hecho{color:var(--ve);border-color:var(--ve)}
#etapas span.ya{color:var(--ink);border-color:var(--am)}
.nota{display:flex;align-items:baseline;gap:7px;margin-left:auto;color:var(--ink2);font-size:13px}
.nota b{font:600 22px var(--f-num);color:var(--ink)}
#vis{grid-area:vis;background:var(--panel);border:1px solid var(--line);min-height:0;display:flex;flex-direction:column;overflow:hidden}
#vtabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--line);min-height:38px}
#vtabs .tit{font:600 16px var(--f-disp);letter-spacing:.03em;color:var(--ink2)}
#vtabs .zoom{margin-left:auto;display:flex;gap:3px}
#vtabs button{border:1px solid var(--line);background:var(--panel2);padding:3px 9px;font:600 15px var(--f-disp);min-width:32px}
#hoja{background:#8C9792;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px;touch-action:none;overflow:hidden;position:relative}
#hoja.html{background:#E9E5DA;align-items:flex-start;overflow:auto;touch-action:auto;padding:12px}
#hoja svg{display:block;width:100%;height:100%;max-height:100%;user-select:none;-webkit-user-select:none}
#der{grid-area:der;background:var(--panel);border:1px solid var(--line);overflow:auto;min-height:0;padding:12px 14px 14px;min-width:0}
h2{margin:0 0 6px;font:700 26px/1.1 var(--f-disp);text-wrap:balance}
p.ins{margin:0 0 10px;color:var(--ink2)}
p.ins b{color:var(--ink)}
.enun{font-size:17px;line-height:1.45;margin:0 0 12px}
.enun b{color:var(--am)}
.msg{margin:0 0 10px;padding:8px 11px;border:1px solid var(--line);background:#101A18;font-weight:500}
.msg.mal{border-color:var(--ro);color:#FFD4CB}
.msg.bien{border-color:var(--ve);color:#CFF3DE}
.pri{border:0;background:var(--am);color:#1C2B28;font-weight:600;padding:9px 16px}
.pri:disabled{opacity:.42;cursor:not-allowed}
.sec{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;font-weight:500}
.sec:disabled{opacity:.42;cursor:not-allowed}
.fila{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input.txt{width:100%;max-width:360px;padding:8px 9px;background:#101A18;border:1px solid var(--line);margin:0 0 10px;display:block}
label.et{display:block;margin:0 0 3px;font-size:13px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 14px var(--f-disp);letter-spacing:.03em;text-align:left;color:var(--ink2);padding:3px 5px;border-bottom:1px solid var(--line)}
td{padding:3px 5px;border-bottom:1px solid rgba(71,96,95,.55);vertical-align:top}
.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.banda{background:var(--panel2);padding:3px 6px;font:600 15px var(--f-disp);letter-spacing:.04em;margin-top:10px}
.cert{display:block;width:100%;max-width:1150px;border:1px solid var(--line);margin:0 0 8px}
.cod{display:block;font:600 14px var(--f-num);margin-bottom:8px;word-break:break-all}
.res2{font-weight:600;margin:10px 0}
.ayu{font-size:13px;color:var(--ink2);margin:6px 0}
.fant{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--am);color:#1C2B28;font-weight:600;padding:5px 10px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.por{border:1px solid var(--am);background:#101A18;padding:10px 12px;margin:0 0 10px;line-height:1.42;position:relative}
.por b.t{color:var(--am);font:600 16px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
.por.grande{font-size:17px;padding:14px 40px 14px 16px}
.por .x{position:absolute;right:6px;top:6px;border:1px solid var(--line);background:var(--panel2);width:30px;height:30px;font-size:18px;line-height:1;padding:0}
.ops{display:grid;gap:6px;margin:0 0 10px}
.op{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);padding:9px 11px;font-size:15.5px}
.op:hover{border-color:var(--am)}
.op i{flex:0 0 24px;height:24px;border:1px solid var(--ink2);font:600 14px/22px var(--f-num);font-style:normal;text-align:center;color:var(--am)}
.op.mal{border-color:var(--ro);background:#3a201b;color:#FFD4CB}
.op.bien{border-color:var(--ve);background:#16302A;color:#CFF3DE}
.op:disabled{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:2px solid var(--line);background:var(--panel2);padding:6px 12px;font:600 16px var(--f-disp);letter-spacing:.03em;touch-action:none;user-select:none}
.chip.sel{border-color:var(--am);background:#3b4a2a}
.chip.ok{border-color:var(--ve);color:var(--ve);background:#16302A;cursor:default}
.campo{display:grid;grid-template-columns:minmax(0,1fr) 120px 40px;gap:8px;align-items:center;margin:0 0 8px}
.campo label{font-size:15px}
.campo input{width:100%;padding:7px 8px;background:#101A18;border:1px solid var(--line);text-align:right;font:500 16px var(--f-num)}
.campo input.ok{border-color:var(--ve);color:var(--ve);background:#16302A}
.campo input.mal{border-color:var(--ro);color:#FFD4CB;background:#3a201b}
.campo.ancho{grid-template-columns:minmax(0,1fr)}
.campo.ancho input{text-align:left}
.campo span{color:var(--ink2);font-size:14px}
.sel2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center;margin:0 0 7px}
.sel2 select.ok{border-color:var(--ve);color:var(--ve);background:#16302A}
.sel2 select.mal,.enc select.mal{border-color:var(--ro);color:#FFD4CB;background:#3a201b}
.enc select.ok{border-color:var(--ve);color:var(--ve);background:#16302A}
.ord{display:grid;gap:5px;margin:0 0 10px}
.ord div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:5px 8px;font-size:16px}
.ord div b{font:600 15px var(--f-num);color:var(--am);width:22px}
.ord div span{flex:1}
.ord button{border:1px solid var(--line);background:#101A18;width:34px;height:30px;padding:0}
.enc{width:100%}
.enc td{padding:5px 4px}
.enc select{width:100%;font-size:14px}
.enc .pz{font-weight:600}
.enc .cond{display:block;font-size:13px;color:var(--ink2);font-weight:400}
.nc{display:inline-block;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#1C2B28;text-align:center;font:600 13px/22px var(--f-num);padding:0 4px;margin-right:4px}
.paso{font:500 13px var(--f-num);color:var(--ink2);margin:0 0 4px}
.ficha{background:#fff;color:#17201C;border:1px solid #B9C2BD;max-width:760px;width:100%;margin:0 auto;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.ficha .fc{background:#1C2B28;color:#fff;padding:10px 14px;font:700 24px var(--f-disp)}
.ficha .fc small{display:block;font:500 14px var(--f-body);opacity:.85}
.ficha table{font-size:14.5px}
.ficha td{border-bottom:1px solid #E2E5E1;padding:5px 12px}
.ficha td:first-child{color:#55615B;width:38%;font-weight:600}
.ficha .tapado{background:#D8DDD9;color:#55615B;padding:1px 8px;font-style:italic}
.anexo{background:#fff;color:#17201C;width:100%;font-size:13.5px}
.anexo th{color:#55615B;border-bottom:1px solid #B9C2BD;font-size:13.5px}
.anexo td{border-bottom:1px solid #E2E5E1}
.guiaE{background:#fff;color:#17201C;padding:12px 16px;max-width:760px;margin:0 auto;font-size:15.5px;line-height:1.45}
.guiaE li{margin:0 0 6px}.guiaE li.si{background:#FFF1B8;outline:2px solid #C8891E;padding:2px 4px}
.vf{display:flex;gap:6px;margin:0 0 10px}
.vf .op{justify-content:center}
@media (max-width:900px){
  html,body{height:auto}
  #app,#app.ancho{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "vis" "der"}
  #hoja{min-height:0;height:auto;aspect-ratio:10/7}
  .enc tr:first-child{display:none}.enc,.enc tbody,.enc tr,.enc td{display:block;width:100%}.enc tr{border-bottom:1px solid var(--line);padding:6px 0}.enc td{border:0;padding:3px 0}.enc td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--ink2)}
  #hoja.html{height:auto;max-height:none;min-height:0}
  .campo{grid-template-columns:minmax(0,1fr) 100px 34px}
  .sel2{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div id="app">
  <header><h1>Del árbol al mueble<small>Autor: Gustavo Hernández Sánchez</small></h1><div id="etapas"></div><div class="nota">Nota <b id="nota">10,00</b></div></header>
  <section id="vis"><div id="vtabs"></div><div id="hoja"></div></section>
  <section id="der"></section><input type="file" id="fpar" accept=".txt,text/plain" hidden>
</div>

 {id:'sil',n:'Pino silvestre',ci:'Pinus sylvestris',sin:'Pino Valsaín, de Soria, albar, rojo, del Norte, de Flandes, de Riga',g:'Conífera',ori:'Europa y norte de Asia',desc:'Albura amarillo pálido, duramen rojizo. Fibra recta, grano medio a fino. Nudos pequeños a grandes, sanos y saltadizos, medianamente frecuentes; pequeñas bolsas de resina.',de:510,deC:'semiligera',co:.38,coC:'estable',re:1.81,reC:'tendencia media a atejar',at:true,du:1.9,duC:'blanda a semiblanda',fl:'1.057',el:'94.000',cp:'406',tr:'1.020',dur:'De medio a poco durable',imp:'Albura impregnable; duramen de poco a no impregnable',mec:'Todo fácil; secado rápido con riesgo pequeño de deformaciones y fendas.',apl:'Mueble rústico y juvenil, carpintería de huecos, carpintería de armar, madera laminada, chapas y contrachapado, encofrados.'},
 {id:'rad',n:'Pino radiata',ci:'Pinus radiata',sin:'Pino insignis, pino de Monterrey',g:'Conífera',ori:'Plantaciones en varias zonas del mundo',desc:'Albura blanca amarillenta, duramen pardo amarillento a marrón. Fibra recta, grano medio a basto. Nudos muy abundantes (sanos); madera juvenil y de compresión.',de:500,deC:'semiligera',co:.44,coC:'estable',re:1.5,reC:'sin tendencia a atejar',at:false,du:2.15,duC:'semiblanda',fl:'874',el:'90.000',cp:'434',tr:'',dur:'Poco durable a sensible',imp:'Albura impregnable; duramen de medio a poco impregnable',mec:'Todo fácil; necesita pretaladro para clavar y atornillar.',apl:'Mobiliario rústico y juvenil, carpintería de armar, madera laminada, cercos y frisos, envases, contrachapado y alistonado. Mesilla Tilt y silla VOID.'},
 {id:'ama',n:'Pino amarillo del sur',ci:'Pinus taeda, P. elliottii, P. echinata, P. palustris',sin:'Pino melis, pino movila, pino tea',g:'Conífera',ori:'Sureste de Estados Unidos',desc:'Albura blanco amarillenta, duramen marrón rojizo. Fibra derecha, grano medio. Nudos, bolsas de resina, enteramiento y madera juvenil.',de:510,deC:'semiligera',co:.41,coC:'estable',re:1.6,reC:'sin tendencia a atejar',at:false,du:2.4,duC:'semiblanda',fl:'975',el:'130.000',cp:'492',tr:'',dur:'De medio durable a sensible',imp:'Duramen no impregnable; albura de medio a poco impregnable',mec:'La resina es su gran problema: embota cuchillas, dificulta el encolado y exige aplicar un fondo antes del acabado. Necesita pretaladro.',apl:'Mueble rústico, carpintería de huecos, carpintería de armar, chapas y contrachapados.'},
 {id:'abe',n:'Abeto',ci:'Picea abies',sin:'Abeto rojo',g:'Conífera',ori:'Centro y norte de Europa',desc:'Albura blanca amarillenta, duramen amarillo rojizo. Fibra derecha, grano medio a fino. Nudos pequeños, sanos o saltadizos, muy abundantes.',de:450,deC:'ligera',co:.44,coC:'estable',re:2.1,reC:'tendente a alabear',at:true,du:1.5,duC:'blanda',fl:'710',el:'110.000',cp:'450',tr:'',dur:'Poco durable a sensible',imp:'Albura poco impregnable; duramen no impregnable',mec:'Tiende a rajarse al clavar, con poca resistencia al arranque; el tintado queda desigual.',apl:'Carpintería de armar, madera laminada, molduras y rodapiés, chapas decorativas, instrumentos musicales, envases.'},
 {id:'cas',n:'Castaño',ci:'Castanea sativa',sin:'',g:'Frondosa',ori:'Europa',desc:'Albura blanco amarillenta, duramen marrón a marrón asalmonado. Fibra recta, grano medio. Nudos ojo de perdiz y acebolladura.',de:590,deC:'semiligera',co:.39,coC:'estable',re:1.54,reC:'sin tendencia a atejar',at:false,du:2.5,duC:'semiblanda',fl:'710',el:'100.000',cp:'460',tr:'1.280',dur:'Durable',imp:'Albura impregnable; duramen no impregnable',mec:'Secado lento, riesgo de colapso y fendas. Madera ácida: reacciona con colas alcalinas. Necesita pretaladro.',apl:'Mueble rústico de interior y exterior, carpintería de huecos, carpintería de armar, chapas decorativas, tonelería.'},
 {id:'nog',n:'Nogal americano',ci:'Juglans nigra',sin:'Nogal negro americano',g:'Frondosa',ori:'Este de Estados Unidos',desc:'Albura de blanco amarillento a pardo claro, duramen pardo rojizo a pardo oscuro. Fibra recta, a veces ondulada, grano medio.',de:610,deC:'semipesada',co:.43,coC:'estable',re:1.42,reC:'sin tendencia a atejar',at:false,du:3.6,duC:'semidura',fl:'1.010',el:'116.000',cp:'523',tr:'',dur:'Medianamente durable',imp:'Albura impregnable; duramen poco o nada impregnable',mec:'Secado lento, riesgo de colapso. Todo lo demás, fácil.',apl:'Mueble fino, talla, torneado, mueble curvado, escaleras, chapas decorativas.'},
 {id:'hay',n:'Haya',ci:'Fagus sylvatica',sin:'',g:'Frondosa',ori:'Europa',desc:'Albura y duramen de blanco anaranjado a rosa claro. Fibra recta, grano fino. Tensiones de crecimiento; falso corazón rojo (ataque cromógeno).',de:730,deC:'pesada',co:.51,coC:'nerviosa',re:2.05,reC:'tendencia a atejar',at:true,du:4.0,duC:'semidura',fl:'1.100',el:'145.000',cp:'580',tr:'1.200',dur:'Sensible',imp:'Impregnable',mec:'Secado difícil y lento. Se curva, tornea y talla bien; toma muy bien los tintes.',apl:'Ebanistería fina, curvado y torneado, tarimas, contrachapados, artículos deportivos.'},
 {id:'fre',n:'Fresno europeo',ci:'Fraxinus excelsior, F. angustifolia',sin:'',g:'Frondosa',ori:'Europa',desc:'Albura y duramen de blanca a blanca rosada. Fibra recta, grano medio. Nudos ojo de perdiz; falso corazón oscuro.',de:690,deC:'semipesada',co:.45,coC:'estable a nerviosa',re:1.64,reC:'sin tendencia a atejar',at:false,du:4.2,duC:'semidura',fl:'1.130',el:'129.000',cp:'510',tr:'1.450',dur:'Sensible',imp:'Medianamente impregnable',mec:'Se curva bien. Da problemas con las colas de resorcina; necesita pretaladro.',apl:'Mueble rústico y fino, tarimas, molduras, chapas, artículos deportivos.'},
 {id:'rob',n:'Roble blanco americano',ci:'Quercus alba',sin:'',g:'Frondosa',ori:'Estados Unidos y Canadá',desc:'Albura de crema a marrón claro, duramen de marrón amarillo pálido a marrón oscuro. Fibra recta, grano de medio a basto. Es la frondosa americana más comercial en el mercado español.',de:null,deT:'670–770',deC:'semipesada',co:.48,coC:'medianamente nerviosa',re:1.67,reC:'sin dato de tendencia',at:null,du:null,duT:'33 Brinell',duC:'dura',fl:'≈ 1.030',el:'≈ 132.600',cp:'≈ 490–510',tr:'',dur:'Durable a medianamente durable',imp:'Albura medianamente impregnable; duramen no impregnable',mec:'Secado lento, con riesgo de fendas superficiales. Colas alcalinas y ácidas pueden dar problemas; necesita pretaladro. Acabado fácil.',apl:'Mueble de interior, carpintería de interior (puertas, ventanas, suelos, frisos), carpintería estructural, tonelería, chapas y contrachapados.'},

 let o='';if(!G.ins[f]&&p.t!=='finfase')o+=`<div class="por grande"><b class="t">${FASES.find(x=>x[0]===f)[1]}</b>${INS[f]}<br><span class="ayu" style="font-size:15px">Cada fallo resta 0,25 y te da una pista. No se avanza con una respuesta mal: puedes intentarlo las veces que haga falta. Si en un paso aparece el botón de ayuda gráfica, usarla resta 0,5.</span><button class="x" data-a="insX" aria-label="Cerrar instrucciones">×</button></div>`;
 if(p.t==='finfase')return o+resumenFase(f,false);
 o+=`<div class="paso">${FASES.find(x=>x[0]===f)[1]} · paso ${i+1} de ${tot}${G.ins[f]?` · <a href="#" data-a="insO" style="color:var(--ink2)">instrucciones</a>`:''}</div><h2>${esc(p.tit||'')}</h2>`;
 if(p.t==='demo')return o+`<div class="por"><b class="t">Ejemplo resuelto</b>No cuenta para la nota.</div>${p.html}<div class="fila" style="margin-top:12px"><button class="pri" data-a="sig">Entendido, empiezo</button></div>`;
 if(p.enun)o+=`<p class="enun">${p.enun}</p>`;
 o+=({elige:cElige,num:cNum,lag:cLag,multi:cMulti,etiq:cEtiq,orden:cOrden,listones:cListones,encargo:cEncargo}[p.t]||(()=>''))(p);
 o+=MSG();
 if(p.ay&&!G.st.hecho&&f!=='cal')o+=`<div class="fila" style="margin:6px 0"><button class="sec" data-a="ayuda" ${p.t==='etiq'&&!G.st.sel?'disabled':''}>${G.st.ayV?'Ayuda gráfica activada':'Ayuda gráfica (−0,5)'}</button><span class="ayu">${p.t==='etiq'?'Elige antes una etiqueta: la ayuda señala dónde va. ':''}${G.st.ayV&&p.t!=='etiq'?'<a href="#" data-a="ayNo" style="color:var(--ink2)">volver al dibujo</a>':''}</span></div>`;
 if(G.st.hecho)o+=`<div class="fila" style="margin-top:8px"><button class="pri" data-a="sig">Siguiente →</button></div>`;
 return o}
function cElige(p){const st=G.st,ops=p.ops;return `<div class="ops">${ops.map((t,i)=>{const mal=(st.mal||[]).includes(i),bien=st.hecho&&(p.libre?i===p.sol:i===st.ok);return `<button class="op${mal?' mal':''}${bien?' bien':''}" data-a="op" data-v="${i}" ${st.hecho?'disabled':''}><i>${'ABCDEFGH'[i]}</i><span>${esc(t)}</span></button>`}).join('')}</div>`}
function cNum(p){const st=G.st;st.ok=st.ok||{};return p.campos.map(c=>{const ok=st.ok[c.id],v=ok?n1(c.sol):(st.v&&st.v[c.id])||'';return `<div class="campo"><label for="nf-${c.id}">${esc(c.et)}</label><input id="nf-${c.id}" data-nf="${c.id}" inputmode="decimal" autocomplete="off" class="${ok?'ok':st.mal&&st.mal[c.id]?'mal':''}" value="${esc(ok?(c.dec?Number(c.sol).toFixed(c.dec).replace('.',','):v):v)}" ${ok?'readonly':''}><span>${esc(c.u||'')}</span></div>`}).join('')+(st.hecho?'':`<p class="ayu">Escribe el número y pulsa <b>Intro</b> (o la tecla de tabulación). La coma o el punto valen como separador decimal.</p>`)}

function cOrden(p){const st=G.st;st.o=st.o||[...p.items];return `<div class="ord">${st.o.map((id,i)=>`<div><b>${i+1}</b><span>${esc(p.nom(id))}</span>${st.hecho?'':`<button data-a="oup" data-v="${i}" aria-label="Subir" ${i?'':'disabled'}>▲</button><button data-a="odn" data-v="${i}" aria-label="Bajar" ${i<st.o.length-1?'':'disabled'}>▼</button>`}</div>`).join('')}</div>${st.hecho?'':'<div class="fila"><button class="pri" data-a="ocomp">Comprobar</button></div>'}`}

function cEncargo(p){const st=G.st;st.v=st.v||p.filas.map(()=>({m:'',r:'',c:''}));st.ok=st.ok||p.filas.map(()=>({}));st.mal=st.mal||p.filas.map(()=>({}));
 const sel=(i,k,L)=>`<select data-ef="${i}:${k}" class="${st.ok[i][k]?'ok':st.mal[i][k]?'mal':''}" ${st.ok[i][k]||st.hecho?'disabled':''} aria-label="${k} de ${esc(p.filas[i].n)}"><option value="">Elige…</option>${L.map(o=>`<option ${st.v[i][k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 return `<table class="enc"><tr><th>Pieza</th><th>Material</th><th>Revestimiento de la cara</th><th>Canto</th></tr>${p.filas.map((f,i)=>`<tr><td class="pz"><span class="nc">${i+1}</span>${esc(f.n)}<span class="cond">${esc(USOS[f.u].t)}</span></td><td data-l="Material">${sel(i,'m',MATS)}</td><td data-l="Revestimiento de la cara">${sel(i,'r',REV_OPS)}</td><td data-l="Canto">${sel(i,'c',CANTO_OPS)}</td></tr>`).join('')}</table>${st.pistas&&st.pistas.length&&!st.hecho?`<ul class="ayu" style="margin:8px 0;padding-left:18px">${st.pistas.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}${st.hecho?'':'<div class="fila" style="margin-top:8px"><button class="pri" data-a="ecomp">Comprobar</button><span class="ayu">Se comprueban todas las casillas a la vez; cada casilla mal resta 0,25.</span></div>'}`}
function resumenFase(f,vis){const i=ORDEN.indexOf(f),sig=ORDEN[i+1];if(vis)return `<div class="guiaE"><p style="font:700 28px Barlow Condensed,Arial;margin:0 0 6px">${f==='cal'?'Calentamiento terminado':'Fase terminada: '+NOMF[f]}</p>${f==='cal'?'<p>Ahora empieza lo que cuenta para la nota.</p>':`<p style="font-size:20px">Nota de la fase: <b>${coma(notaB(f))}</b></p><p>Errores: ${G.f[f]||0} · Ayudas gráficas: ${G.a[f]||0}</p>`}</div>`;
 return `<h2>${f==='cal'?'Calentamiento terminado':'Fase terminada'}</h2>${f==='cal'?'<p class="ins">Ya conoces por qué la madera es uno de los mejores materiales que existen. Ahora empiezan las fases que cuentan para la nota.</p>':`<p class="enun">${NOMF[f]}: nota <b>${coma(notaB(f))}</b> · ${G.f[f]||0} errores · ${G.a[f]||0} ayudas gráficas.</p>`}<div class="fila"><button class="pri" data-a="sig">${sig?'Seguir: '+(FASES.find(x=>x[0]===sig)[1]):'Ver el certificado'}</button></div>`}

function numDe(t){const v=parseFloat(String(t).trim().replace(/\s/g,'').replace(',','.'));return isFinite(v)?v:null}
function compNum(id,val){const p=paso(),c=p.campos.find(x=>x.id===id),st=G.st;if(!c||(st.ok&&st.ok[id])||st.ult===id+'='+val)return;st.ult=id+'='+val;st.v=st.v||{};st.v[id]=val;st.mal=st.mal||{};if(!String(val).trim())return;const v=numDe(val);
 if(v!==null&&Math.abs(v-(c.ex!==undefined?c.ex:c.sol))<=c.tol+1e-9){st.ok[id]=true;st.mal[id]=false;G.msg=null;if(p.campos.every(x=>st.ok[x.id]))return hecho(p.exp);pinta();const nx=p.campos.find(x=>!st.ok[x.id]);if(nx)setTimeout(()=>{const e=$('#nf-'+nx.id);if(e)e.focus()},20);return}
 st.mal[id]=true;const pi=typeof p.pista==='function'?p.pista(v):typeof p.pista==='object'?p.pista[id]:p.pista;msgM((v===null?'Escribe un número. ':'No es correcto. ')+pi,v===null?undefined:errar(id+'='+v));pinta();setTimeout(()=>{const e=$('#nf-'+id);if(e){e.focus();e.select()}},20)}
function compLag(val){const p=paso(),st=G.st;if(st.hecho||st.ult===val)return;st.ult=val;st.v=val;const N=(String(val).match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>+x.replace(',','.'));if(!N.length)return;
 if(N.length===3&&N.every((v,i)=>v===p.sol[i]))return hecho(p.exp);st.malv=true;
 const mismo=N.length===3&&[...N].sort((a,b)=>a-b).join()===[...p.sol].sort((a,b)=>a-b).join();msgM(N.length!==3?'Hacen falta tres medidas: largo, ancho y grueso. '+p.pista:mismo?'Las medidas son esas, pero no están en su orden. '+p.pista:'Alguna medida no es la de la pieza. Léelas en las cotas del dibujo. '+p.pista,N.length===3?errar('lag='+N.join('x')):undefined);pinta()}
function compElige(i){const p=paso(),st=G.st;if(st.hecho)return;if(p.libre){st.ok=p.sol;st.mal=i===p.sol?[]:[i];G.st.hecho=true;G.msg=[(i===p.sol?'¡Bien! ':'No. ')+p.exp,i===p.sol?'bien':'mal'];autoGuarda();pinta();return}
 if(i===p.sol){st.ok=i;return hecho(p.exp)}st.mal=[...new Set([...(st.mal||[]),i])];msgM('No es correcto. '+(Array.isArray(p.pista)?p.pista[i]:p.pista),errar('op'+i));pinta()}
function compMulti(){const p=paso(),st=G.st;st.mal={};let ps=[],res=undefined,falta=false;p.items.forEach((it,i)=>{if(st.ok[i])return;const v=st.v[i];if(!v){falta=true;return}if(v===it.sol)st.ok[i]=true;else{st.mal[i]=true;const e=errar('m'+i+'='+v);res=res||e;ps.push(`${it.et}: ${p.pista[v]||''}.`)}});
 if(p.items.every((it,i)=>st.ok[i]))return hecho(p.exp);if(ps.length)msgM('Hay alguna mal. '+ps.join(' ')+' '+(p.ref||''),res);else if(falta)G.msg=['Elige una opción en cada pieza.','mal'];pinta()}
function colocar(id,x,y){const p=paso(),st=G.st;if(st.hecho||(st.pl&&st.pl[id]))return;const z=p.zona(x,y);if(z===id){st.pl[id]=[x,y];st.sel=null;st.ayV=false;G.msg=['Bien: '+p.nom[id].toLowerCase()+'.','bien'];if(p.labs.every(l=>st.pl[l.id]))return hecho('Todas las etiquetas en su sitio.');pinta();return}
 msgM('No va ahí. '+p.pista(id,z),errar(id+'@'+(z||'fuera')));pinta()}
function compOrden(){const p=paso(),st=G.st,ok=st.o.every((id,i)=>!i||p.val(st.o[i-1])<p.val(id));if(ok)return hecho(p.exp);const k=st.o.findIndex((id,i)=>i&&p.val(st.o[i-1])>p.val(id));msgM(`No es correcto: revisa a partir de la posición ${k}. `+p.pista,errar('o='+st.o.join(',')));pinta()}
function compListones(){const p=paso(),st=G.st,ok=st.e.every((v,i)=>!i||v!==st.e[i-1]);if(ok){st.res='ok';return hecho(p.exp)}st.res='mal';msgM('Así el tablero se abarquilla. '+p.pista,errar('l='+st.e.map(v=>+v).join('')));pinta()}
function compEncargo(){const p=paso(),st=G.st;st.pistas=[];let falta=false,res;
 p.filas.forEach((fi,i)=>{const U=USOS[fi.u],v=st.v[i],ok=st.ok[i];st.mal[i]={};
  if(!ok.m){if(!v.m)falta=true;else if(U.m.includes(v.m))ok.m=true;else{st.mal[i].m=true;res=errar(i+'m='+v.m)||res;st.pistas.push(`<b>${i+1}. ${esc(fi.n)}</b> · material: ${U.p}.`)}}
  if(!ok.r){if(!v.r)falta=true;else if(U.r.includes(v.r)&&(ok.m?revValido(v.m,v.r):U.m.some(m=>revValido(m,v.r))))ok.r=true;else{st.mal[i].r=true;res=errar(i+'r='+v.r+'|'+v.m)||res;st.pistas.push(`<b>${i+1}. ${esc(fi.n)}</b> · revestimiento: ${!U.r.includes(v.r)?'no es el adecuado para esta pieza. '+U.p:'no se aplica sobre '+esc(v.m)+'. Lacado sobre DM; melamina sobre aglomerado o DM; la madera maciza no se reviste'}.`)}}
  if(!ok.c&&ok.r&&ok.m){if(!v.c)falta=true;else if(cantosOk(v.m,v.r).includes(v.c))ok.c=true;else{st.mal[i].c=true;res=errar(i+'c='+v.c+'|'+v.r)||res;st.pistas.push(`<b>${i+1}. ${esc(fi.n)}</b> · canto: melamina → cinta de PVC o ABS; chapa natural o rechapado → chapa o contracanto macizo; madera maciza y tablex no llevan canto ${DIAP(55)}.`)}}
  });
 const todo=p.filas.every((f,i)=>st.ok[i].m&&st.ok[i].r&&st.ok[i].c);if(todo){G.rec.enc=st.v.map((v,i)=>({n:p.filas[i].n,...v}));return hecho('El encargo está bien resuelto: cada pieza tiene el material, el revestimiento y el canto adecuados.')}
 if(st.pistas.length)msgM('Hay casillas mal (en rojo). Lee las pistas debajo de la tabla.',res);else G.msg=[falta?'Rellena todas las casillas. El canto se comprueba cuando el material y el revestimiento están bien.':'Elige el canto de las piezas que faltan.','mal'];pinta()}
function usarAyuda(){const p=paso(),st=G.st;if(!p.ay||st.hecho)return;if(p.t==='etiq'&&!st.sel)return;const k='ay|'+(p.t==='etiq'?st.sel:'');if(errarAy(k)){}st.ayV=true;st.ayL=st.sel;pintaVis();$('#der').innerHTML=(REV?revBarra():'')+barraG(G.fase)+pPaso();$('#nota').textContent=coma(nota())}
function errarAy(c){const k=G.fase+'|'+G.ip[G.fase]+'|'+c;if(G.ek.has(k))return false;G.ek.add(k);G.a[G.fase]=(G.a[G.fase]||0)+1;return true}

/* ---------- certificado ---------- */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const firma=async(n,d)=>(await sha(SECRETO+'|'+normal(n)+'|'+d)).slice(0,8).toUpperCase();
const HIST={};function historial(n,rec){const k='historial-'+JUEGO+':'+normal(n);let L=HIST[k]||[];try{const g=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(g)&&g.length>=L.length)L=g}catch(e){}L=L.filter(r=>r.v!==rec.v);L.push(rec);L.sort((a,b)=>a.v-b.v);HIST[k]=L;try{localStorage.setItem(k,JSON.stringify(L))}catch(e){}return L}

 const reglas=Object.values(USOS).map(u=>`<b>${esc(u.t)}:</b> ${u.m.join(', ')} · cara: ${u.r.join(', ')}.`);
 return `<div style="border:2px solid #c8891e;background:#fff6e0;color:#3a2a10;border-radius:8px;padding:10px 14px;margin:0 0 6px;line-height:1.5"><b style="font-size:17px">Enlaces: cuál dar al alumnado y cuál es el suyo</b><br><b>Para el alumnado:</b> <span style="font-family:monospace;word-break:break-all">${pfEsc(cu)}</span><br><b>Para usted:</b> ese mismo enlace terminado en <span style="font-family:monospace">#profesor</span>, más la clave.<br>Es el mismo juego; solo cambia el final de la dirección. No comparta con el alumnado ni <span style="font-family:monospace">#profesor</span> ni la clave. Si quiere que el certificado lleve el nombre de su centro, cree su enlace en la pestaña «Mi centro».</div>
${h('Qué es y para quién')}<p class="ins">Un juego de una sola página para el alumnado de carpintería y mueble sobre las <b>propiedades y características de la madera y de sus derivados</b>. Recorre el tema como un trabajo de almacén, del tronco al material de un encargo. Evalúa y enseña a la vez: cada fallo explica qué ha pasado y dónde repasarlo en la presentación del tema. No necesita instalación, registro ni conexión a ningún servicio.</p>
${h('Qué aprende el alumno')}${li(['Reconocer las partes del tronco (corteza, líber, cámbium, albura, duramen y médula), contar los anillos y leer el clima en ellos.','Distinguir las secciones transversal, radial y tangencial y las formas de despiezar el tronco.','Nombrar la cara, el canto y la testa, y escribir las medidas como largo × ancho × grueso.','Calcular el contenido de humedad y la merma, elegir el secado y prever el abarquillado.','Reconocer defectos (nudos, deformaciones, fendas, resina, médula) y decidir qué hacer con cada tabla.','Encolar un alistonado con los anillos alternados.','Leer e interpretar fichas técnicas AEIM: densidad, dureza, estabilidad, durabilidad y mecanización.','Calcular el volumen en m³ y el peso de una pieza.','Identificar los tableros derivados por su canto, su cara y su color, y sus revestimientos.','Elegir el material, el revestimiento y el canto de cada pieza según su uso.'])}
${h('Fases')}<table><tr><td><b>Calentamiento</b></td><td>Verdadero o falso sobre la madera como material del futuro. Sin nota.</td></tr><tr><td><b>1 · El tronco (15 %)</b></td><td>Partes, edad, clima, madera de primavera, secciones, despiece, nombres y medidas de la pieza.</td></tr><tr><td><b>2 · Humedad y secado (15 %)</b></td><td>Contenido de humedad, lectura del xilohigrómetro, agua libre y de impregnación, secado, merma y abarquillado.</td></tr><tr><td><b>3 · Tablas (15 %)</b></td><td>De 5 a 6 tablas con defectos (nombre y qué hacer con ella) y encolado de un alistonado.</td></tr><tr><td><b>4 · Fichas técnicas (15 %)</b></td><td>¿Quién es quién?, ordenar especies, peso de una pieza y lectura de una ficha.</td></tr><tr><td><b>5 · Tableros (15 %)</b></td><td>Seis muestras de tablero y dos revestimientos, con una pregunta sobre cada uno, y los formatos comerciales.</td></tr><tr><td><b>6 · El encargo (25 %)</b></td><td>Material, revestimiento y canto de cada pieza de un mueble; PRL o mecanización y por qué existen los tableros.</td></tr></table>
${h('Cómo se puntúa')}<p class="ins">Cada fase parte de 10. Cada error resta 0,25 y cada ayuda gráfica, 0,5. Repetir el mismo error sin cambiar nada no vuelve a restar. No se avanza con una respuesta mal. La nota final pondera las fases con los pesos indicados. El certificado dice <b>«Apto»</b> solo con un 5 o más de nota final <b>y</b> un 5 o más en el encargo.</p>
${h('Ayudas que ofrece el juego')}${li(['<b>Ejemplo resuelto</b> al empezar cada fase, sobre un caso que no es el del alumno. No resta.','<b>Instrucciones grandes</b> la primera vez que se entra en cada fase, con su recordatorio en el mismo sitio.','<b>Pista al fallar</b>, con la diapositiva de la presentación «La madera» donde está la explicación. Resta solo el error (0,25).','<b>Ayuda gráfica</b> en algunos pasos: señala en el dibujo dónde va cada parte del tronco o de la pieza, numera los anillos, muestra la tabla comparativa de especies o la guía para elegir el material. Resta 0,5.','<b>Dibujos con zoom</b>, generados para cada alumno: tronco con detalle ampliado de la corteza, tablas por cara, canto y testa, y muestras de tablero en perspectiva.'])}
${h('Por qué no sirve copiar')}<p class="ins">Cada alumno recibe su propio caso, que además cambia en cada intento: el tronco (número y anchura de los anillos, tramo de lluvia o sequía, albura, médula descentrada, posición del detalle), los pesos de la pieza, la lectura del xilohigrómetro, la tabla de la merma y su medida, la posición de la tabla en el tronco, las tablas con defectos y su destino (vista u oculta), los listones del alistonado, las especies de las fichas, el criterio de ordenación, la pieza que hay que pesar, las muestras de tablero con su grueso y su número de chapas, los revestimientos y el encargo. Las preguntas salen de bancos amplios y las opciones se barajan. Los encargos se alternan entre intentos: uno de tableros, interior y lacado, y el siguiente de madera maciza, exterior o con la veta vista. Solo con las tablas y las muestras de tablero salen más de mil millones de combinaciones.</p>
${h('Cómo usarlo en clase')}<p class="ins">Una partida dura aproximadamente entre 45 y 90 minutos. La partida se guarda sola en el ordenador y se puede llevar a otro con «Guardar en un archivo». El alumno puede repetir cuantas veces quiera: el objetivo es que aprenda, y cuantas más veces repita, mejor asimila el tema. Al terminar entrega el certificado PDF y usted lo comprueba en la pestaña «Comprobar certificados».</p>
${h('Criterios del encargo')}<p class="ins">Materiales y revestimientos que se aceptan para cada uso (si una pieza admite varias soluciones, vale cualquiera). Melamina, con canto de PVC o ABS; chapa natural y alistonado rechapado, con canto de chapa o contracanto macizo; laminado de alta presión, con cualquiera de los dos; lacado, sin canto o con chapa o contracanto; madera maciza, OSB y tablex, sin canto. El lacado solo se aplica sobre DM y la melamina sobre aglomerado o DM.</p>${li(reglas)}
${h('Limitaciones')}<p class="ins">No hay servidor: las partidas y el número de intento se guardan en el navegador de cada alumno. El código del certificado detecta cambios en el nombre o en la nota, pero el archivo del juego es público; si la nota cuenta para la evaluación, el certificado no debería ser la única prueba.</p>
${h('Autoría y uso')}<p class="ins">${AUTORIA} Esta página y su clave son solo para el profesorado: no las comparta con el alumnado.</p>`}
function pfCentro(){const u=PFC?PFURL+'?c='+encodeURIComponent(PFC):'';return `<p class="ins">Escriba el nombre de su centro. Obtendrá un enlace para su alumnado: con él, el <b>certificado</b> muestra su centro en lugar del IES Virgen de la Esperanza. La autoría del juego no cambia.</p><label class="et">Nombre del centro</label><div class="fila"><input id="pfc" class="txt" maxlength="60" value="${pfEsc(PFC)}" placeholder="Por ejemplo: IES Sierra Luna" style="flex:1;margin:0"><button class="pri" data-a="pfcen">Crear enlace</button></div>${u?`<p class="ins" style="margin-top:12px">Enlace para su alumnado:</p><p style="word-break:break-all;padding:8px 10px;border:1px solid var(--am);font-family:monospace">${pfEsc(u)}</p><div class="fila"><button class="sec" data-a="pfcop">Copiar enlace</button><a class="sec" href="${pfEsc(u)}" target="_blank" rel="noopener" style="padding:6px 10px">Abrir</a></div>`:''}`}
function pProfCert(){const r=G.prof.r;let t=`<p class="ins">Escriba el nombre tal como aparece en el certificado y su código de comprobación.</p><label class="et" for="pn">Nombre y apellidos</label><input class="txt" id="pn" value="${pfEsc(G.prof.n)}"><label class="et" for="pc">Código</label><input class="txt" id="pc" value="${pfEsc(G.prof.c)}" style="max-width:640px"><div class="fila"><button class="pri" data-a="compC">Comprobar</button></div>`;
 if(r&&r.ok){const g={nombre:G.prof.n.trim(),intento:r.int,vez:r.vez},P={};for(const f of ORDEN)P[f]=GEN[f](rngDe(g.nombre,g.intento,f),g.vez);const nb=k=>coma(Math.max(0,10-r.fa[KF.indexOf(k)]*.25-r.ay[KF.indexOf(k)]*.5));
  t+=`<div class="res2" style="color:var(--ve)">Certificado válido</div><table><tr><td>Fecha</td><td class="n">${r.f}</td></tr><tr><td>Nota</td><td class="n">${r.nota}</td></tr>${KF.map((k,i)=>`<tr><td>${NOMF[k]} (${PESO[k]} %) · ${r.fa[i]} errores y ${r.ay[i]} ayudas gráficas</td><td class="n">${nb(k)}</td></tr>`).join('')}<tr><td>Intento</td><td class="n">${r.vez}</td></tr><tr><td>Tiempo</td><td class="n">${r.min}</td></tr></table>
  <div class="banda">Caso de este alumno</div><table><tr><td>Tronco</td><td>${P.tronco.dat.edad} años · tramo de ${P.tronco.dat.tramo==='lluvia'?'lluvia':'sequía'} · secciones ${P.tronco.dat.sec.join(', ')} · despiece ${P.tronco.dat.dsp} · pieza ${P.tronco.dat.pieza}</td></tr><tr><td>Humedad</td><td>${coma(P.humedad[0].dat.ch,1)} % · xilohigrómetro ${coma(P.humedad[0].dat.xv,1)} % · merma ${P.humedad[0].dat.merma} · tabla ${P.humedad[0].dat.tabla}</td></tr><tr><td>Tablas</td><td>${P.tablas.dat.defectos.join(', ')} · ${P.tablas.dat.listones} listones</td></tr><tr><td>Fichas</td><td>${P.fichas.dat.quien.join(' y ')} · ${P.fichas.dat.orden} · ${P.fichas.dat.peso} · ficha de ${P.fichas.dat.ficha}</td></tr><tr><td>Tableros</td><td>${P.tableros.dat.muestras.join(', ')}</td></tr><tr><td>Encargo</td><td><b>${P.encargo.dat.encargo}</b><br>${P.encargo.dat.E.pz.map(([n,u])=>`${esc(n)}: ${USOS[u].m.join(' / ')}`).join('<br>')}</td></tr></table>`}
 else if(r)t+=`<div class="res2" style="color:var(--ro)">El nombre y el código no coinciden.</div>`;return t}
function pProf(){if(!PFOK)return `<h2>Acceso del profesorado</h2><p class="ins">Escriba la clave que le ha facilitado el autor.</p><label class="et">Clave</label><div class="fila"><input id="pfk" class="txt" type="password" autocomplete="off" style="flex:1;margin:0"><button class="pri" data-a="pfent">Entrar</button></div>${PFMAL?'<div class="msg mal" style="margin-top:8px">La clave no es correcta.</div>':''}`;
 const tb=(v,t)=>`<button class="sec" data-a="pftab" data-v="${v}" style="padding:5px 10px${PFT===v?';border-color:var(--am);color:var(--am)':''}">${t}</button>`;
 return `<h2>Página del profesorado</h2><div class="fila" style="margin:0 0 12px">${tb('guia','Guía')}${tb('cert','Comprobar certificados')}${tb('cen','Mi centro')}<button class="sec" data-a="pfrev" style="padding:5px 10px">Revisar el juego</button><button class="sec" data-a="pfsal" style="padding:5px 10px;margin-left:auto">Cerrar sesión de profesor</button></div>${PFT==='cert'?pProfCert():PFT==='cen'?pfCentro():pfGuia()}`}
async function pfEntra(){const k=$('#pfk');if(!k)return;const h=await sha('IESVE-prof|'+k.value.trim());if(h===PFH){PFOK=true;PFMAL=false;try{localStorage.setItem('prof-'+JUEGO,PFH)}catch(e){}}else PFMAL=true;pinta()}
/* revisión del profesor: saltar entre fases y resolver pasos sin jugar */
function revBarra(){const b=(f,t)=>`<button class="sec" data-a="revF" data-v="${f}" style="padding:4px 8px${G.fase===f?';border-color:var(--am);color:var(--am)':''}">${t}</button>`;return `<div class="fila" style="border:2px dashed var(--am);padding:6px;margin:0 0 10px"><b style="color:var(--am)">Revisión del profesor</b>${ORDEN.map(f=>b(f,FASES.find(x=>x[0]===f)[1])).join('')}${ORDEN.includes(G.fase)?'<button class="sec" data-a="revRes" style="padding:4px 8px">Resolver este paso</button>':''}<button class="sec" data-a="revFin" style="padding:4px 8px">Certificado</button><button class="sec" data-a="revSal" style="padding:4px 8px">Salir</button></div>`}
function revEmpieza(){G=nuevo();G.nombre='Revisión del profesor';G.intento=1+Math.floor(Math.random()*999999);G.vez=1+Math.floor(Math.random()*2);G.t0=Date.now();genera();for(const f of ORDEN){G.ip[f]=0;G.f[f]=0;G.a[f]=0}G.fase='tronco';G.ins={}}
function resolver(){const p=paso(),st=G.st;if(!p||st.hecho)return;if(p.t==='demo'||p.t==='finfase')return siguiente();
 if(p.t==='elige')return compElige(p.sol);if(p.t==='num'){st.ok={};p.campos.forEach(c=>st.ok[c.id]=true);return hecho(p.exp)}if(p.t==='lag')return compLag(p.sol.join(' x '));
 if(p.t==='multi'){st.v={};p.items.forEach((it,i)=>st.v[i]=it.sol);return compMulti()}if(p.t==='etiq'){st.pl={};const P2=p.labs;if(G.fase==='tronco'&&P2.length===6){PARTES.forEach(id=>st.pl[id]=centroZona(G.P.tronco.T,id))}else{for(let y=5;y<VH;y+=6)for(let x=5;x<VW;x+=6){const z=p.zona(x,y);if(z&&!st.pl[z])st.pl[z]=[x,y]}}return hecho('Resuelto por el profesor.')}
 if(p.t==='orden'){st.o=[...p.items].sort((a,b)=>p.val(a)-p.val(b));return compOrden()}if(p.t==='listones'){st.e=st.e.map((v,i)=>i%2===0);return compListones()}
 if(p.t==='encargo'){p.filas.forEach((f,i)=>{const U=USOS[f.u],m=U.m.find(m=>U.r.some(r=>revValido(m,r))),r=U.r.find(r=>revValido(m,r));st.v[i]={m,r,c:cantosOk(m,r)[0]}});return compEncargo()}}

/* ---------- eventos ---------- */
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a],[data-chip]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v;
 if(el.dataset.chip){if(arr&&arr.mov)return;G.st.sel=G.st.sel===el.dataset.chip?null:el.dataset.chip;G.st.ayV=false;G.msg=null;pinta();return}
 if(a==='empezar'){const n=$('#nom').value;if(n.trim().split(/\s+/).length<2){G.msg=['Escribe tu nombre y al menos un apellido.','mal'];pinta();return}empieza(n)}
 else if(a==='gcont'){const n=($('#nom').value||'').trim();let t=null;try{t=n?localStorage.getItem(claveP(n)):null}catch(_){}if(t)cargaPartida(t);else $('#fpar').click()}
 else if(a==='gguarda')guardaArchivo();
 else if(a==='sig')siguiente();
 else if(a==='insX'){G.ins[G.fase]=true;autoGuarda();pinta()}
 else if(a==='insO'){e.preventDefault();G.ins[G.fase]=false;pinta()}
 else if(a==='op')compElige(+v);
 else if(a==='mcomp')compMulti();
 else if(a==='ocomp')compOrden();
 else if(a==='oup'||a==='odn'){const o=G.st.o,i=+v,j=a==='oup'?i-1:i+1;[o[i],o[j]]=[o[j],o[i]];G.msg=null;pinta()}
 else if(a==='lcomp')compListones();
 else if(a==='ecomp')compEncargo();
 else if(a==='ayuda')usarAyuda();
 else if(a==='ayNo'){e.preventDefault();G.st.ayV=false;pinta()}
 else if(a==='zoom')zoom(+v);
 else if(a==='desc')descargar();
 else if(a==='otra'){REV=false;G=nuevo();pinta()}
 else if(a==='pfent')pfEntra();
 else if(!PFOK){}
 else if(a==='pftab'){PFT=v;pinta()}
 else if(a==='compC'){const n=$('#pn').value,c=$('#pc').value;G.prof={n,c,r:await compCert(n,c)};pinta()}
 else if(a==='pfsal'){PFOK=false;REV=false;try{localStorage.removeItem('prof-'+JUEGO)}catch(e){}G=nuevo();G.fase='prof';G.prof={n:'',c:'',r:null};pinta()}
 else if(a==='pfrev'){REV=true;revEmpieza();pinta()}
 else if(a==='pfcen'){PFC=($('#pfc').value||'').replace(/[<>&"'`]/g,'').replace(/\s+/g,' ').trim();pinta()}
 else if(a==='pfcop'){try{navigator.clipboard.writeText(PFURL+'?c='+encodeURIComponent(PFC));el.textContent='Copiado'}catch(e){}}
 else if(REV&&a==='revF'){G.fase=v;G.ip[v]=0;G.st={};G.msg=null;pinta()}
 else if(REV&&a==='revRes')resolver();
 else if(REV&&a==='revFin'){G.fase='fin';G.rec.enc=G.rec.enc||G.P.encargo[1].filas.map(f=>{const U=USOS[f.u],m=U.m.find(m=>U.r.some(r=>revValido(m,r))),r=U.r.find(r=>revValido(m,r));return {n:f.n,m,r,c:cantosOk(m,r)[0]}});emitir();pinta()}
 else if(REV&&a==='revSal'){REV=false;G=nuevo();G.fase='prof';G.prof={n:'',c:'',r:null};pinta()}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;if(t.dataset&&t.dataset.nf){e.preventDefault();compNum(t.dataset.nf,t.value)}else if(t.dataset&&t.dataset.lag){e.preventDefault();compLag(t.value)}else if(t.id==='pfk')pfEntra();else if(t.id==='nom'){const b=$('[data-a="empezar"]');if(b)b.click()}else if(t.id==='pfc'){const b=$('[data-a="pfcen"]');if(b)b.click()}});
document.addEventListener('change',e=>{const t=e.target;if(!t.isConnected)return;if(t.dataset.nf)compNum(t.dataset.nf,t.value);else if(t.dataset.lag)compLag(t.value);else if(t.dataset.mi!==undefined){G.st.v[t.dataset.mi]=t.value;G.st.mal&&(G.st.mal[t.dataset.mi]=false);t.className=''}else if(t.dataset.ef){const [i,k]=t.dataset.ef.split(':');G.st.v[i][k]=t.value;G.st.mal[i][k]=false;t.className=''}});
$('#fpar').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)cargaPartida(await f.text())});
/* arrastrar etiquetas, voltear listones, zoom y desplazamiento del dibujo */
let arr=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-chip]');if(c&&!c.disabled){arr={id:c.dataset.chip,x:e.clientX,y:e.clientY,mov:false,el:null}}});
document.addEventListener('pointermove',e=>{if(!arr||!arr.id)return;if(!arr.mov&&Math.hypot(e.clientX-arr.x,e.clientY-arr.y)>6){arr.mov=true;arr.el=document.createElement('div');arr.el.className='fant';arr.el.textContent=paso().nom[arr.id];document.body.appendChild(arr.el)}if(arr.el){arr.el.style.left=e.clientX+12+'px';arr.el.style.top=e.clientY+8+'px'}});
document.addEventListener('pointerup',e=>{if(!arr||!arr.id)return;const a=arr;if(a.el)a.el.remove();setTimeout(()=>{arr=null},0);if(!a.mov)return;const h=$('#hoja').getBoundingClientRect();if(e.clientX>=h.left&&e.clientX<=h.right&&e.clientY>=h.top&&e.clientY<=h.bottom){const q=aSvg(e.clientX,e.clientY);if(q)colocar(a.id,q[0],q[1])}});
(()=>{const h=$('#hoja');let pan=null;h.addEventListener('wheel',e=>{if(!$('#hoja svg'))return;e.preventDefault();const r=h.getBoundingClientRect();zoom(e.deltaY<0?1:-1,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
 h.addEventListener('pointerdown',e=>{if(!$('#hoja svg'))return;pan={x:e.clientX,y:e.clientY,mov:false,vb:G.vb?[...G.vb]:null}});
 h.addEventListener('pointermove',e=>{if(!pan||!pan.vb)return;const d=Math.hypot(e.clientX-pan.x,e.clientY-pan.y);if(d>6)pan.mov=true;if(!pan.mov)return;const r=h.getBoundingClientRect(),v=pan.vb;G.vb=[Math.max(0,Math.min(VW-v[2],v[0]-(e.clientX-pan.x)*v[2]/r.width)),Math.max(0,Math.min(VH-v[3],v[1]-(e.clientY-pan.y)*v[3]/r.height)),v[2],v[3]];aplicaVb()});
 h.addEventListener('pointerup',e=>{const p0=pan;pan=null;if(!p0||p0.mov)return;const p=paso();if(!p||G.st.hecho)return;
  if(p.t==='etiq'&&G.st.sel){const q=aSvg(e.clientX,e.clientY);if(q)colocar(G.st.sel,q[0],q[1])}
  else if(p.t==='listones'){const g=e.target.closest('[data-l]');if(g){const i=+g.dataset.l;G.st.e[i]=!G.st.e[i];G.st.res=null;G.msg=null;pintaVis()}}})})();
G=nuevo();pinta();
function vistaProfesor(){if(location.hash==='#profesor'&&(G.fase==='inicio'||G.fase==='prof')){G.fase='prof';G.prof={n:'',c:'',r:null};pinta()}}
addEventListener('hashchange',vistaProfesor);vistaProfesor();

</script>
