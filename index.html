<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Turno en la escuadradora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Máquina en planta a la izquierda; a la derecha, el cuadro de mandos. Esmalte verde de máquina y los colores del cartel: rojo se elimina, verde referencia, amarillo topes. */
:root{
  color-scheme:dark;
  --bg:#1C2B28; --panel:#26383A; --panel2:#30464A; --ink:#EEF3EC; --ink2:#AFC0B9; --line:#47605F;
  --am:#F2C230; --ro:#EE6049; --ve:#63D192; --az:#8DB6FF;
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow","Segoe UI",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.42 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--am);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:205px minmax(0,1fr) 390px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "lista maq panel";gap:10px}
header{grid-area:top;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
h1{margin:0;font:700 26px/1 var(--f-disp);letter-spacing:.01em}
#etapas{display:flex;gap:3px;flex:1 1 auto;min-width:0;overflow-x:auto}
#etapas span{padding:3px 9px;font:600 15px var(--f-disp);letter-spacing:.03em;color:var(--ink2);white-space:nowrap;border-bottom:2px solid var(--line)}
#etapas span.ok{color:var(--ve);border-color:var(--ve)}
#etapas span.on{color:var(--ink);border-color:var(--am)}
.nota{display:flex;align-items:baseline;gap:7px;margin-left:auto}
.nota small{font-size:13px;color:var(--ink2)}
.nota b{font:600 25px/1 var(--f-num)}
#maq{grid-area:maq;position:relative;border:1px solid var(--line);min-height:0;background:#172321;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}
#avisos{position:absolute;left:12px;right:12px;top:12px;display:grid;gap:6px;pointer-events:none}
#msg{padding:8px 12px;font-weight:500;background:#101A18;border:1px solid var(--line)}
#porque{padding:8px 12px;font-size:15px;line-height:1.35;background:#101A18;border:1px solid var(--am)}
#porque b{color:var(--am);font:600 15px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
#msg.mal{border-color:var(--ro);color:#FFD4CB}
#msg.bien{border-color:var(--ve);color:#CFF3DE}
#lista{grid-area:lista;background:var(--panel);border:1px solid var(--line);overflow:auto;min-height:0;padding:10px 11px 12px}
#lista h3{margin:0 0 2px;font:600 15px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
#lista h3.ok{color:var(--ve)}
#lista h3 small{font:500 12px var(--f-num);letter-spacing:0;color:var(--ink2);align-self:center;white-space:nowrap}
#lista ul{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:1px}
#lista li{display:grid;grid-template-columns:15px minmax(0,1fr) auto;gap:0 6px;padding:3px 0;font-size:14px;line-height:1.2;border-bottom:1px solid var(--line)}
#lista li i{font:600 13px/1.2 var(--f-num);font-style:normal;color:var(--ve)}
#lista li b{font:600 15px/1.2 var(--f-num)}
#lista li.ok b{color:var(--ve)}
#lista li small{grid-column:2/4;font:500 12px var(--f-num);color:var(--ink2)}
#lista li.ok span,#lista li.ok small{color:var(--ve)}
#lista li.ok span{text-decoration:line-through}
#lista .mesa{display:grid;gap:5px;margin:4px 0 14px}
.tz{display:grid;gap:4px;width:100%;text-align:left;border:1px solid var(--am);background:var(--panel2);padding:6px 7px;font-size:13px;font-weight:500}
.tz:hover{background:#3A4F4C}
.tz svg{display:block;max-width:100%}
.solomov{display:none;gap:5px}
#panel button:disabled,#panel input:disabled{opacity:.42;cursor:not-allowed}
.cab2{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;margin-bottom:8px}
.cab2 #mini{margin:0}.cab2 .ins{margin:0;font-size:14px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}.fila2 .op{padding:5px 8px;font-size:14px}
#panel .gir{gap:4px;margin-bottom:8px}#panel .gir button{padding:4px 8px;font-size:13.5px}
#panel .seg{margin-bottom:6px}#panel .seg button{padding:4px 6px;font-size:13.5px}
#panel .campo{margin-bottom:6px}
#dedo{position:fixed;left:0;top:0;z-index:30;pointer-events:none;display:flex;align-items:flex-start;gap:3px;transition:transform .75s ease-in-out}
#dedo svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
#dedo.toca svg{transform:scale(.72)}
#dedo span{background:#F2C230;color:#1C2B28;font-weight:600;font-size:14px;padding:3px 8px;margin-top:20px;max-width:230px}
@media (prefers-reduced-motion:reduce){#dedo{transition:none}}
#demoBar{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:12px;left:12px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;pointer-events:none}
#demoBar button{pointer-events:auto;border:1px solid var(--am);background:#172321;color:var(--am);font-weight:600;padding:8px 12px}
#demoBar button.on{background:#F2C230;color:#1C2B28}
#app.demo #panel,#app.demo #lista,#app.demo #cv{pointer-events:none}
#demoBar #demoStop{border-color:var(--am);background:var(--am);color:#1C2B28}
#panel{grid-area:panel;background:var(--panel);border:1px solid var(--line);overflow:auto;min-height:0;padding:14px 15px 16px}
#panel h2{margin:0 0 5px;font:600 27px/1.05 var(--f-disp);text-wrap:balance}
.ins{margin:0 0 12px}
.ayu{color:var(--ink2);font-size:13.5px;margin:8px 0 0}
.lista{display:grid;gap:5px}
.op{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);padding:8px 10px}
.op:hover{border-color:var(--ink2)}
.op.si{border-color:var(--ve);background:#27503F}
.op i{flex:none;width:17px;height:17px;border:1.5px solid var(--ink2);display:grid;place-items:center;font:600 12px var(--f-num);font-style:normal}
.op.si i{background:var(--ve);border-color:var(--ve);color:#10201A}
.op small{display:block;color:var(--ink2);font-size:13px}
.pri{margin-top:12px;width:100%;border:0;background:var(--am);color:#1C2B28;font-weight:600;padding:9px 12px}
.pri:disabled{opacity:.45;cursor:not-allowed}
.sec{margin-top:8px;width:100%;border:1px solid var(--line);background:none;padding:7px 12px;font-size:14px}
.hecho{list-style:none;margin:0 0 10px;padding:0;font-size:13.5px;color:var(--ve);display:grid;gap:2px}
.cuadro{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px 12px;align-items:center;padding:11px;background:#3A4F4C;margin-bottom:12px}
.seta{width:60px;height:60px;padding:0;border-radius:50%;border:5px solid #1C2B28;font:700 12px var(--f-disp);letter-spacing:.04em;color:#fff}
.seta.mar{background:#1F9A5A}.seta.par{background:#D5301B}
.seta.vivo{box-shadow:0 0 0 3px var(--ve)}
.est{font:500 13px var(--f-num);line-height:1.5;margin:0 0 12px}
.cm{background:#C9B98A;color:#1C2B28;padding:9px;margin-bottom:10px;border:3px solid #DDE1DC}
.cm-sup{display:grid;grid-template-columns:122px minmax(0,1fr);gap:9px}
.cm-led{display:grid;gap:5px;align-content:start}
.led{background:#3A0B0B;color:#FF3B4E;font:600 21px/1.25 var(--f-num);text-align:right;padding:1px 6px;min-height:29px}
.led.act{outline:2px solid #1B4DBF}
.cinta{background:#0D0D0D;height:27px}
.cm-tec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.k{border:1.5px solid #4A3F24;background:#E0D4AE;color:#1C2B28;padding:3px 0;font:600 14px var(--f-body);border-radius:3px}
.k.fn:nth-of-type(1){grid-column:span 2}
.k.fn.on{background:#1B4DBF;color:#fff}
.k.st{background:#1F9A5A;color:#fff;grid-column:span 2}
.k.sp{background:#D5301B;color:#fff}
.cm-inf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:0 4px}
.emer{width:58px;height:58px;padding:0;border-radius:50%;border:6px solid #F2C230;background:#D5301B;color:#fff;font:700 12px var(--f-disp)}
.bv,.br{width:50px;height:50px;padding:0;border-radius:50%;border:4px solid #DDE1DC;color:#fff;font:600 11px var(--f-body)}
.bv{background:#15704A}.bv.vivo{background:#20C074;box-shadow:0 0 0 3px #1C2B28}
.bv:disabled{opacity:.45;cursor:not-allowed}
.br{background:#D5301B}
.tg{display:grid;gap:5px;margin-bottom:12px}
.campo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.campo label{flex:1 1 100%;font-size:13.5px;color:var(--ink2)}
.campo input[type=number],.campo input[type=text],.txt{width:84px;padding:5px 7px;background:#172321;border:1px solid var(--line);font:600 16px var(--f-num)}
.txt{width:100%;font:500 16px var(--f-body);margin-bottom:8px}
.campo button,.gir button{border:1px solid var(--line);background:var(--panel2);padding:5px 10px;font-size:14px}
.gir{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--bg)}
input[type=range]{width:100%;accent-color:var(--am)}
#lado,#mini{display:block;width:100%;height:auto;background:#172321;border:1px solid var(--line);margin:0 0 10px}
.res{font:600 16px var(--f-num)}
table{border-collapse:collapse;width:100%;margin:6px 0 12px;font:500 13.5px var(--f-num)}
td,th{border-bottom:1px solid var(--line);padding:4px 3px;text-align:left}
td.n,th.n{text-align:right}
.grp{font:600 15px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin:10px 0 2px;color:var(--ink2)}
.inc{font-size:14px;display:grid;gap:5px;margin:6px 0 12px;padding:0;list-style:none}
.inc li{display:flex;justify-content:space-between;gap:10px}
.inc b{font-family:var(--f-num);color:var(--ro);white-space:nowrap}
.cert{display:block;width:100%;height:auto;border:1px solid var(--line);margin:8px 0}
.cod{font:600 15px var(--f-num);word-break:break-all;background:#172321;padding:6px 8px;display:block}
@media (max-width:860px){
  html,body{height:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  #app{height:auto;display:flex;flex-direction:column}
  #maq{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:52svh;flex:none}
  .solomov{display:grid}
  #panel{overflow:visible;order:2}
  #lista{overflow:visible;order:3}
  #maq{order:1}
  .nota{margin-left:0}
}
</style>
<div id="app">
  <header><h1>Turno en la escuadradora</h1>
    <div id="etapas"></div><div class="nota"><small>Nota</small><b id="nota">10,00</b></div></header>
  <aside id="lista" aria-label="Lista de piezas"></aside>
  <main id="maq"><canvas id="cv" aria-label="Escuadradora vista en planta y plano de corte"></canvas><div id="avisos"><div id="msg" hidden></div><div id="porque" hidden></div></div><div id="demoBar" hidden><button id="demoAtras">◀ Anterior</button><button id="demoPausa">Pausa</button><button id="demoAdel">Siguiente ▶</button><button id="demoVel">Ir más rápido</button><button id="demoStop">Detener la demostración</button></div></main>
  <div id="dedo" hidden><svg viewBox="0 0 24 24"><path d="M4 2l16 11-7 1.5 4 7.5-3 1.6-4-7.6-5 5z" fill="#F2C230" stroke="#1C2B28" stroke-width="1.4"/></svg><span></span></div>
  <aside id="panel" aria-live="polite"></aside>
</div>
<script>
/* ---------- datos ---------- */
const INC={
 epi:['No utilizar el EPI obligatorio para la operación',.5,'g'],
 resg:['Utilizar la máquina sin el resguardo colocado',.75,'g'],
 limpio:['No dejar el puesto limpio y ordenado al finalizar',.75,'g'],
 conectada:['Cambiar el disco con la máquina conectada',1,'mg'],
 manos:['Manos junto al disco en marcha',.75,'g'],
 retro:['Provocar un retroceso por mala preparación',.75,'g'],
};
const EPIS=[{id:'gafas',t:'Gafas de protección',ok:1},{id:'oido',t:'Protectores auditivos',ok:1},{id:'pie',t:'Calzado de seguridad',ok:1},{id:'ropa',t:'Sin ropa suelta, pulseras ni anillos, y el pelo recogido',ok:1},{id:'guantes',t:'Guantes',ok:0}];
const DISCOS=[{id:'a',t:'24 dientes',s:'Madera maciza al hilo'},{id:'b',t:'60 dientes alternos',s:'Tronzar madera maciza'},{id:'c',t:'80 dientes',s:'Tableros'}];
const CAMBIO=['Parar la máquina y esperar a que el disco se detenga','Desconectar la máquina','Abrir la protección y aflojar la tuerca','Cambiar el disco, con el sentido de giro correcto','Apretar bien la tuerca y quitar la llave','Ajustar el cuchillo divisor: alineado y a menos de 8 mm de los dientes','Girar el disco a mano y comprobar que no roza','Cerrar la protección'];
/* Despiece inventado para el juego */
const BOARDS_JUEGO=[
 {g:19,mejor:1.229e6,mat:'DM 19',p:[['Costado',2,900,350],['Techo',1,760,350],['Suelo',1,760,350],['Balda',1,722,330]]},
 {g:10,beta:true,mejor:2.395e6,mat:'Rechapado pino 10',p:[['Puerta',2,420,360],['Cartela',2,200,120]]},
 {g:4,mejor:1.987e6,mat:'DM 4',p:[['Trasera',1,900,760]]},
];
/* Despiece solo para la demostración: otras medidas y gruesos, para que no enseñe la solución del juego */
const BOARDS_DEMO=[
 {g:25,mejor:0,mat:'DM 25',p:[['Lateral',2,1100,400],['Tapa',1,800,400],['Base',1,800,400],['Estante',1,756,380]]},
 {g:12,beta:true,mejor:0,mat:'Rechapado pino 12',p:[['Frente',2,600,300],['Listón',2,280,100]]},
 {g:6,mejor:0,mat:'DM 6',p:[['Trasera',1,1100,800]]},
];
let BOARDS=BOARDS_JUEGO;
const W0=2440,H0=1220,M=10,K=3.2,KT='3,2',FIN=170;
const r1=v=>Math.round(v*10)/10,n1=v=>String(r1(v)).replace('.',',');
const SECRETO='IESVE-escuadradora-2026';
const dlP=(window.claude&&claude.use)?claude.use('downloads'):Promise.resolve(null);

/* ---------- estado ---------- */
let G;
function piezasDe(b){const o=[];BOARDS[b].p.forEach((p,i)=>{for(let k=0;k<p[1];k++)o.push({id:b+'-'+i+'-'+k,n:p[0],l:p[2],w:p[2],h:p[3],x:0,y:0,on:false})});return o}
function nuevo(){return {err:0,ultMal:'',tMal:0,fase:'inicio',nombre:'',bi:0,planes:BOARDS.map((_,i)=>piezasDe(i)),sel:null,cortes:[],hechas:new Set(),mesa:[],map:new Map(),trozo:null,op:null,nid:0,epi:new Set(),disco:null,cambio:0,orden:CAMBIO.map((_,i)=>i).sort(()=>Math.random()-.5),alt:60,puesto:null,
  b:0,paso:0,sub:'montaje',on:false,rpm:0,prot:false,asp:false,vista:'maquina',tec:{eje:null,buf:''},guia:620,adel:false,tope:400,uso:'tope',feed:0,fy:-1000,pz:null,recorte:null,inc:[],vistos:new Set(),tableros:3,pausa:false,empu:false,yaPauso:false,cert:null,t0:Date.now(),prof:null}}
function nota(){return Math.max(0,10-.25*G.err)}
const coma=(v,d=2)=>v.toFixed(d).replace('.',',');
function falta(k){const id=k+':'+(G.fase==='corte'?G.b+'.'+G.paso:G.fase);if(G.vistos.has(id))return;G.vistos.add(id);G.inc.push(k)}
const $=s=>document.querySelector(s);
let tMsg;
/* Cada error resta 0,25, sea del tipo que sea. Un mismo aviso repetido sin pausa cuenta una sola vez */
function aviso(t,c=''){if(c==='mal'&&G&&!G.demo&&G.fase!=='inicio'&&G.fase!=='fin'){const a=performance.now();if(t!==G.ultMal||a-G.tMal>1200){G.err++;const n=$('#nota');if(n)n.textContent=coma(nota())}G.ultMal=t;G.tMal=a}const m=$('#msg');m.textContent=t;m.className=c;m.hidden=false;clearTimeout(tMsg);if(!G||!G.demo)tMsg=setTimeout(()=>m.hidden=true,7000)}

/* ---------- plano de corte ---------- */
function validar(b){
  const P=G.planes[b];
  if(P.some(p=>!p.on))return 'Faltan piezas por colocar en este tablero.';
  if(BOARDS[b].beta){const g=P.find(p=>p.w!==p.l);if(g)return `${g.n} está girada. La primera medida del despiece, ${g.l}, es la longitud y tiene que ir en el sentido de la beta.`}
  for(const p of P)if(p.x<M-.5||p.y<M-.5||p.x+p.w>W0-M+.5||p.y+p.h>H0-M+.5)return 'Una pieza se sale de la zona útil. Reserva 10 mm en todo el borde para sanear.';
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],c=P[j];const sx=a.x+a.w+K-.5<=c.x||c.x+c.w+K-.5<=a.x,sy=a.y+a.h+K-.5<=c.y||c.y+c.h+K-.5<=a.y;if(!sx&&!sy)return `${a.n} y ${c.n} se pisan o no dejan los ${KT} mm que se come el disco.`}
  const r=resuelve(P);
  if(r.err==='suelta')return `Hay piezas separadas de su referencia. Júntalas contra la zona de saneado y deja ${KT} mm entre ellas.`;
  if(r.err==='guillotina')return 'Esta distribución no se puede cortar: la escuadradora corta de lado a lado, sin pararse a mitad de tablero.';
  const lib=restoMayor(P),best=BOARDS[b].mejor;
  if(lib<best*.9)return `Se puede cortar, pero el mayor resto entero es de ${coma(lib/1e6)} m² y se puede dejar uno de unos ${coma(best/1e6)} m². Coloca las piezas de otra forma para que sobre un tablero grande.`;
  G.cortes[b]=r.cuts;return null}
function restoMayor(P){const on=P.filter(p=>p.on),U=[...new Set([M,W0-M,...on.flatMap(p=>[p.x-K,p.x+p.w+K])])].filter(v=>v>=M&&v<=W0-M).sort((a,b)=>a-b),V=[...new Set([M,H0-M,...on.flatMap(p=>[p.y-K,p.y+p.h+K])])].filter(v=>v>=M&&v<=H0-M).sort((a,b)=>a-b);let m=0;
  U.forEach((a,i)=>U.slice(i+1).forEach(c=>V.forEach((b,j)=>V.slice(j+1).forEach(d=>{const A=(c-a)*(d-b);if(A>m&&on.every(p=>a>=p.x+p.w||c<=p.x||b>=p.y+p.h||d<=p.y))m=A}))));return m}
const tam=(p,a)=>a==='x'?p.w:p.h;
function resuelve(P){const cuts=[];const err=rec({x0:M,y0:M,x1:W0,y1:H0},P,cuts);return err?{err}:{cuts}}
function rec(R,P,cuts){
  if(!P.length)return null;
  if(Math.min(...P.map(p=>p.x))>R.x0+.5||Math.min(...P.map(p=>p.y))>R.y0+.5)return 'suelta';
  const hx=Math.max(...P.map(p=>p.x+p.w));
  if(R.x1-hx>.5&&R.x1-hx>hx-R.x0){cuts.push({R:{...R},a:'x',c:hx,m:r1(hx-R.x0)});return rec({...R,x1:hx},P,cuts)}
  for(const a of ['y','x']){
    const vals=[...new Set(P.map(p=>p[a]+tam(p,a)))].sort((u,v)=>u-v);
    for(const c of vals){
      const A=P.filter(p=>p[a]+tam(p,a)<=c+.5),B=P.filter(p=>p[a]>=c+K-.5);
      if(A.length&&B.length&&A.length+B.length===P.length&&Math.min(...B.map(p=>p[a]))<=c+K+.5){
        cuts.push({R:{...R},a,c,m:r1(c-R[a+'0'])});
        const e=rec({...R,[a+'1']:c},A,cuts);if(e)return e;
        return rec({...R,[a+'0']:r1(c+K)},B,cuts);
      }
    }
    const hi=Math.max(...P.map(p=>p[a]+tam(p,a)));

      await di(`${BOARDS[b].mat}: el disco debe sobresalir de 10 a 15 mm.`,'Con menos altura no limpia bien el corte; con más, queda más disco al descubierto.');await tecla('alt',BOARDS[b].g+12);await pul('altOK');await esp(500);
      await di('Protector bajado y aspiración conectada, antes de arrancar.','El protector cubre el disco y frena lo que salta. La aspiración se lleva el polvo, que en el DM es muy fino y dañino.',2000);await pul('prot');if(!G.asp)await pul('asp');if(!G.on){await pul('marcha');await di('Espero a que el disco coja todas sus vueltas.','Si la pieza entra antes de tiempo, el disco se frena y el corte sale mal.',1600)}
      while(G.fase==='corte'&&G.b===b){
        if(G.sub==='elegir'){const t=G.mesa.find(m=>esTira(opDe(m)))||G.mesa[0];await di(esTira(opDe(t))?'Primero, todas las tiras.':'Ahora, las piezas a largo.',esTira(opDe(t))?'Las tiras salen mientras el tablero sigue grande y estable contra la guía. Después se cortan todas a largo seguidas, sin cambiar la preparación a mitad.':'Cada tira se pone atravesada, con un canto limpio contra la regla, y se corta a su medida.',1800);await pul('coge',t.id)}
        const s=paso();await esp(600);
        if(G.pz.w!==s.w){await di('La pieza llega como salió: hay que girarla.','La línea de corte del plano tiene que quedar en línea con el disco.',1400);await pul('gir',1)}
        if(s.t!=='corte'){await di(s.t==='sanear'?'Saneo el borde del que voy a medir las piezas.':'Saneo la cabeza, de donde saldrán las piezas.',s.t==='sanear'?'Las medidas se toman desde un canto limpio y a escuadra. Solo se sanea el canto que voy a usar de referencia; el resto no hace falta.':'Si la cabeza va en bruto, la primera pieza sale fuera de escuadra y de medida. Se quitan los 10 mm que reservé en el plano.',2000);
          let q=G.pz.e;if(q.T==='b'&&q.B!=='b'){await pul('gir',1);await pul('gir',1);q=G.pz.e}if(q.R!=='b')await pul('volt');
          const[px,py]=enPieza();lleva(px,py,'Arrastra hasta sobresalir 10 mm');await esp(900);const ini=G.pz.x,fin=-G.pz.w+10;for(let i=1;i<=24;i++){G.pz.x=Math.round(ini+(fin-ini)*i/24);const e0=$('#estado');if(e0)e0.innerHTML=estado();await esp(45)}pinta();await esp(800);await empuja('Mantén pulsado para empujar')}
        else{const r=n1(s.w-s.m-K),m=n1(s.m);await di(s.met==='tope'?`Corto ${m} y sobran ${r}: tope del carro.`:s.met==='adel'?`Corte a ancho de ${m}: guía adelantada.`:s.resto?`Corto ${m} y sobran ${r}: guía retrasada como tope.`:`Pieza pequeña: guía retrasada y carro.`,s.met==='tope'?'Lo que sobra no pasa de 100 mm sobre la pieza: la pieza queda sobre el carro, sujeta y medida por el tope.':s.met==='adel'?'Corte a lo largo: el canto limpio tiene que apoyar en la guía durante todo el recorrido, por eso va adelantada. El carro ayuda si el tablero es grande; si no, no se desplaza.':s.resto?'Lo que sobra es mayor que la pieza: así lo grande se queda sobre el carro. La guía va por detrás del disco para que la pieza no quede atrapada entre los dos y salga en retroceso.':'Va sujeta en el carro. La guía retrasada mide sin que la pieza quede atrapada entre guía y disco.',2400);
          if(s.met==='tope'){await pul('uso','tope');const el=$('#med');await señala(el,'Pon el tope a '+s.m);ponMed(s.m);await esp(700)}else{await pul('uso','guia');await pul('adel',s.met==='adel'?1:0);await tecla('guia',Math.round(s.m))}
          await esp(500);let q=G.pz.e;if(s.met!=='adel'&&q.T==='b'&&q.B!=='b'){await pul('gir',1);await pul('gir',1);q=G.pz.e}
          if(q[s.met==='tope'?'L':'R']!=='c'){await di('El canto verde tiene que ir contra '+(s.met==='tope'?'el tope.':'la guía.'),'Es el canto limpio y de él sale la medida. Con un canto en bruto, la pieza saldría fuera de medida.',1400);await pul('volt')}await esp(500);await empuja('Mantén pulsado para empujar')}
        if(G.pausa){await di('Pieza pequeña: termino con el empujador.','Con menos de 250 mm entre la guía y el disco, la mano pasaría demasiado cerca de los dientes.',1600);await pul('fin','emp');await empuja('Sigue empujando')}
        pq('Un brazo por encima del disco en marcha puede engancharse. La pieza se retira siempre por el lado del operario.');await esp(600);await pul('retirar');await esp(400);
      }
    }
    await esp(800);await di('Para terminar: máquina parada y puesto limpio.','Los retales y el serrín en el suelo provocan resbalones, y quien llega después tiene que encontrar la máquina en orden.',2400);await pul('limp','si');caja.hidden=true;aviso('Demostración terminada.','bien');
  }catch(e){if(e!=='fin')aviso('La demostración se ha detenido: '+(e&&e.message||e),'mal')}
  finally{if(G!==g&&G.demo)return;teclaArriba=false;caja.hidden=true;dedo.hidden=true;dedo.style.transition='';$('#app').classList.remove('demo');$('#demoBar').hidden=true;Math.random=RND;DEMO=null}
}
function botonPausa(){const b=$('#demoPausa'),p=DEMO&&DEMO.parada;b.textContent=p?'Seguir':'Pausa';b.classList.toggle('on',!!p);b.setAttribute('aria-pressed',p?'true':'false')}
$('#demoPausa').onclick=()=>{if(DEMO){DEMO.parada=!DEMO.parada;botonPausa()}};
$('#demoAtras').onclick=()=>{if(DEMO&&!DEMO.rapido)demo(Math.max(1,DEMO.n-1))};
$('#demoAdel').onclick=()=>{if(DEMO&&!DEMO.rapido){DEMO.meta=DEMO.n+1;DEMO.rapido=true}};
$('#demoVel').onclick=e=>{VEL=VEL===1?.45:1;e.target.textContent=VEL===1?'Ir más rápido':'Ir más despacio'};
$('#demoStop').onclick=()=>{Math.random=RND;BOARDS=BOARDS_JUEGO;G=nuevo();$('#msg').hidden=true;pinta()};
G=nuevo();medir();
/* Comprobación de certificados: solo se entra con el enlace terminado en #profesor */
function vistaProfesor(){if(location.hash==='#profesor'&&G.fase==='inicio'&&!G.prof){G.prof={n:'',c:'',r:null};pinta()}}
addEventListener('hashchange',vistaProfesor);pinta();vistaProfesor();requestAnimationFrame(bucle);
</script>
