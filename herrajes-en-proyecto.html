<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herrajes en proyecto</title>
<meta name="description" content="Juego didáctico de selección de herrajes: lectura de planos, cálculo y hoja de pedido con catálogos Häfele y Verdú. Gustavo Hernández Sánchez · IES Virgen de la Esperanza · CC BY-NC 4.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Oficina técnica: grafito, azul plano y acento cobre sobre papel claro de estudio */
:root{--gr:#1e293b;--gr2:#334155;--gr3:#64748b;--az:#0284c7;--az2:#e0f2fe;--co:#b8692e;--co2:#fbeee3;--fo:#eef1f4;--pa:#ffffff;--li:#cbd5e1;--ok:#15803d;--ok2:#dcfce7;--ma:#b91c1c;--ma2:#fee2e2;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"Barlow","Segoe UI",system-ui,sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--fo);color:var(--gr);font:15px/1.45 var(--f-b);padding:8px 16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--az);outline-offset:1px}
a{color:var(--az)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:4px 0 8px;border-bottom:2px solid var(--gr)}
h1{margin:0;font:700 26px/1 var(--f-d);letter-spacing:.01em}
h1 small{font:500 14px var(--f-b);color:var(--gr3);margin-left:8px}
#etapas{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto}
#etapas span{padding:3px 10px;font:600 15px var(--f-d);letter-spacing:.03em;color:var(--gr3);white-space:nowrap;border-bottom:3px solid var(--li)}
#etapas span.ya{color:var(--gr);border-color:var(--co)}#etapas span.hecho{color:var(--ok);border-color:var(--ok)}
.nota{display:flex;align-items:baseline;gap:6px;color:var(--gr3);font-size:13px}.nota b{font:600 20px var(--f-m);color:var(--gr)}
#app{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:10px;height:calc(100vh - 64px);padding-top:8px}
#app.ancho{grid-template-columns:minmax(0,1fr);height:auto}#app.ancho #visor{display:none}
#visor{background:var(--pa);border:1px solid var(--li);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border-bottom:1px solid var(--li);background:#f8fafc}
#tabs button{border:1px solid var(--li);background:#fff;padding:3px 10px;font:600 15px var(--f-d);letter-spacing:.02em;border-radius:4px}
#tabs button.si{background:var(--gr);color:#fff;border-color:var(--gr)}
#tabs .zoom{margin-left:auto;display:flex;gap:4px}#tabs .zoom button{min-width:34px}
#hoja{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#9aa4ae;cursor:grab;touch-action:none;padding:4px}
#hoja svg{width:100%;height:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#hoja circle[data-z]{cursor:pointer}
#der{background:var(--pa);border:1px solid var(--li);overflow:auto;padding:12px 16px;min-height:0}
h2{font:700 22px/1.1 var(--f-d);margin:2px 0 8px}
h3{font:700 17px var(--f-d);margin:14px 0 6px;color:var(--co);letter-spacing:.02em}
.ins{margin:4px 0 10px}.ayu{color:var(--gr3);font-size:13px}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pri,.sec,.ter{border-radius:6px;padding:8px 14px;font-weight:600;border:1px solid var(--gr)}
.pri{background:var(--gr);color:#fff}.pri:hover{background:var(--gr2)}
.sec{background:#fff}.sec:hover{background:#f1f5f9}
.ter{background:var(--co);border-color:var(--co);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input.txt,select.sel,input.num{border:1px solid var(--li);border-radius:5px;padding:6px 8px;background:#fff;min-width:0}
input.num{width:96px;font-family:var(--f-m);text-align:right}
input.ref{width:130px;font-family:var(--f-m)}
.item{border:1px solid var(--li);border-left:5px solid var(--li);border-radius:6px;padding:8px 10px;margin:8px 0;background:#fff}
.item.ok{border-left-color:var(--ok);background:#f7fdf9}.item.mal{border-left-color:var(--ma);background:#fff8f8}.item.act{box-shadow:0 0 0 2px var(--az2)}
.item .cab{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.item .n{font:600 14px var(--f-m);color:var(--co)}
.item .tt{font-weight:600}
.item .desc{font-size:14px;color:var(--gr2);margin:3px 0 6px}
.pista{font-size:13px;background:var(--co2);border:1px solid #f1c9a6;border-radius:5px;padding:5px 8px;margin-top:6px}
.bpis{border:1px solid var(--co);color:var(--co);background:#fff;border-radius:5px;padding:2px 8px;font-size:13px;white-space:nowrap}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px}.msg.bien{background:var(--ok2);color:#14532d}.msg.mal{background:var(--ma2);color:#7f1d1d}.msg.info{background:var(--az2);color:#0c4a6e}
.barra{position:sticky;bottom:-12px;background:linear-gradient(transparent,#fff 30%);padding:14px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.herr{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.herr button{border:1px solid var(--li);background:#f8fafc;border-radius:5px;padding:4px 10px;font:600 14px var(--f-d);letter-spacing:.02em}
.herr button.si{background:var(--az);color:#fff;border-color:var(--az)}
.caja{border:1px solid var(--li);border-radius:6px;padding:8px 10px;margin:0 0 10px;background:#f8fafc}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--li);padding:4px 6px;text-align:left;vertical-align:top}th{background:#f1f5f9;font-weight:600}td.n,th.n{text-align:right;font-family:var(--f-m)}
.mono{font-family:var(--f-m)}
.calc input{width:100%;font-family:var(--f-m)}.calc .res{font:600 18px var(--f-m);margin-top:4px}.calc .hist{font:13px var(--f-m);color:var(--gr3);max-height:90px;overflow:auto}
.encargo{border-left:4px solid var(--co);padding-left:10px;margin:6px 0 10px}
.aviso{border:2px solid var(--co);background:var(--co2);border-radius:8px;padding:10px 14px;margin:0 0 12px}
.lineas .item{padding:8px}
.lineas .campos{display:grid;grid-template-columns:auto auto auto auto;gap:6px 8px;align-items:center;justify-content:start}
.lineas label{font-size:12px;color:var(--gr3);display:block}
.grupo{font:700 18px var(--f-d);margin:14px 0 2px;border-bottom:2px solid var(--gr)}
#cert img{width:100%;border:1px solid var(--li);margin:8px 0;display:block}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);max-width:90vw;background:var(--gr);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.pie{color:var(--gr3);font-size:12px;margin-top:16px;border-top:1px solid var(--li);padding-top:6px}
@media (max-width:900px){#app{grid-template-columns:1fr;height:auto}#visor{height:70vh}.lineas .campos{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Herrajes en proyecto<small>Autor: Gustavo Hernández Sánchez</small></h1><div id="etapas"></div><div class="nota" id="notaCab" hidden>Nota de la fase <b id="nota">10,00</b></div></header>
<div id="app"><section id="visor"><div id="tabs"></div><div id="hoja"></div></section><section id="der"></section></div>
<input type="file" id="fpar" accept=".txt,text/plain" hidden>

/* reparte un rectángulo de frente (x,y,w,h) del alzado en n puertas o cajones */
function frentes(rect,n,dir,juego){const L=[];for(let i=0;i<n;i++){if(dir==='h'){const w=(rect.w-(n+1)*juego)/n;L.push({x:rect.x+juego+i*(w+juego),y:rect.y+juego,w,h:rect.h-2*juego})}else{const h=(rect.h-(n+1)*juego)/n;L.push({x:rect.x+juego,y:rect.y+juego+i*(h+juego),w:rect.w-2*juego,h})}}return L}
/* superpuesta: el frente tapa el casco; juego g entre frentes (g/2 en cada borde) */
function frSup(m,n,dir,g,y0,h){const r={x:m.x,y:m.y+(y0||0),w:m.w,h:h||m.h};return frentes({x:r.x-g/2,y:r.y-g/2,w:r.w+g,h:r.h+g},n,dir,g)}
/* interior: el frente entra en el hueco del casco con holgura F */
function frInt(m,n,dir,F,E,y0,h){const r={x:m.x+E,y:m.y+E+(y0||0),w:m.w-2*E,h:(h||m.h)-2*E};return frentes(r,n,dir,F)}

function validaPue(r,P){const alta=P.calidad==='Alta';
  if(P.tipo==='entrada_ab'){if(P.kg>80)return false;if(alta&&(P.estilo==='Industrial'||P.estilo==='Rústico')&&P.kg>80)return false}
  if(P.tipo==='entrada_piv'&&P.piv==='jnf100'&&(P.kg>100||P.an>1000))return false;
  if(P.tipo==='entrada_ab'||P.tipo==='entrada_piv'){
    /* bombillo: centro de la cerradura a c mm de la cara exterior; escudo exterior 15 mm; roseta interior ri */
    const ok=[];for(const c of [12,14,15,16,18,20])for(const ri of [6,8,10]){const A=c+15,B=P.e-c+ri,a=BOMB.find(v=>v>=A),b=BOMB.find(v=>v>=B);if(a&&b&&ART[`bomb_${a}_${b}`])ok.push([c,ri,A,B,a,b])}

    const col=P.galce?{Moderno:'blanco',Clásico:'beige',Industrial:'negro',Rústico:'negro'}[est]:{Moderno:'blanco',Clásico:'marrón',Industrial:'negro',Rústico:'negro'}[est];
    const bid=P.galce?'burg_'+col:'bursg_'+col;
    linea(L,{g:'pue',fam:11,ids:[bid],cant:1,ud:'ud',tit:'Burlete de cerco',desc:`Burlete de cerco para puerta ${P.galce?'con galce':'sin galce'}, color ${art(bid).parametros_tecnicos.color}, rollo de 25 m.`,calc:'1 rollo (el perímetro del cerco no llega a 25 m).'});
    linea(L,{g:'pue',fam:11,ids:['junta_'+P.junta],cant:1,ud:'ud',tit:'Junta automática bajo puerta',desc:`Junta automática que se encastra en la parte inferior de la hoja de ${P.an} mm de ancho.`,calc:`La longitud inmediatamente inferior al ancho de la hoja (${P.an} mm): ${P.junta} mm.`})}
  if(P.tipo==='paso_ab'){
    if(P.galce){const id=P.mano==='izquierda'?'pernio_izq':'pernio_der';
      linea(L,{g:'pue',fam:11,ids:[id],cant:3,ud:'ud',tit:'Pernios',desc:`Pernio de 100 mm para puerta de paso con galce, ${hoja}, mano ${P.mano}.`,calc:`Peso ${coma(P.kg,1)} kg ≤ 60 kg (2 pernios). 3 por hoja (no supera 2100 mm ni 60 kg).`})}
    else{const id={Moderno:'h12s_297',Clásico:'h12s_504',Industrial:'h12s_290',Rústico:'h12s_290'}[est];
      linea(L,{g:'pue',fam:11,ids:[id],cant:2,ud:'ud',tit:'Bisagras ocultas',desc:`Bisagra oculta regulable para puerta de paso enrasada sin galce, ${hoja}; acabado ${art(id).parametros_tecnicos.acabado}. Aplica la recomendación de la ficha técnica para el número de bisagras.`,calc:`La ficha de la H12 S manda: hoja menor de 2100 × 900 mm y ${coma(P.kg,1)} kg ≤ 60 kg → 2 bisagras (prevalece sobre la regla general de 3).`})}
    if(P.acc==='pomo'){const id=P.bano?'tesa_bano':'tesa_paso';
      linea(L,{g:'pue',fam:11,ids:[id],cant:1,ud:'juego/par',tit:P.bano?'Pomo de baño':'Pomo de paso',desc:`Pomo giratorio ${P.bano?'de baño con condena y descondena':'de paso'}, cuadradillo de 8 mm, para hoja de ${P.e} mm; incluye picaporte tubular. Proveedor: Verdú.`,calc:'1 juego por puerta.'})}
    else if(P.bano){linea(L,{g:'pue',fam:11,ids:['magn_wc'],cant:1,ud:'ud',tit:'Cerradura de baño',desc:'Cerradura magnética silenciosa para baño con condena (WC), entrada 55 mm, distancia 78 mm.',calc:'1 por hoja.'});
      linea(L,{g:'pue',fam:11,ids:['cerradero_wc'],cant:1,ud:'ud',tit:'Cerradero magnético',desc:'Cerradero de la cerradura magnética anterior; se pide aparte.',calc:'1.'});
      const id={Moderno:'man_wc_mod',Clásico:'man_wc_cla',Industrial:'man_wc_neg',Rústico:'man_wc_neg'}[est];
      linea(L,{g:'pue',fam:11,ids:[id],cant:1,ud:'juego/par',tit:'Manivelas de baño',desc:`Juego de manivelas con condena de baño (WC), estilo ${est.toLowerCase()}${negro?' (negro mate)':''}; tiene que ir con su cerradura.`,calc:'1 juego.'})}
    else{linea(L,{g:'pue',fam:11,ids:[P.galce?'picaporte_20':'picaporte_24'],cant:1,ud:'ud',tit:'Picaporte',desc:`Picaporte (resbalón de rodillo) de embutir para puerta de paso, tipo PZ, entrada 55 mm, frente para hoja ${P.galce?'con':'sin'} galce.`,calc:'1 por hoja.'});
      const id={Moderno:'man_pz_mod',Clásico:'man_pz_cla',Industrial:'man_pz_ind',Rústico:'man_pz_neg'}[est];
      linea(L,{g:'pue',fam:11,ids:[id],cant:1,ud:'juego/par',tit:'Manivelas de paso',desc:`Juego de manivelas con roseta del mismo tipo que el picaporte (PZ), estilo ${est.toLowerCase()}${est==='Rústico'?' (negro mate)':''}.`,calc:'1 juego.'})}
    const tid=negro?'tope_605':'tope_603';
    linea(L,{g:'pue',fam:11,ids:[tid],cant:1,ud:'ud',tit:'Tope',desc:`Tope de pared de fundición de zinc, Ø 38 mm, acabado ${art(tid).nombre.split(', ').pop()}.`,calc:'1 por hoja.'})}
  if(P.tipo==='paso_cv'){const id=alta?'s80m_1800':(P.an<=1000?(negro?'s100_2000_neg':'s100_2000_ino'):(negro?'s100_2500_neg':'s100_2500_ino'));
    linea(L,{g:'pue',fam:11,ids:[id],cant:1,ud:'juego/par',tit:'Herraje de corredera vista',desc:`Corredera vista por delante de la pared, ${hoja}. ${alta?'Calidad alta: rodadura oculta con cierre amortiguado en los dos sentidos, carril incluido.':`Calidad normal: herraje visto, acabado ${negro?'negro':'inoxidable mate'}; el carril mide unas dos veces el ancho de la hoja.`} Juego completo (carril, carros, guía de suelo y topes).`,calc:alta?`Peso ${coma(P.kg,1)} kg ≤ 80 kg; carril ≥ 2 × ${P.an} = ${2*P.an} mm → 1800 mm.`:`Hoja de ${P.an} mm → carril ${P.an<=1000?2000:2500} mm; ${coma(P.kg,1)} kg ≤ 100 kg.`});
    if(P.bano){const w={Moderno:'wcc_500',Industrial:'wcc_503',Rústico:'wcc_503',Clásico:'wcc_508'}[est];linea(L,{g:'pue',fam:11,ids:[w],cant:1,ud:'ud',tit:'Cerradura de gancho de baño',desc:`Cerradura de gancho para corredera de baño, con condena y tiradores de concha embutidos, hoja de ${P.e} mm.`,calc:'1 por hoja.'})}
    else linea(L,{g:'pue',fam:11,ids:['tir_caja'],cant:1,ud:'ud',tit:'Tirador embutido',desc:'Tirador embutido para hoja corredera de madera.',calc:'1 por hoja.'})}
  if(P.tipo==='paso_co'){
    linea(L,{g:'pue',fam:11,ids:[P.hawa],cant:1,ud:'juego/par',tit:'Corredera oculta entre tabiques',desc:`Sistema de corredera oculta entre tabiques (Pocket) con carril en techo, ${hoja}. El armazón del tabique (casoneto) es de otro proveedor y no se pide.`,calc:`Peso ${coma(P.kg,1)} kg → ${P.hawa==='hawa60'?'Porta 60 (≤ 60 kg)':'Porta 100 (≤ 100 kg)'}.`});
    const pl=[2000,2500,3000].find(x=>x>=2*P.an);
    linea(L,{g:'pue',fam:11,ids:['perfil_pocket_'+pl],cant:1,ud:'ud',tit:'Perfil de deslizamiento',desc:'Perfil (carril) de deslizamiento del sistema Pocket, que se pide aparte; longitud: la menor que llegue a dos veces el ancho de la hoja (2000, 2500 o 3000 mm).',calc:`2 × ${P.an} = ${2*P.an} mm → ${pl} mm.`});
    linea(L,{g:'pue',fam:11,ids:['tir_caja'],cant:1,ud:'ud',tit:'Tirador embutido',desc:'Tirador embutido para hoja corredera de madera.',calc:'1 por hoja.'})}
}

/* ======================================================================
   FASE 2: PROBLEMAS DE CÁLCULO
   ====================================================================== */
function problemas(C,r){const M=C.mob,P=C.pue,L=[],ad=o=>{o.id='p'+(L.length+1);L.push(o)};
  const pu=todasPuertas(M);
  if(M.mont&&pu.length){const ref=pu.find(p=>(p.mont||M.mont)===M.mont)||pu[0],mt=M.mont,A=MONT[mt].A;
    ad({t:'num',ud:'mm',sol:A,tol:.05,lam:1,txt:`Acodamiento A de la bisagra que corresponde a las puertas del módulo ${ref.m.id} (mira el detalle A de la lámina 1).`,pasos:`${MONT[mt].n[0].toUpperCase()+MONT[mt].n.slice(1)} → ${MONT[mt].b} (${MONT[mt].h}) → A = ${n1(A)} mm.`,pista:'Mira la sección del encuentro costado-puerta (lámina 1): ¿la puerta tapa el costado entero, la mitad o queda dentro?'});
    const H=M.H;
    ad({t:'num',ud:'mm',sol:H,tol:.05,lam:1,txt:`Suplemento de base H para las puertas del módulo ${ref.m.id}, con los datos del detalle A (C0 = ${C0} mm; C enrasado = ${CENR} mm).`,
      pasos:mt==='int'?`H = K + F − C enrasado = ${M.K} + ${M.F} − ${CENR} = ${H} mm.`:mt==='media'?`R = (E − J)/2 = (${M.E} − ${M.J})/2 = ${n1(M.R)}; H = C0 − A + K − R = ${C0} − 9,5 + ${M.K} − ${n1(M.R)} = ${H} mm.`:`R = E − juego/2 = ${M.E} − ${n1(M.g/2)} = ${n1(M.R)}; H = C0 − A + K − R = ${C0} − 0 + ${M.K} − ${n1(M.R)} = ${H} mm.`,
      pista:mt==='int'?'Puerta interior: H = K + F − C enrasado.':mt==='media'?'Puerta a media: primero el recubrimiento R = (E − J)/2; después H = C0 − A + K − R.':'Puerta superpuesta: H = C0 − A + K − R, con A = 0 y R el recubrimiento que se ve en la sección.'});
    ad({t:'num',ud:'mm',sol:M.D,tol:.05,lam:1,txt:`Distancia D de la base comercial que hay que pedir (serie ${M.serie}: bases de ${BASES_SERIE[M.serie].join(', ')} mm).`,pasos:`Base inmediatamente igual o superior a H = ${H}: D = ${M.D} mm${M.D>H?`; el resto (${M.D-H} mm) se ajusta con la regulación lateral`:''}.`,pista:'Elige la base comercial igual o inmediatamente superior al H calculado.'});
    ad({t:'num',ud:'mm',sol:M.K+17.5,tol:.05,lam:2,txt:`Distancia del canto de la puerta al centro de la cazoleta (Ø35) con K = ${M.K} mm.`,pasos:`K + radio de la cazoleta = ${M.K} + 17,5 = ${n1(M.K+17.5)} mm.`,pista:'K se mide del canto de la puerta al borde de la cazoleta; súmale el radio.'});
    const s32=mt==='int'?37+M.ef:37;
    ad({t:'num',ud:'mm',sol:s32,tol:.05,lam:2,txt:`Distancia del canto delantero del costado al eje de los taladros Ø5 de la base (Sistema 32) en estas puertas (frente de ${M.ef} mm).`,pasos:mt==='int'?`Puerta interior: la línea de taladros se retrasa el grueso de la puerta: 37 + ${M.ef} = ${s32} mm.`:'Puerta superpuesta o a media: 37 mm del canto delantero.',pista:'Sistema 32: primera fila a 37 mm del canto. Si la puerta queda dentro del casco, suma su grueso.'});
    const big=pu.reduce((a,b)=>b.h*b.w>a.h*a.w?b:a);const kg=peso(big.h,big.w,M.ef,MAT[M.fmat][1]);
    ad({t:'num',ud:'kg',sol:r1(kg),tol:.11,lam:1,txt:`Peso de la puerta mayor del conjunto (${big.m.id}, ${dimAA(r1(big.h),r1(big.w),M.ef)}).`,pasos:`${n1(big.h/1000)} × ${n1(big.w/1000)} × ${M.ef/1000} × ${MAT[M.fmat][1]} = ${coma(kg,1)} kg.`,pista:'Peso = Alto (m) × Ancho (m) × Espesor (m) × Densidad (kg/m³). Pasa los mm a m.'});
    ad({t:'num',ud:'ud',sol:nBis(big.h),tol:0,lam:1,txt:`Número de bisagras de esa puerta (${fmt(r1(big.h))} mm de alto).`,pasos:`${fmt(r1(big.h))} mm → ${nBis(big.h)} bisagras (2 hasta 900, 3 hasta 1600, 4 por encima).`,pista:'2 hasta 900 mm de alto, 3 hasta 1600 mm, 4 por encima.'})}
  const ev=elevs(M);
  if(ev.length){const e=ev[0];ad({t:'num',ud:'kg',sol:r1(e.kg),tol:.11,lam:2,txt:`Peso del frente elevable del módulo ${e.m.id} (${dimAA(r1(e.h),r1(e.w),M.ef)}).`,pasos:`${n1(e.h/1000)} × ${n1(e.w/1000)} × ${M.ef/1000} × ${MAT[M.fmat][1]} = ${coma(e.kg,1)} kg.`,pista:'Peso = Alto × Ancho × Espesor (en m) × densidad.'});
    const ops=[...new Set(FREE.map(f=>f.p.serie))];
    ad({t:'sel',ops,sol:e.m.free.serie,lam:2,txt:`Serie Häfele Free para el módulo ${e.m.id}: mueble de ${e.m.h} mm de alto, frente de ${coma(e.kg,1)} kg, apertura ${{flapH:'basculante de una pieza (calidad normal)',flap:'basculante de una pieza (calidad alta)',fold:'plegable en dos hojas',space:'en paralelo, sin tirador'}[e.free]}.`,pasos:`Altura ${e.m.h} mm y ${coma(e.kg,1)} kg → ${e.m.free.serie} (${e.m.free.ids.map(REF).join(' o ')}).`,pista:'La ficha Free elige por la altura del mueble (mm) y el peso del frente (kg). No hace falta factor de potencia.'})}
  const g=(todosCajones(M).length||(M.tramos||[]).some(T=>T.cajInt))?guiaSel(M):null;
  if(g)ad({t:'num',ud:'mm',sol:g.nl,tol:0,lam:2,txt:`Longitud nominal (NL) de la guía de cajón de ${M.calidad==='Alta'?'50':'30'} kg: fondo interior útil ${M.fondoGuia} mm; fondo mínimo de montaje según la ficha = NL + ${g.s} mm. Longitudes de la gama: ${CATALOGO_DB.articulos.filter(a=>a.familia===3&&a.parametros_tecnicos.carga_kg===(M.calidad==='Alta'?50:30)).map(a=>a.parametros_tecnicos.NL).join(', ')} mm.`,pasos:`La mayor NL con NL + ${g.s} ≤ ${M.fondoGuia}: ${g.nl} (${g.nl+g.s} mm).`,pista:`Prueba de mayor a menor: NL + ${g.s} no puede pasar del fondo útil.`});
  if(M.tipo==='vestidor'||M.tipo==='armario'){const b=art(M.barraId).parametros_tecnicos,w=M.tipo==='vestidor'?M.mods[0].tramo.ti:M.ti;
    ad({t:'num',ud:'ud',sol:2+(w>b.luz_max_sin_soporte?1:0),tol:0,lam:2,txt:`Soportes que necesita una barra ${b.material==='roble'?'de roble':'de aluminio'} en un tramo de ${w} mm de ancho interior.`,pasos:`${w} mm ${w>b.luz_max_sin_soporte?'>':'≤'} ${b.luz_max_sin_soporte} mm → ${2+(w>b.luz_max_sin_soporte?1:0)} soportes.`,pista:'2 laterales, más 1 central si supera 1000 mm (roble) o 1300 mm (aluminio).'})}
  if(M.tipo==='armario'&&M.corredera)ad({t:'num',ud:'kg',sol:r1(M.hojaKg),tol:.11,lam:1,txt:`Peso de cada hoja corredera del armario (${dimAA(M.hojaAl,M.hojaAn,M.ef)}).`,pasos:`${n1(M.hojaAl/1000)} × ${n1(M.hojaAn/1000)} × ${M.ef/1000} × ${MAT[M.fmat][1]} = ${coma(M.hojaKg,1)} kg.`,pista:'Peso = Alto × Ancho × Espesor (en m) × densidad.'});
  if(M.tipo==='armario'&&M.corredera){const Wt=M.mods.reduce((s,m)=>s+m.w,0),n=M.hojas.length;
    ad({t:'num',ud:'mm',sol:M.hojaAn,tol:.5,lam:1,txt:`Ancho de cada hoja corredera: ${n} hojas iguales que cubren el frente de ${Wt} mm, con un solape de 30 mm entre hojas contiguas.`,pasos:`(${Wt} + ${n-1} × 30) / ${n} = ${M.hojaAn} mm.`,pista:'Las hojas solapan: al frente total se le suman los solapes y se reparte entre las hojas.'})}
  const leds=[];(M.tramos||[]).forEach(T=>T.led&&leds.push(T.ti));if(M.tipo==='vestidor')leds.push(M.mods[0].tramo.ti);
  if(leds.length){const m=leds.reduce((s,w)=>s+w,0)/1000,W=m*4.8;
    ad({t:'num',ud:'W',sol:r1(W),tol:.11,lam:2,txt:`Potencia de la tira LED (4,8 W/m) para ${leds.join(' + ')} mm de barra iluminada.`,pasos:`${n1(m)} m × 4,8 W/m = ${coma(W,1)} W.`,pista:'Potencia = metros de tira × vatios por metro.'});
    ad({t:'num',ud:'W',sol:[20,40,60].find(x=>x>=W),tol:0,lam:2,txt:'Potencia del transformador a pedir (transformadores de 20, 40 y 60 W).',pasos:`El primero que supera ${coma(W,1)} W: ${[20,40,60].find(x=>x>=W)} W.`,pista:'Elige el transformador cuya potencia cubra la de la tira.'})}
  const cjs=todosCajones(M);if(cjs.length&&!(M.mont)){const c=cjs[0],kg=peso(c.h,c.w,M.ef,MAT[M.fmat][1]);
    ad({t:'num',ud:'kg',sol:r1(kg),tol:.11,lam:1,txt:`Peso de un frente de cajón del módulo ${c.m.id} (${dimAA(r1(c.h),r1(c.w),M.ef)}).`,pasos:`${n1(c.h/1000)} × ${n1(c.w/1000)} × ${M.ef/1000} × ${MAT[M.fmat][1]} = ${coma(kg,1)} kg.`,pista:'Peso = Alto × Ancho × Espesor (en m) × densidad.'})}
  {const m=M.cajonera||M.mods[0];ad({t:'num',ud:'mm',sol:m.d-74,tol:0,lam:2,txt:`Sistema 32: en el costado del módulo ${m.id} (fondo ${m.d} mm) hay dos filas de taladros Ø5, cada una a 37 mm de su canto. ¿Qué distancia hay entre los ejes de las dos filas?`,pasos:`${m.d} − 2 × 37 = ${m.d-74} mm.`,pista:'Cada fila está a 37 mm de su canto: resta las dos distancias al fondo del costado.'})}
  /* sistema 32 en baldas */
  const by=r.el([96,128,160]),k=r.el([3,4,5,6]);ad({t:'num',ud:'mm',sol:by+32*(k-1),tol:0,lam:2,txt:`Sistema 32: en el costado, el primer taladro Ø5 de la fila de portaestantes está a ${by} mm de la cara superior del suelo. ¿A qué altura está el taladro número ${k}?`,pasos:`${by} + 32 × (${k} − 1) = ${by+32*(k-1)} mm.`,pista:'Los taladros van cada 32 mm.'});
  /* carpintería */
  ad({t:'num',ud:'kg',sol:r1(P.kg),tol:.11,lam:3,txt:`Peso de la hoja de la ${TIPO_PUE[P.tipo].toLowerCase()} (${dimAA(P.al,P.an,P.e)}, ${MAT[P.mat][0]}).`,pasos:`${n1(P.al/1000)} × ${n1(P.an/1000)} × ${P.e/1000} × ${P.dens} = ${coma(P.kg,1)} kg.`,pista:'Peso = Alto × Ancho × Espesor (en m) × densidad del cuadro de materiales.'});
  if(P.tipo==='entrada_ab'||P.tipo==='paso_ab'){const ficha=P.tipo==='paso_ab'&&!P.galce;const n=ficha?2:(P.al>2100||P.kg>60?4:3);
    ad({t:'num',ud:'ud',sol:n,tol:0,lam:3,txt:`Número de ${P.galce?'pernios':'bisagras ocultas'} de la hoja.`,pasos:ficha?`La ficha de la bisagra oculta H12 S manda: hasta 2100 × 900 mm y 60 kg, 2 bisagras.`:`3 por hoja; 4 si supera 2100 mm de alto o 60 kg (${P.al} mm, ${coma(P.kg,1)} kg) → ${n}.`,pista:ficha?'Si la ficha técnica da un criterio, prevalece sobre la regla general.':'3 por hoja; 4 si supera 2100 mm de alto o 60 kg.'})}
  if(P.tipo==='entrada_ab'||P.tipo==='entrada_piv'){
    if(P.elec!=='tarjeta'){ad({t:'num',ud:'mm',sol:P.Ab,tol:0,lam:3,txt:'Medida A (lado exterior) del bombillo a pedir.',pasos:`A = ${P.c} + 15 (escudo) = ${P.Am} → medida comercial ${P.Ab} mm.`,pista:'A: del centro de la cerradura a la cara exterior, más el escudo; después, la medida comercial igual o superior (27, 31, 35, 40, 45…).'});
      ad({t:'num',ud:'mm',sol:P.Bb,tol:0,lam:3,txt:'Medida B (lado interior) del bombillo a pedir.',pasos:`B = ${P.e-P.c} + ${P.ri} (roseta) = ${P.Bm} → ${P.Bb} mm.`,pista:'B: del centro de la cerradura a la cara interior, más la roseta.'})}
    ad({t:'num',ud:'mm',sol:P.junta,tol:0,lam:3,txt:`Longitud de la junta automática bajo puerta (longitudes: ${JUNTAS.join(', ')} mm) para la hoja de ${P.an} mm.`,pasos:`La inmediatamente inferior a ${P.an}: ${P.junta} mm.`,pista:'Tiene que quedar por debajo del ancho de la hoja.'})}
  if(P.tipo==='entrada_piv'){const ops=['JNF 100 (hasta 100 kg, hoja ≤ 1000 mm)','Heavy Duty IN.05.501 (hasta 500 kg, sin cierre)','JNF 500 PLUS (hasta 500 kg, hidráulico con retención)'];
    ad({t:'sel',ops,sol:ops[P.piv==='jnf100'?0:P.piv==='libre'?1:2],lam:3,txt:`Pivote para la hoja (${coma(P.kg,1)} kg, ${P.an} mm de ancho, ${P.e} mm de grueso${P.piv==='jnf100'?'':P.piv==='libre'?', giro libre sin cierre automático':', con cierre hidráulico y retención'}).`,pasos:`${coma(P.kg,1)} kg, ${P.an} mm → ${ops[P.piv==='jnf100'?0:P.piv==='libre'?1:2]}.`,pista:'Compara peso, ancho y grueso con la ficha de cada pivote.'})}
  if(P.tipo==='paso_cv'&&P.calidad!=='Alta')ad({t:'num',ud:'mm',sol:P.an<=1000?2000:2500,tol:0,lam:3,txt:`Longitud del carril de la corredera vista para la hoja de ${P.an} mm (carriles de 2000 y 2500 mm).`,pasos:`Hoja de 750–1000 mm → 2000; 1001–1250 → 2500 (≈ 2 × ancho).`,pista:'El carril mide unas dos veces el ancho de la hoja.'});
  if(P.tipo==='paso_cv'&&P.calidad==='Alta')ad({t:'num',ud:'mm',sol:1800,tol:0,lam:3,txt:`Longitud del carril de la corredera vista para la hoja de ${P.an} mm (carriles de 1100 y 1800 mm; el carril debe medir al menos dos veces el ancho de la hoja).`,pasos:`2 × ${P.an} = ${2*P.an} mm → 1800 mm.`,pista:'El carril mide unas dos veces el ancho de la hoja.'});
  if(P.tipo==='paso_co')ad({t:'num',ud:'kg',sol:P.hawa==='hawa60'?60:100,tol:0,lam:3,txt:'Carga máxima (kg) del sistema Pocket que hay que elegir (60 o 100 kg).',pasos:`${coma(P.kg,1)} kg → ${P.hawa==='hawa60'?60:100} kg.`,pista:'El sistema se elige por el peso de la hoja.'});
  /* se dejan entre 8 y 10 problemas, conservando el orden */
  let out=L;if(out.length>10){const keep=new Set(r.mezcla(out.map((_,i)=>i)).slice(0,10));out=out.filter((_,i)=>keep.has(i))}
  out.forEach((p,i)=>p.id='p'+(i+1));return out}

/* ======================================================================

  const dd=Math.hypot(mx-ax,my-ay)||1;L.ln(ax,ay,mx-(mx-ax)*3.3/dd,my-(my-ay)*3.3/dd,'z').ci(ax,ay,.7,'zp').add(`<circle cx="${f2(mx)}" cy="${f2(my)}" r="3.3" class="zc" data-z="${n}"/>`).txt(mx,my+1.25,String(n),HMIN,'middle',0,'zt')}
const zonaDe=(C,lam,pred)=>C.f1.find(z=>z.lam===lam&&pred(z.ancla));

/* ======================================================================
   LÁMINA 1: CONJUNTO DE MOBILIARIO (alzado, planta, lateral, detalle A)
   ====================================================================== */
function bbox(M){let W=0,H=0,D=0;M.mods.forEach(m=>{W=Math.max(W,m.x+m.w);H=Math.max(H,m.y+m.h);D=Math.max(D,m.d)});if(M.hojas)M.hojas.forEach(h=>W=Math.max(W,h.x+h.w));return {W,H,D}}
function lamina1(C,opt){const M=C.mob,L=Lienzo(),us=[];marco(L);const {W,H,D}=bbox(M);
  const esc=[20,25,30].find(e=>W/e+D/e<=232&&(H+D)/e<=168)||30,k=1/esc;
  const xA=MIZ+16,yA=MOT+30+H*k;const X=v=>xA+v*k,Y=v=>yA-v*k;
  titulo(L,MIZ+7,MOT+9,`${TIPO_MOB[M.tipo].toUpperCase()} · ESTILO ${M.estilo.toUpperCase()} · CALIDAD ${M.calidad.toUpperCase()}`);
  /* --- alzado --- */
  L.ln(X(-120),Y(0),X(W+120),Y(0),'g');
  M.mods.forEach(m=>{L.re(X(m.x),Y(m.y+m.h),m.w*k,m.h*k,'g');
    if(m.kind!=='alto'&&m.y>0){L.ln(X(m.x),Y(m.y),X(m.x+m.w),Y(m.y),'f');const [t]=ajusta(m.id,m.w*k-2,HMIN,HMIN);if(m.y*k>=3.2)L.txt(X(m.x+m.w/2),Y(m.y/2)+1.25,t,HMIN,'middle')}
    m.fr.forEach(f=>{L.re(X(f.x),Y(f.y+f.h),f.w*k,f.h*k,'fr');
      if(f.tipo==='puerta'){const ax=f.bis==='izq'?f.x+f.w:f.x,mx=f.bis==='izq'?f.x:f.x+f.w;L.pl([[X(ax),Y(f.y+f.h)],[X(mx),Y(f.y+f.h/2)],[X(ax),Y(f.y)]],'ap',false)}
      if(f.tipo==='elev')L.pl([[X(f.x),Y(f.y)],[X(f.x+f.w/2),Y(f.y+f.h)],[X(f.x+f.w),Y(f.y)]],'ap',false);
      if(!M.push&&['puerta','cajon','elev','extraible'].includes(f.tipo)){const pz=f.tipo==='puerta',tx=pz?(f.bis==='izq'?f.x+f.w-50:f.x+50):f.x+f.w/2,ty=pz?(m.kind==='alto'?f.y+120:Math.max(f.y+150,Math.min(f.y+f.h-120,1100))):f.tipo==='elev'?f.y+50:f.y+f.h/2;
        if(M.estilo==='Rústico')L.ci(X(tx),Y(ty),.8,'g');else if(pz)L.ln(X(tx),Y(ty-80),X(tx),Y(ty+80),'tir');else L.ln(X(tx-80),Y(ty),X(tx+80),Y(ty),'tir')}})});
  if(M.hojas)M.hojas.forEach(h=>{L.re(X(h.x),Y(h.y+h.h),h.w*k,h.h*k,h.fila?'fr':'frb');L.ln(X(h.x+40),Y(h.y+h.h/2-100),X(h.x+40),Y(h.y+h.h/2+100),'tir')});
  if(M.tipo==='vestidor')M.mods.forEach(m=>{const E=M.E,t=m.tramo;L.re(X(m.x+E),Y(m.y+m.h-E),(m.w-2*E)*k,(m.h-2*E)*k,'f');
    if(m.id==='V1'){L.ln(X(m.x+E),Y(m.y+m.h-320),X(m.x+m.w-E),Y(m.y+m.h-320),'f');L.ln(X(m.x+E+10),Y(m.y+m.h-380),X(m.x+m.w-E-10),Y(m.y+m.h-380),t.equip?'o':'barra');L.ln(X(m.x+E+10),Y(m.y+m.h-1300),X(m.x+m.w-E-10),Y(m.y+m.h-1300),'led')}
    if(t.baldas){const top=m.h-E,bot=m.id==='V2'?m.h*.36+E:600;for(let i=1;i<=t.baldas;i++){const yy=bot+(top-bot)*i/(t.baldas+1);L.ln(X(m.x+E),Y(m.y+yy),X(m.x+m.w-E),Y(m.y+yy),'f')}}
    if(m.id==='V3')L.re(X(m.x+E+20),Y(m.y+560),(m.w-2*E-40)*k,500*k,'o')});
  /* cotas del alzado */
  cota(L,X(0),Y(H),X(W),Y(H),-11,fmt(W));
  const altos=M.mods.filter(m=>m.kind==='alto');let cx=null;altos.forEach(m=>{cota(L,X(m.x),Y(H),X(m.x+m.w),Y(H),-5,fmt(m.w))});
  const suelo=M.mods.filter(m=>m.kind!=='alto');suelo.forEach(m=>cota(L,X(m.x),Y(0),X(m.x+m.w),Y(0),5,fmt(m.w)));
  cota(L,X(0),Y(0),X(0),Y(H),-9,fmt(H));
  {const R=M.mods.reduce((a,m)=>m.x+m.w>=a.x+a.w?m:a),xr=X(W)+6,ch=[0];const bm=suelo.filter(m=>m.kind==='bajo').pop()||suelo[suelo.length-1];
    if(M.Z)ch.push(M.Z);if(bm)ch.push(bm.y+bm.h);const ar=altos.filter(m=>m.x+m.w===Math.max(...altos.map(q=>q.x+q.w))).pop();if(ar){ch.push(ar.y,ar.y+ar.h)}
    const cs=[...new Set(ch)].sort((a,b)=>a-b);for(let i=1;i<cs.length;i++)cota(L,xr,Y(cs[i-1]),xr,Y(cs[i]),0,fmt(cs[i]-cs[i-1]))}
  titulo(L,xA,yA+15,'ALZADO',`E 1:${esc}`);
  /* --- planta (debajo del alzado: pared arriba, frente abajo) --- */
  const yP=yA+22,PY=v=>yP+v*k;
  seccion(L,X(-120),PY(0)-2.5,(W+240)*k,2.5,1.2);
  M.mods.forEach(m=>{L.re(X(m.x),PY(0),m.w*k,m.d*k,m.kind==='alto'?'o':'g')});
  M.mods.forEach(m=>{const [t]=ajusta(m.id,m.w*k-2,HMIN,HMIN);L.txt(X(m.x+m.w/2),m.kind==='alto'?PY(m.d*.45)+1.25:PY(m.d*.78)+1.25,t,HMIN,'middle')});
  if(M.hojas){const d0=M.mods[0].d;M.hojas.forEach(h=>L.re(X(h.x),PY(d0+15+h.fila*25),h.w*k,M.ef*k,'frb'))}
  const dmax=Math.max(...M.mods.map(m=>m.d)),dal=altos.length?altos[0].d:0;
  cota(L,X(W),PY(0),X(W),PY(dmax),6,fmt(dmax));if(dal&&dal!==dmax)cota(L,X(W),PY(0),X(W),PY(dal),12,fmt(dal));
  titulo(L,xA,PY(dmax)+(M.hojas?14:11),'PLANTA',`E 1:${esc}`);
  /* --- vista lateral izquierda (pared a la izquierda, frente a la derecha) --- */
  const xL=X(W)+24,LX=v=>xL+v*k,m0=M.mods.find(m=>m.x===0&&m.kind!=='alto')||M.mods[0];
  L.ln(LX(-80),Y(0),LX(dmax+120),Y(0),'g');seccion(L,LX(0)-2.5,Y(H+60),2.5,(H+60)*k,1.2);
  M.mods.filter(m=>m!==m0).forEach(m=>L.re(LX(0),Y(m.y+m.h),m.d*k,m.h*k,'o'));
  L.re(LX(0),Y(m0.y+m0.h),m0.d*k,m0.h*k,'g');if(m0.fr.length&&M.mont!=='int')L.re(LX(m0.d),Y(m0.y+m0.h),M.ef*k,m0.h*k,'fr');
  if(M.tipo==='cocina')L.re(LX(0),Y(M.Z+M.hb+M.enc),(M.mods[1].d+20)*k,M.enc*k,'enc');
  cota(L,LX(0),Y(m0.y+m0.h),LX(m0.d),Y(m0.y+m0.h),-5,fmt(m0.d));
  titulo(L,xL,yA+15,'VISTA LATERAL IZQ.');
  /* --- detalle A y materiales --- */
  if(M.mont)detalleBisagra(L,C,299,MOT+14,us);else detalleCorredera(L,C,299,MOT+14,us);
  cuadroMat(L,C,297,MOT+128);
  vistaIso(L,cajas3D(M),ISOB);
  cajetin(L,{fecha:opt.fecha,escala:`1:${esc}`,n:'1/3',proyecto:`${TIPO_MOB[M.tipo]} ${M.estilo.toLowerCase()} · ${C.nombre||'muestra'}`,comp:'Conjunto de mobiliario',mat:`${corto(MAT[M.fmat][0])} ${MAT[M.fmat][1]}`,centro:opt.centro});
  /* zonas de la lámina 1 */
  C.f1.filter(z=>z.lam===1&&!z.ancla.pue).forEach(z=>{const p=ancla1(C,z.ancla,X,Y);if(p)marcador(L,z.n,p[0],p[1],p[2],p[3],us)});
  return L}
function ancla1(C,a,X,Y){const M=C.mob,m=a.mod?M.mods.find(q=>q.id===a.mod):null;
  if(a.que==='bis'&&m){const f=m.fr[a.fr>=0?a.fr:0]||m.fr.find(f=>f.tipo==='puerta');const x=f.bis==='izq'?f.x:f.x+f.w;return [X(x),Y(f.y+f.h*.3),f.bis==='izq'?7:-7,-7]}
  if(a.que==='caj'&&m){const f=m.fr.find(f=>f.tipo==='cajon');return [X(f.x+f.w*.2),Y(f.y+f.h/2),-5,9]}
  if(a.que==='elev'&&m){const f=m.fr.find(f=>f.tipo==='elev');return [X(f.x+f.w*.85),Y(f.y+f.h*.75),7,-7]}
  if(a.que==='colg'&&m)return [X(m.x+m.w-30),Y(m.y+m.h-30),6,-9];
  if(a.que==='pata'){const b=M.mods.find(q=>q.kind!=='alto');return [X(b.x+70),Y(b.y*.5),-6,9]}
  if(a.que==='union'){const b=M.mods.filter(q=>q.kind!=='alto');const q=b[b.length>1?1:0];return [X(q.x),Y(q.y+q.h*.55),-1,-10]}
  if(a.que==='tir'){for(const q of M.mods){const f=q.fr.find(f=>f.tipo==='cajon')||q.fr.find(f=>f.tipo==='puerta');if(f&&q.fr.some(g=>g.tipo==='cajon')){return [X(f.x+f.w/2+80),Y(f.y+f.h/2),9,4]}}for(const q of M.mods){const f=q.fr.find(f=>f.tipo==='puerta');if(f){const tx=f.bis==='izq'?f.x+f.w-50:f.x+50;return [X(tx),Y(q.kind==='alto'?f.y+120:f.y+f.h-120),8,5]}}return null}
  if(a.que==='corr'){const h=M.hojas[0];return [X(h.x+h.w*.55),Y(h.y+h.h*.9),5,-9]}
  if(a.que==='concha'){const h=M.hojas[0];return [X(h.x+40),Y(h.y+h.h/2),8,6]}
  return null}
function cajas3D(M){const B=[];M.mods.forEach(m=>{B.push({x:m.x,y:0,z:m.y,w:m.w,d:m.d,h:m.h,fr:m.fr.map(f=>({x:f.x,z:f.y,w:f.w,h:f.h}))});
    if(m.y>0&&m.kind!=='alto')B.push({x:m.x,y:50,z:0,w:m.w,d:m.d-50,h:m.y})});
  if(M.tipo==='cocina'){const b=M.mods.filter(m=>m.kind==='bajo');B.push({x:b[0].x,y:-20,z:M.Z+M.hb,w:b.reduce((s,m)=>s+m.w,0),d:b[0].d+20,h:M.enc})}
  if(M.hojas)M.hojas.forEach(h=>B.push({x:h.x,y:-30-h.fila*25,z:h.y,w:h.w,d:M.ef,h:h.h,fr:[]}));
  return B}
function cuadroMat(L,C,x,y){titulo(L,x,y,'MATERIALES Y DENSIDADES');const cw=[24,58,12,20];let yy=y+3;
  const fila=(a,t)=>{let xx=x;a.forEach((v,i)=>{L.re(xx,yy,cw[i],5.6,'cf');const [s,h]=ajusta(String(v),cw[i]-2,HMIN,HMIN);L.txt(i>=2?xx+cw[i]-1:xx+1,yy+4.2,s,h,i>=2?'end':'start',0,t);xx+=cw[i]});yy+=5.6};
  fila(['Pieza','Material','e','kg/m³'],'tb');C.mats.forEach(m=>fila([m.corto,m.mat,m.e,m.dens],'t'))}

/* detalle A: sección horizontal por el costado y la puerta a la altura de una bisagra, E 1:2.
   Frente del mueble arriba. a: horizontal hacia el interior del mueble; b: profundidad hacia atrás (desde el canto delantero del costado). */
function detalleBisagra(L,C,x0,y0,us){const M=C.mob,mt=M.mont,k=.5,E=M.E,ef=M.ef;titulo(L,x0,y0,'DETALLE A · SECCIÓN HORIZONTAL','E 1:2');
  const ox=x0+(mt==='media'?52:22),oy=y0+30,S=(a,b)=>[ox+a*k,oy+b*k];
  const LC=105,costado=(a0)=>{const p=S(a0,0);seccion(L,p[0],p[1],E*k,LC*k,1)};
  let aEdge,ladoInt,aBase;/* aEdge: canto de la puerta (a); aBase: cara interior del costado */
  if(mt==='media'){costado(-E/2);const R=M.R,J=M.J;
    [[-1],[1]].forEach(([sg])=>{const a1=sg>0?J/2:-J/2-75,p=S(a1,-ef);seccion(L,p[0],p[1],75*k,ef*k,1.2,sg<0)});
    aEdge=J/2;aBase=E/2;cota(L,...S(-E/2,LC),...S(E/2,LC),5,String(E));cota(L,...S(-J/2,-ef),...S(J/2,-ef),-5,`J ${J}`);cota(L,...S(J/2,-ef),...S(E/2,-ef),-11,`R ${n1(R)}`)}
  else if(mt==='int'){costado(0);const F=M.F,p=S(E+F,0);seccion(L,p[0],p[1],75*k,ef*k,1.2);aEdge=E+F;aBase=E;
    cota(L,...S(0,LC),...S(E,LC),5,String(E));cota(L,...S(E,0),...S(E+F,0),-6,`F ${F}`);cota(L,...S(E+75+F,0),...S(E+75+F,ef),4,String(ef))}
  else{costado(0);const R=M.R,p=S(E-R,-ef);seccion(L,p[0],p[1],80*k,ef*k,1.2);aEdge=E-R;aBase=E;
    cota(L,...S(0,LC),...S(E,LC),5,String(E));cota(L,...S(E-R,-ef),...S(E,-ef),-6,`R ${n1(R)}`);cota(L,...S(E-R+80,-ef),...S(E-R+80,0),4,String(ef))}
  /* cazoleta Ø35 en la cara interior de la puerta, a K del canto */
  const bIn=mt==='int'?ef:0,ac=aEdge+M.K,p1=S(ac,bIn),p2=S(ac+35,bIn);L.add(`<path class="cz" d="M${f2(p1[0])} ${f2(p1[1])}V${f2(p1[1]-6)}H${f2(p2[0])}V${f2(p2[1])}"/>`);
  cota(L,...S(aEdge,bIn),...S(ac,bIn),mt==='int'?-ef*k-13:9,`K ${M.K}`);
  /* brazo y base sobre la cara interior del costado, a 37 mm (o 37 + grueso de puerta) del canto delantero */
  const bBase=(mt==='int'?ef:0)+37,q1=S(ac+17.5,bIn+3),q2=S(aBase+4,bBase);L.re(...S(aBase,bBase-16),5*k,32*k,'hid');L.pl([q1,[q1[0],q2[1]],q2],'arm',false);
  L.ln(...S(aBase-4,bBase),...S(aBase+30,bBase),'e');cota(L,...S(aBase+12,0),...S(aBase+12,bBase),(mt==='media'?24:30)*k+6,String(bBase));
  const t=[`K = ${M.K} mm · C0 = ${C0} mm · C enrasado = ${CENR} mm`,`Esquema de cazoleta ${ESQ[M.esq]} · base en Sistema 32`,'Puerta y costado seccionados (rayado)'];
  t.forEach((s,i)=>L.txt(x0,y0+30+LC*k+13+i*4.4,s,HMIN));
  const z=zonaDe(C,1,a=>a.que==='bis');if(z){}}
function detalleCorredera(L,C,x0,y0){const M=C.mob;
  if(M.hojas){titulo(L,x0,y0,'DETALLE A · PLANTA DE LAS HOJAS','E 1:5');const k=.2,ox=x0+8,oy=y0+16;seccion(L,ox,oy,100,M.E*k,1);
    M.hojas.slice(0,2).forEach((h,i)=>{seccion(L,ox+10+i*35,oy+(M.E+20+i*30)*k,60,M.ef*k,1)});
    cota(L,ox+45,oy+(M.E+50)*k+M.ef*k,ox+70,oy+(M.E+50)*k+M.ef*k,8,'30');
    ['Hojas por delante del casco, en dos carriles',`Grueso de hoja ${M.ef} mm · solape 30 mm`].forEach((s,i)=>L.txt(x0,y0+60+i*4.4,s,HMIN))}
  else{titulo(L,x0,y0,'DETALLE A · MUEBLE ABIERTO');['Vestidor sin puertas: lo que manda es el','equipamiento interior (lámina 2).'].forEach((s,i)=>L.txt(x0,y0+10+i*4.4,s,HMIN))}}

/* ======================================================================
   LÁMINA 2: DETALLES (Sistema 32, cajón, cazoleta, elevable, colgar)
   ====================================================================== */
function lamina2(C,opt){const M=C.mob,L=Lienzo(),us=[];marco(L);titulo(L,MIZ+7,MOT+9,'DETALLES CONSTRUCTIVOS Y SISTEMA 32');
  /* celda 1: costado con Sistema 32 */
  const m=M.cajonera||M.mods[0],hh=m.h,esc=hh>1100?20:10,k=1/esc,x0=MIZ+16,yt=MOT+34,X=v=>x0+v*k,Y=v=>yt+(hh-v)*k;
  titulo(L,MIZ+7,MOT+20,`COSTADO ${m.id} · CARA INTERIOR`,`E 1:${esc}`);
  L.re(X(0),Y(hh),m.d*k,hh*k,'g');const y0=96;for(let v=y0;v<hh-60;v+=32){L.ci(X(37),Y(v),2.5*k,'f');L.ci(X(m.d-37),Y(v),2.5*k,'f')}
  cota(L,X(0),Y(hh),X(37),Y(hh),-5,'37');cota(L,X(m.d-37),Y(hh),X(m.d),Y(hh),-5,'37');cota(L,X(m.d),Y(y0),X(m.d),Y(y0+32),6,'32');cota(L,X(m.d),Y(0),X(m.d),Y(y0),6,String(y0));
  cota(L,X(0),Y(0),X(m.d),Y(0),6,String(m.d));L.txt(X(0),Y(0)+14,'Taladros Ø5 cada 32 mm',HMIN);L.txt(X(0),Y(0)+18.4,'Canto delantero a la izquierda',HMIN);
  {const z=zonaDe(C,2,a=>a.que==='balda');if(z)marcador(L,z.n,X(37),Y(y0+64),-8,-4,us)}
  /* celda 2: cajón */
  const hayCaj=todosCajones(M).length||(M.tramos||[]).some(T=>T.cajInt);
  if(hayCaj){const g=guiaSel(M),xc=150,kc=1/10,yc=MOT+34,Yc=v=>yc+(180-v)*kc;titulo(L,xc,MOT+20,'SECCIÓN DEL CAJÓN','E 1:10');
    L.re(xc,Yc(200),(M.fondoGuia+16)*kc,200*kc,'g');L.re(xc+M.ef*kc+.5,Yc(165),g.nl*kc,140*kc,'f');L.ln(xc+M.ef*kc+.5,Yc(20),xc+(g.nl+M.ef)*kc,Yc(20),'gu');seccion(L,xc-.2,Yc(185),M.ef*kc,180*kc,.8);
    cota(L,xc+M.ef*kc,Yc(0),xc+(M.fondoGuia+M.ef)*kc,Yc(0),6,`fondo útil ${M.fondoGuia}`);L.txt(xc,Yc(0)+14,'Guía oculta bajo el cajón (línea gruesa)',HMIN);
    for(const q of ['caj','cajint']){const z=zonaDe(C,2,a=>a.que===q);if(z)marcador(L,z.n,xc+(M.ef+g.nl*.5)*kc,Yc(20),-2,9,us)}
    {const z=zonaDe(C,2,a=>a.que==='unero');if(z)marcador(L,z.n,xc+M.ef*kc/2,Yc(170),-8,-6,us)}}
  /* celda 3: tramo de colgar o equipamiento */

/* --- comprobar y entregar --- */
function respStr(v){return JSON.stringify(v??'')}
function comprobar(k){const F=G.f[k],L=NITEMS(k);let nuevos=0,mal=0,vacios=0;
  L.forEach(it=>{const id=idOf(k,it),v=F.resp[id];const lleno=v!=null&&v!==''&&!(typeof v==='object'&&!Object.values(v).some(x=>x!==''&&x!=null));if(!lleno){vacios++;F.ok[id]=undefined;return}
    const ok=okItem(k,it,v);F.ok[id]=ok;if(!ok){mal++;const s=respStr(v);if(F.pen[id]!==s){F.pen[id]=s;nuevos++}}});
  if(nuevos){F.err+=nuevos;F.comp++}
  G.msg=mal?[`${L.length-mal-vacios} correctas, ${mal} con fallo${vacios?` y ${vacios} sin responder`:''}. ${nuevos?`${nuevos>1?`Restan ${nuevos} fallos nuevos`:`Resta 1 fallo nuevo`}.`:'Esos fallos ya estaban contados: corrígelos antes de volver a comprobar.'}`,'mal']:[vacios?`Todo lo respondido es correcto. Faltan ${vacios}.`:'¡Todo correcto! Ya puedes entregar la fase.','bien'];
  pinta()}
function entregar(k){const F=G.f[k],L=NITEMS(k),ac=aciertos(k);if(ac<L.length&&!confirm(`Tienes ${ac} de ${L.length} correctas. Lo que no esté bien contará como fallo. ¿Entregas la fase ${k}?`))return;
  L.forEach(it=>{const id=idOf(k,it);F.ok[id]=okItem(k,it,F.resp[id])});F.nota=notaFase(L.length,ac,F.err,Object.keys(F.pistas).length);F.hecha=true;G.msg=null;
  if(k<3){G.fase='f'+(k+1);G.lam=k===1?0:0;G.vb=null;G.herr='enc';pinta();$('#der').scrollTop=0}else{G.fase='fin';pinta();emitir()}}
function pista(k,id){const F=G.f[k];if(F.pistas[id])return;if(!confirm('La pista resta 0,35 puntos en la nota de esta fase. ¿La quieres?'))return;F.pistas[id]=1;pinta()}
function autofill(k){const F=G.f[k];NITEMS(k).forEach(it=>{const id=idOf(k,it);F.resp[id]=k===1?{fam:it.fam,tipo:it.tipo}:k===2?(it.t==='sel'?it.sol:n1(it.sol)):{prov:it.prov,ref:it.refs[0],cant:String(it.cant),ud:it.ud}});G.msg=['Fase autocompletada con la solución (revisión).','info'];pinta()}

async function compCert(n,c){const m=/^(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d{12})-([0-9A-F]{8})$/.exec(String(c).trim().toUpperCase());if(!m||!n.trim())return {ok:false};

  return `<div class="aviso"><b>Para el alumnado:</b> <span class="mono" style="word-break:break-all">${esc(cu)}</span><br><b>Para usted:</b> el mismo enlace terminado en <span class="mono">#profesor</span>, con la clave. No comparta ni lo uno ni lo otro con el alumnado.</div>
  <h3>Qué es</h3><p class="ins">Juego de una sola página para 1º CFGS de Diseño y Amueblamiento. Cada partida trae un encargo doble (mobiliario y puerta) con estilo, calidad, medidas, grosores y densidades propios del alumno y del intento. Sin instalación ni registro.</p>
  <h3>Fases y nota</h3>${li(['Fase 1 · Lectura de planos (20 %): 10–12 zonas marcadas en 3 láminas; familia y tipo de herraje.','Fase 2 · Cálculos (35 %): 8–10 problemas: acodamiento A y suplemento H de la base (H = C0 − A + K − R; interior: H = K + F − C enrasado), base comercial, pesos, número de bisagras, elevable Free por altura y peso, guías por longitud mínima de montaje, bombillo A + B, junta bajo puerta, Sistema 32.','Fase 3 · Hoja de pedido (45 %): proveedor, Nº de artículo real, cantidad y unidad por línea, con las piezas que van aparte.','Nota de fase = aciertos / N × 10 − 0,25 × 10 / N por cada fallo nuevo al comprobar − 0,35 por pista (mínimo 0).','Nota final = F1 × 0,20 + F2 × 0,35 + F3 × 0,45. APTO con 5 en la final y 5 en la fase 3.'])}
  <h3>Criterios de taller que aplica</h3>${li(['Bisagras de mueble: 2 hasta 900 mm de alto, 3 hasta 1600, 4 por encima; una base por bisagra.','Pernios: 3 por hoja, 4 si supera 2100 mm o 60 kg (Häfele da la carga para 2 bisagras). La ficha manda: la Startec H12 S lleva 2 hasta 2100 × 900 mm y 60 kg.','Guías: 1 juego por cajón · Tiradores: 1 por puerta, cajón o frente · Portaestantes: 4 por balda móvil · Colgadores: 2 por mueble alto · Patas: 4 por módulo en el suelo (los clips de zócalo no se piden aparte) · Tornillos de unión: 2 por unión de bajos o altos, 4 entre cuerpos altos.','Elevables Free: 1 juego por frente; Free flap H 1.5 con frente de 600 mm o más: 2.','Barras: 1 por tramo y 2 soportes; soporte central si supera 1000 mm (roble) o 1300 mm (aluminio).','LED: barra con perfil + tira (rollos de 5 m) + transformador según potencia + 1 interruptor o sensor por mueble.','Verdú solo para pivotes JNF, pomos Tesa, Yale Linus y manilla Castilla; todo lo demás, Häfele.'])}
  <h3>Limitaciones</h3><p class="ins">No hay servidor: partidas e intentos se guardan en el navegador. El código del certificado detecta cambios en nombre y notas, pero el archivo es público: si cuenta para la evaluación, el certificado no debería ser la única prueba. Los catálogos cambian cada curso: revise la pestaña «Catálogo y vigencia» al empezar el curso.</p>

    <h3>Fase 2 · cálculos paso a paso</h3><table><tr><th>Problema</th><th>Solución y pasos</th></tr>${C.f2.map(p=>`<tr><td>${p.txt}</td><td><b class="mono">${p.t==='sel'?esc(p.sol):n1(p.sol)+' '+p.ud}</b><br>${p.pasos}</td></tr>`).join('')}</table>
    <h3>Fase 3 · hoja de pedido</h3><table><tr><th>Nº</th><th>Línea</th><th>Prov.</th><th>Nº de artículo</th><th class="n">Cant.</th><th>Ud.</th></tr>${C.f3.map(l=>`<tr><td>${l.n}</td><td><b>${l.tit}</b><br><span class="ayu">${l.calc}</span></td><td>${l.prov}</td><td class="mono">${l.refs.join('<br>')}</td><td class="n">${l.cant}</td><td>${l.ud}</td></tr>`).join('')}</table>`}
  return `<p class="ins">Escriba un nombre y una semilla (la del certificado) o genere un caso aleatorio para ver el solucionario completo y saltar a cualquier fase.</p><div class="fila"><input class="txt" id="sn" placeholder="Nombre y apellidos" value="${esc(S.n)}" style="flex:2"><input class="txt mono" id="ss" placeholder="Semilla" value="${esc(S.s)}" style="width:120px"><button class="pri" data-a="simver">Ver solucionario</button><button class="sec" data-a="simrnd">Caso aleatorio</button></div>${t}`}
function pCat(){const D=CATALOGO_DB,by={};D.articulos.forEach(a=>(by[a.familia]=by[a.familia]||[]).push(a));
  return `<p class="ins">Curso de vigencia: <b>${D.curso}</b> · última verificación: <b>${D.verificado}</b> · ${D.articulos.length} referencias (${D.articulos.filter(a=>a.proveedor==='Verdú').length} de Verdú). Al empezar cada curso, ejecute <span class="mono">scripts/auditar_catalogo.py</span> y revise aquí las fichas.</p><div class="fila"><button class="sec" data-a="copcat">Copiar el bloque CATALOGO_DB (JSON)</button></div>
  ${Object.keys(by).sort((a,b)=>a-b).map(f=>`<h3>Familia ${f} · ${FAM[f]}</h3><table><tr><th>Ref.</th><th>Prov.</th><th>Artículo</th><th>Ficha</th></tr>${by[f].map(a=>`<tr><td class="mono">${a.ref}</td><td>${a.proveedor}</td><td>${esc(a.nombre)}${a.verificacion!=='leído'?` <span class="ayu">(${a.verificacion})</span>`:''}</td><td><a href="${esc(a.url_ficha)}" target="_blank" rel="noopener">abrir</a></td></tr>`).join('')}</table>`).join('')}`}
function pCentro(){const u=PFC?PFURL+'?centro='+encodeURIComponent(PFC):'';return `<p class="ins">Escriba el nombre de su centro. Con ese enlace, el cajetín de los planos y el certificado muestran su centro; la autoría no cambia. El encargo también depende del centro.</p><div class="fila"><input class="txt" id="pfc" maxlength="60" value="${esc(PFC)}" placeholder="Por ejemplo: IES Sierra Luna" style="flex:1"><button class="pri" data-a="pfcen">Crear enlace</button></div>${u?`<p class="mono" style="word-break:break-all;border:1px solid var(--co);padding:8px">${esc(u)}</p><div class="fila"><button class="sec" data-a="pfcop">Copiar enlace</button><a class="sec" href="${esc(u)}" target="_blank" rel="noopener">Abrir</a></div>`:''}`}

/* ======================================================================
   EVENTOS
   ====================================================================== */
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==='empezar'){const n=$('#nom').value;if(n.trim().split(/\s+/).length<2){G.msg=['Escribe tu nombre y al menos un apellido.','mal'];G.nombre=n;pinta();return}REV=false;empieza(n)}
  else if(a==='seguir'){const n=($('#nom').value||'').trim();const t=n?ls.get(claveP(n)):null;if(t)cargaPartida(t);else{G.msg=['No hay ninguna partida guardada con ese nombre en este navegador. Puedes cargarla desde un archivo.','mal'];G.nombre=n;pinta()}}
  else if(a==='cargar')$('#fpar').click();
  else if(a==='gguarda')guardaArchivo();
  else if(a==='lam'){G.lam=+v;G.vb=null;pintaVisor()}
  else if(a==='zoom'){if(+v===0){G.vb=null;aplicaVb()}else zoom(+v)}
  else if(a==='herr'){G.herr=v;pinta()}
  else if(a==='verz')irZona(+v);
  else if(a==='pista')pista(+G.fase[1],v);
  else if(a==='comprobar')comprobar(+G.fase[1]);
  else if(a==='entregar')entregar(+G.fase[1]);
  else if(a==='autofill'&&REV)autofill(+G.fase[1]);
  else if(a==='desc')descargar();
  else if(a==='otra'){const n=G.nombre;G=nuevo();G.nombre=n;pinta()}
  else if(a==='prof'){G=nuevo();G.fase='prof';REV=false;pinta()}
  else if(a==='pfent')pfEntra();
  else if(!PFOK)return;
  else if(a==='pftab'){PFT=v;pinta()}
  else if(a==='pfsal'){PFOK=false;ls.del('prof-'+JUEGO);pinta()}
  else if(a==='compC'){G.prof={n:$('#pn').value,c:$('#pc').value};G.prof.r=await compCert(G.prof.n,G.prof.c);pinta()}
  else if(a==='simver'||a==='simrnd'){let n=$('#sn').value.trim()||'Alumno de prueba',s=+$('#ss').value;if(a==='simrnd'||!s)s=1+Math.floor(Math.random()*999998);G.sim={n,s:String(s),C:caso(n,s,centro())};pinta()}
  else if(a==='simir'){const S=G.sim;REV=true;const keep=G.sim;empieza(S.n,+S.s,0);G.sim=keep;const k=+v;for(let i=1;i<k;i++){autofill(i);G.f[i].nota=notaFase(NITEMS(i).length,aciertos(i),0,0);G.f[i].hecha=true}G.fase='f'+k;G.msg=null;pinta()}
  else if(a==='copcat'){try{await navigator.clipboard.writeText(JSON.stringify(CATALOGO_DB,null,1));el.textContent='Copiado'}catch(_){toast('No se ha podido copiar.')}}
  else if(a==='pfcen'){PFC=($('#pfc').value||'').replace(/[<>&"'`]/g,'').replace(/\s+/g,' ').trim();pinta()}
  else if(a==='pfcop'){try{await navigator.clipboard.writeText(PFURL+'?centro='+encodeURIComponent(PFC));el.textContent='Copiado'}catch(_){}}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='calcE'){G.calc.e=t.value;$('#calcR').textContent=calcVal(t.value);return}
  if(!t.dataset||!t.dataset.k)return;const k=+t.dataset.k,F=G.f[k],id=t.dataset.id;
  if(k===2)F.resp[id]=t.value;else{F.resp[id]=F.resp[id]||{};F.resp[id][t.dataset.c]=t.value}
  if(F.ok[id]!==undefined){F.ok[id]=undefined;const it=t.closest('.item');if(it)it.classList.remove('ok','mal')}
  if(k===1&&t.dataset.c==='fam'){F.resp[id].tipo=null;pinta()}else autoGuarda()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.k==='1'&&t.dataset.c==='tipo'){G.f[1].resp[t.dataset.id].tipo=t.value===''?null:+t.value;autoGuarda()}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;if(t.id==='calcE'){const r=calcVal(t.value);if(r&&r!=='…'){G.calc.h.push(t.value+' '+r);G.calc.e='';pinta()}}if(t.id==='pfk')pfEntra();if(t.id==='nom'){const b=$('[data-a="empezar"]');if(b)b.click()}});
$('#fpar').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)cargaPartida(await f.text())});
document.addEventListener('focusin',e=>{const it=e.target.closest&&e.target.closest('.item[data-id^="z"]');if(it&&G.fase==='f1'){const z=G.C.f1.find(z=>z.id===it.dataset.id);if(z&&G.zAct!==z.id){G.zAct=z.id;if(G.lam!==z.lam-1){G.lam=z.lam-1;G.vb=null;pintaVisor()}else marcasZonas();$$('.item').forEach(x=>x.classList.toggle('act',x.dataset.id===z.id))}}});
G=nuevo();pinta();
function vistaProfesor(){if(location.hash==='#profesor'&&(G.fase==='inicio'||G.fase==='prof')){G.fase='prof';pinta()}}
addEventListener('hashchange',vistaProfesor);vistaProfesor();

</script>
</body>
