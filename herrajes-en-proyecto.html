<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herrajes en proyecto</title>
<meta name="description" content="Juego didáctico de selección de herrajes: lectura de planos, cálculo y hoja de pedido con el catálogo de Häfele. Gustavo Hernández Sánchez · IES Virgen de la Esperanza · CC BY-NC 4.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Oficina técnica: grafito, azul plano y acento cobre sobre papel claro de estudio */
:root{--gr:#1e293b;--gr2:#334155;--gr3:#64748b;--az:#0284c7;--az2:#e0f2fe;--co:#b8692e;--co2:#fbeee3;--fo:#eef1f4;--pa:#ffffff;--li:#cbd5e1;--ok:#15803d;--ok2:#dcfce7;--ma:#b91c1c;--ma2:#fee2e2;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"Barlow","Segoe UI",system-ui,sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--fo);color:var(--gr);font:15px/1.45 var(--f-b);padding:8px 16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--az);outline-offset:1px}
a{color:var(--az)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:4px 0 8px;border-bottom:2px solid var(--gr)}
h1{margin:0;font:700 26px/1 var(--f-d);letter-spacing:.01em}
h1 small{font:500 14px var(--f-b);color:var(--gr3);margin-left:8px}
#etapas{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto}
#etapas span{padding:3px 10px;font:600 15px var(--f-d);letter-spacing:.03em;color:var(--gr3);white-space:nowrap;border-bottom:3px solid var(--li)}
#etapas span.ya{color:var(--gr);border-color:var(--co)}#etapas span.hecho{color:var(--ok);border-color:var(--ok)}
.nota{display:flex;align-items:baseline;gap:6px;color:var(--gr3);font-size:13px}.nota b{font:600 20px var(--f-m);color:var(--gr)}
#app{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:10px;height:calc(100vh - 64px);padding-top:8px}
#app.ancho{grid-template-columns:minmax(0,1fr);height:auto}#app.ancho #visor{display:none}
#visor{background:var(--pa);border:1px solid var(--li);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border-bottom:1px solid var(--li);background:#f8fafc}
#tabs button{border:1px solid var(--li);background:#fff;padding:3px 10px;font:600 15px var(--f-d);letter-spacing:.02em;border-radius:4px}
#tabs button.si{background:var(--gr);color:#fff;border-color:var(--gr)}
#tabs .zoom{margin-left:auto;display:flex;gap:4px}#tabs .zoom button{min-width:34px}
#hoja{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#9aa4ae;cursor:grab;touch-action:none;padding:4px}
#hoja svg{width:100%;height:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#hoja circle[data-z]{cursor:pointer}
#der{background:var(--pa);border:1px solid var(--li);overflow:auto;padding:12px 16px;min-height:0}
h2{font:700 22px/1.1 var(--f-d);margin:2px 0 8px}
h3{font:700 17px var(--f-d);margin:14px 0 6px;color:var(--co);letter-spacing:.02em}
.ins{margin:4px 0 10px}.ayu{color:var(--gr3);font-size:13px}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pri,.sec,.ter{border-radius:6px;padding:8px 14px;font-weight:600;border:1px solid var(--gr)}
.pri{background:var(--gr);color:#fff}.pri:hover{background:var(--gr2)}
.sec{background:#fff}.sec:hover{background:#f1f5f9}
.ter{background:var(--co);border-color:var(--co);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input.txt,select.sel,input.num{border:1px solid var(--li);border-radius:5px;padding:6px 8px;background:#fff;min-width:0}
input.num{width:96px;font-family:var(--f-m);text-align:right}
input.ref{width:130px;font-family:var(--f-m)}
.item{border:1px solid var(--li);border-left:5px solid var(--li);border-radius:6px;padding:8px 10px;margin:8px 0;background:#fff}
.item.ok{border-left-color:var(--ok);background:#f7fdf9}.item.mal{border-left-color:var(--ma);background:#fff8f8}.item.act{box-shadow:0 0 0 2px var(--az2)}
.item .cab{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.item .n{font:600 14px var(--f-m);color:var(--co)}
.item .tt{font-weight:600}
.item .desc{font-size:14px;color:var(--gr2);margin:3px 0 6px}
.pista{font-size:13px;background:var(--co2);border:1px solid #f1c9a6;border-radius:5px;padding:5px 8px;margin-top:6px}
.bpis{border:1px solid var(--co);color:var(--co);background:#fff;border-radius:5px;padding:2px 8px;font-size:13px;white-space:nowrap}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px}.msg.bien{background:var(--ok2);color:#14532d}.msg.mal{background:var(--ma2);color:#7f1d1d}.msg.info{background:var(--az2);color:#0c4a6e}
.barra{position:sticky;bottom:-12px;background:linear-gradient(transparent,#fff 30%);padding:14px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.herr{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.herr button{border:1px solid var(--li);background:#f8fafc;border-radius:5px;padding:4px 10px;font:600 14px var(--f-d);letter-spacing:.02em}
.herr button.si{background:var(--az);color:#fff;border-color:var(--az)}
.caja{border:1px solid var(--li);border-radius:6px;padding:8px 10px;margin:0 0 10px;background:#f8fafc}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--li);padding:4px 6px;text-align:left;vertical-align:top}th{background:#f1f5f9;font-weight:600}td.n,th.n{text-align:right;font-family:var(--f-m)}
.mono{font-family:var(--f-m)}
.calc input{width:100%;font-family:var(--f-m)}.calc .res{font:600 18px var(--f-m);margin-top:4px}.calc .hist{font:13px var(--f-m);color:var(--gr3);max-height:90px;overflow:auto}
.encargo{border-left:4px solid var(--co);padding-left:10px;margin:6px 0 10px}
.aviso{border:2px solid var(--co);background:var(--co2);border-radius:8px;padding:10px 14px;margin:0 0 12px}
.lineas .item{padding:8px}
.lineas .campos{display:grid;grid-template-columns:auto auto auto auto;gap:6px 8px;align-items:center;justify-content:start}
.lineas label{font-size:12px;color:var(--gr3);display:block}
.grupo{font:700 18px var(--f-d);margin:14px 0 2px;border-bottom:2px solid var(--gr)}
#cert img{width:100%;border:1px solid var(--li);margin:8px 0;display:block}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);max-width:90vw;background:var(--gr);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.pie{color:var(--gr3);font-size:12px;margin-top:16px;border-top:1px solid var(--li);padding-top:6px}
@media (max-width:900px){#app{grid-template-columns:1fr;height:auto}#visor{height:70vh}.lineas .campos{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>Herrajes en proyecto<small>Autor: Gustavo Hernández Sánchez</small></h1><div id="etapas"></div><div class="nota" id="notaCab" hidden>Nota de la fase <b id="nota">10,00</b></div></header>
<div id="app"><section id="visor"><div id="tabs"></div><div id="hoja"></div></section><section id="der"></section></div>
<input type="file" id="fpar" accept=".txt,text/plain" hidden>

/* reparte un rectángulo de frente (x,y,w,h) del alzado en n puertas o cajones */
function frentes(rect,n,dir,juego){const L=[];for(let i=0;i<n;i++){if(dir==='h'){const w=(rect.w-(n+1)*juego)/n;L.push({x:rect.x+juego+i*(w+juego),y:rect.y+juego,w,h:rect.h-2*juego})}else{const h=(rect.h-(n+1)*juego)/n;L.push({x:rect.x+juego,y:rect.y+juego+i*(h+juego),w:rect.w-2*juego,h})}}return L}
/* superpuesta: el frente tapa el casco; juego g entre frentes (g/2 en cada borde) */
function frSup(m,n,dir,g,y0,h){const r={x:m.x,y:m.y+(y0||0),w:m.w,h:h||m.h};return frentes({x:r.x-g/2,y:r.y-g/2,w:r.w+g,h:r.h+g},n,dir,g)}
/* interior: el frente entra en el hueco del casco con holgura F */
function frInt(m,n,dir,F,E,y0,h){const r={x:m.x+E,y:m.y+E+(y0||0),w:m.w-2*E,h:(h||m.h)-2*E};return frentes(r,n,dir,F)}

    linea(L,{g:'mob',fam:9,ids,cant:eq[k],ud:'ud',tit:a.nombre.split(',')[0],desc,calc:`${eq[k]} (uno por hueco)${ids.length>1?`; ${w} mm entra en ${ids.map(x=>`${art(x).parametros_tecnicos.min}–${art(x).parametros_tecnicos.max}`).join(' y en ')}: vale cualquiera`:''}.`})}

/* amortiguadores (cocina superpuesta normal): Smove en el costado opuesto a las bisagras si la puerta cierra sola contra un costado y mide 450–600 mm de ancho

/* Minifix: 2 por encuentro de techo o suelo con un costado, y 1 más si el fondo pasa de 500 mm (criterio de taller; Häfele no da cuántas) */

/* alzado interior: devuelve los puntos de anclaje de las zonas */

function marcasZonas(){if(G.fase!=='f1')return;const F=G.f[1];$$('#hoja circle[data-z]').forEach(c=>{const z=G.C.f1.find(z=>String(z.n)===c.dataset.z);c.classList.remove('ok','mal','act');if(!z)return;if(F.ok[z.id]===true)c.classList.add('ok');else if(F.ok[z.id]===false)c.classList.add('mal');if(G.zAct===z.id)c.classList.add('act')})}
(()=>{const h=$('#hoja');let arr=null;h.addEventListener('wheel',e=>{e.preventDefault();const r=h.getBoundingClientRect();zoom(e.deltaY<0?1:-1,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
  h.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('circle[data-z]');if(c){irZona(+c.dataset.z);return}if(G.vb){arr=[e.clientX,e.clientY];h.setPointerCapture(e.pointerId)}});
  h.addEventListener('pointermove',e=>{if(!arr||!G.vb)return;const r=h.getBoundingClientRect(),v=G.vb,s=Math.max(v[2]/r.width,v[3]/r.height);v[0]=Math.max(0,Math.min(PH-v[2],v[0]-(e.clientX-arr[0])*s));v[1]=Math.max(0,Math.min(PV-v[3],v[1]-(e.clientY-arr[1])*s));arr=[e.clientX,e.clientY];aplicaVb()});
  h.addEventListener('pointerup',()=>arr=null)})();
function irZona(n){const z=G.C.f1.find(z=>z.n===n);if(!z||G.fase!=='f1')return;G.zAct=z.id;if(G.lam!==z.lam-1){G.lam=z.lam-1;G.vb=null;pintaVisor()}else marcasZonas();$$('.item').forEach(e=>e.classList.toggle('act',e.dataset.id===z.id));const el=$(`.item[data-id="${z.id}"]`);if(el)el.scrollIntoView({block:'center',behavior:'smooth'})}

/* --- herramientas del panel: encargo, materiales, calculadora, catálogos --- */
function herramientas(){const t=G.herr,b=(k,n)=>`<button class="${t===k?'si':''}" data-a="herr" data-v="${k}">${n}</button>`;
  return `<div class="herr">${b('enc','Encargo')}${b('mat','Materiales y densidades')}${b('calc','Calculadora')}${b('cat','Catálogos')}${b('no','Ocultar')}</div>${t==='no'?'':`<div class="caja">${t==='enc'?hEnc():t==='mat'?hMat():t==='calc'?hCalcu():hCat()}</div>`}`}
function hEnc(){const M=G.C.mob;return `<b>${TIPO_MOB[M.tipo]}</b> · estilo ${M.estilo.toLowerCase()} · calidad ${M.calidad.toLowerCase()}${M.Z?` · zócalo de ${M.Z} mm`:''}${M.push?' · frentes sin tirador (apertura por presión)':''}${M.pesado?`<br><b>Nota del cliente:</b> en el cajón ${M.pesado.et} (señalado en la lámina ${M.pesado.lam}) guardará ${M.pesado.txt}.`:''}<br><span class="ayu">Medidas siempre Alto × Ancho (× Espesor), en mm.</span>`}
function hMat(){return `<table><tr><th>Componente</th><th>Material</th><th class="n">e (mm)</th><th class="n">kg/m³</th></tr>${G.C.mats.map(m=>`<tr><td>${m.comp}</td><td>${m.mat}</td><td class="n">${m.e}</td><td class="n">${m.dens}</td></tr>`).join('')}</table><p class="ayu">Peso (kg) = Alto (m) × Ancho (m) × Espesor (m) × Densidad (kg/m³)</p>`}
function hCalcu(){const c=G.calc;return `<div class="calc"><input id="calcE" placeholder="Ej.: 2,03 × 0,725 × 0,04 × 420" value="${esc(c.e)}"><div class="res" id="calcR">${calcVal(c.e)}</div><div class="hist">${c.h.slice(-6).reverse().map(x=>esc(x)).join('<br>')}</div><p class="ayu">Admite + − × ÷ ( ) y coma decimal. Intro guarda la operación.</p></div>`}
function calcVal(e){if(!e.trim())return '';try{const t=e.replace(/×|x|X|\*/g,'*').replace(/÷|:/g,'/').replace(/−/g,'-').replace(/(\d),(\d)/g,'$1.$2');if(!/^[\d.+\-*/()\s]+$/.test(t))return '…';const v=Function('return ('+t+')')();return isFinite(v)?'= '+String(Math.round(v*10000)/10000).replace('.',','):'…'}catch(_){return '…'}}
function hCat(){return `<p style="margin:0">Häfele: <a href="https://www.hafele.es/es/" target="_blank" rel="noopener">hafele.es</a> · buscar por Nº de artículo o nombre: <a href="${CATALOGO_DB.proveedores['Häfele'].buscar}bisagra" target="_blank" rel="noopener">buscador</a></p><p class="ayu">Vocabulario: puerta superpuesta = montaje angular (bisagra recta); a media = montaje intermedio (acodada); interior = montaje enrasado (superacodada); base = placa de montaje. Letras de Häfele en las bisagras: E = cazoleta → canto de la puerta; D = distancia de la base; G = solape sobre el costado; F = junta u holgura; e = grueso del costado.</p>`}

/* --- una fase --- */
function pFase(k){const F=G.f[k],L=NITEMS(k);const nota=notaDe(k);
  const intro={1:`<p class="ins">Pulsa cada número de las láminas (o de la lista) y di qué <b>familia</b> y qué <b>tipo</b> de herraje resuelve esa zona. Usa el zoom y el arrastre para leer los detalles.</p>`,
    2:`<p class="ins">Resuelve los cálculos con los datos de las láminas y del cuadro de materiales. Escribe solo el número, con coma decimal si hace falta.</p>`,
    3:`<p class="ins">Busca cada línea en <a href="https://www.hafele.es/es/" target="_blank" rel="noopener">hafele.es</a> y escribe el Nº de artículo exacto, la cantidad total y la unidad. <b>Si la ficha técnica da un criterio distinto de la regla general, manda la ficha.</b></p>`}[k];
  let h=`<h2>Fase ${k} · ${NFASE[k]} <span class="ayu">(${L.length} ${k===3?'líneas':'preguntas'} · ${Math.round(PESO[k]*100)} %)</span></h2>${REV?'<div class="msg info">Revisión del profesor: no se guarda ni cuenta como intento. <button class="sec" data-a="autofill">Autocompletar fase para revisión</button></div>':''}${intro}${herramientas()}${msg()}`;
  if(k===1)h+=L.map(z=>itemZona(z,F)).join('');
  if(k===2)h+=L.map(p=>itemProb(p,F)).join('');
  if(k===3){h+='<div class="lineas">';let g0='';L.forEach(l=>{if(l.g!==g0){g0=l.g;h+=`<div class="grupo">Mobiliario · ${TIPO_MOB[G.C.mob.tipo]}</div>`}h+=itemLinea(l,F)});h+='</div>'}
  const ac=aciertos(k);
  h+=`<div class="barra"><button class="sec" data-a="comprobar">Comprobar</button><button class="pri" data-a="entregar">Entregar fase ${k} y seguir</button><span class="ayu">Nota provisional ${coma(nota)} · comprobaciones con fallos: ${F.comp} · pistas: ${Object.keys(F.pistas).length}</span></div>`;
  if(!REV)h+=`<div class="aviso" style="margin-top:12px"><b>La partida se guarda sola en este ordenador.</b> ¿Vas a seguir en otro? <button class="ter" data-a="gguarda">Guardar en un archivo</button></div>`;
  return h}
const est=(F,id)=>F.ok[id]===true?' ok':F.ok[id]===false?' mal':'';
function pistaHtml(F,id,txt){return F.pistas[id]?`<div class="pista">💡 ${txt}</div>`:''}
function itemZona(z,F){const v=F.resp[z.id]||{};const fams=Object.keys(FAM).map(n=>`<option value="${n}" ${+v.fam===+n?'selected':''}>${n} · ${FAM[n]}</option>`).join('');
  const tipos=v.fam?TIPOS[v.fam].map((t,i)=>`<option value="${i}" ${v.tipo!=null&&+v.tipo===i?'selected':''}>${t}</option>`).join(''):'';
  return `<div class="item${est(F,z.id)}${G.zAct===z.id?' act':''}" data-id="${z.id}"><div class="cab"><span><span class="n">Zona ${z.n}</span> · <span class="tt">${z.txt}</span> <span class="ayu">(lámina ${z.lam})</span></span><span><button class="sec" style="padding:2px 8px" data-a="verz" data-v="${z.n}">Ver</button> <button class="bpis" data-a="pista" data-v="${z.id}" ${F.pistas[z.id]?'disabled':''}>Pista −0,35</button></span></div>
  <div class="fila" style="margin-top:6px"><select class="sel" data-k="1" data-id="${z.id}" data-c="fam" style="max-width:48%"><option value="">Familia…</option>${fams}</select><select class="sel" data-k="1" data-id="${z.id}" data-c="tipo" style="max-width:50%" ${v.fam?'':'disabled'}><option value="">Tipo…</option>${tipos}</select></div>${pistaHtml(F,z.id,`Familia ${z.fam} (${FAM[z.fam]}). ${z.fam===2?`Mira en el detalle ${G.C.mob.mont==='media'&&z.tipo===0?'B':'A'} de la lámina 3 dónde queda la puerta respecto al costado.`:''}`)}</div>`}
function itemProb(p,F){const v=F.resp[p.id];const inp=p.t==='sel'?`<select class="sel" data-k="2" data-id="${p.id}"><option value="">Elige…</option>${p.ops.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="num" data-k="2" data-id="${p.id}" inputmode="decimal" value="${esc(v??'')}"> <span class="mono">${p.ud}</span>`;
  return `<div class="item${est(F,p.id)}" data-id="${p.id}"><div class="cab"><span><span class="n">${p.id.slice(1)}.</span> ${p.txt} <span class="ayu">(lámina ${p.lam})</span></span><button class="bpis" data-a="pista" data-v="${p.id}" ${F.pistas[p.id]?'disabled':''}>Pista −0,35</button></div><div class="fila" style="margin-top:6px">${inp}</div>${pistaHtml(F,p.id,p.pista)}</div>`}
function itemLinea(l,F){const id='l'+l.n,v=F.resp[id]||{};const sel=(c,ops)=>`<select class="sel" data-k="3" data-id="${id}" data-c="${c}"><option value="">—</option>${ops.map(o=>`<option ${v[c]===o?'selected':''}>${o}</option>`).join('')}</select>`;
  return `<div class="item${est(F,id)}" data-id="${id}"><div class="cab"><span><span class="n">${l.n}.</span> <span class="tt">${l.tit}</span> <span class="ayu">· familia ${l.fam}</span></span><button class="bpis" data-a="pista" data-v="${id}" ${F.pistas[id]?'disabled':''}>Pista −0,35</button></div><div class="desc">${l.desc}</div>

  ${pistaHtml(F,id,`Busca: «${art(l.ids[0]).nombre.replace(/,? ?(izquierda|derecha)$/,'')}» en ${l.prov}. ${l.calc}`)}</div>`}

/* --- comprobar y entregar --- */
function respStr(v){return JSON.stringify(v??'')}
function comprobar(k){const F=G.f[k],L=NITEMS(k);let nuevos=0,mal=0,vacios=0;
  L.forEach(it=>{const id=idOf(k,it),v=F.resp[id];const lleno=v!=null&&v!==''&&!(typeof v==='object'&&!Object.values(v).some(x=>x!==''&&x!=null));if(!lleno){vacios++;F.ok[id]=undefined;return}
    const ok=okItem(k,it,v);F.ok[id]=ok;if(!ok){mal++;const s=respStr(v);if(F.pen[id]!==s){F.pen[id]=s;nuevos++}}});
  if(nuevos){F.err+=nuevos;F.comp++}
  G.msg=mal?[`${L.length-mal-vacios} correctas, ${mal} con fallo${vacios?` y ${vacios} sin responder`:''}. ${nuevos?`${nuevos>1?`Restan ${nuevos} fallos nuevos`:`Resta 1 fallo nuevo`}.`:'Esos fallos ya estaban contados: corrígelos antes de volver a comprobar.'}`,'mal']:[vacios?`Todo lo respondido es correcto. Faltan ${vacios}.`:'¡Todo correcto! Ya puedes entregar la fase.','bien'];
  pinta()}
function entregar(k){const F=G.f[k],L=NITEMS(k),ac=aciertos(k);if(ac<L.length&&!confirm(`Tienes ${ac} de ${L.length} correctas. Lo que no esté bien contará como fallo. ¿Entregas la fase ${k}?`))return;
  L.forEach(it=>{const id=idOf(k,it);F.ok[id]=okItem(k,it,F.resp[id])});F.nota=notaFase(L.length,ac,F.err,Object.keys(F.pistas).length);F.hecha=true;G.msg=null;
  if(k<3){G.fase='f'+(k+1);G.lam=k===1?0:0;G.vb=null;G.herr='enc';pinta();$('#der').scrollTop=0}else{G.fase='fin';pinta();emitir()}}
function pista(k,id){const F=G.f[k];if(F.pistas[id])return;if(!confirm('La pista resta 0,35 puntos en la nota de esta fase. ¿La quieres?'))return;F.pistas[id]=1;pinta()}
function autofill(k){const F=G.f[k];NITEMS(k).forEach(it=>{const id=idOf(k,it);F.resp[id]=k===1?{fam:it.fam,tipo:it.tipo}:k===2?(it.t==='sel'?it.sol:n1(it.sol)):{prov:it.prov,ref:it.refs[0],cant:String(it.cant),ud:it.ud}});G.msg=['Fase autocompletada con la solución (revisión).','info'];pinta()}

async function partidaTxt(){const o={v:1,n:G.nombre,s:G.sem,z:G.vez,c:centro(),fa:G.fase,f:G.f,el:Date.now()-G.t0},j=JSON.stringify(o);return b64(j)+'.'+(await sha(SECRETO+'|partida|'+normal(o.n)+'|'+j)).slice(0,16)}
let tAuto=0;function autoGuarda(){if(REV||!G||!G.nombre||!G.C)return;clearTimeout(tAuto);tAuto=setTimeout(async()=>{if(['f1','f2','f3'].includes(G.fase))ls.set(claveP(G.nombre),await partidaTxt());else if(G.fase==='fin')ls.del(claveP(G.nombre))},300)}
async function guardaArchivo(){const t=await partidaTxt(),nom='Partida_herrajes_'+normal(G.nombre).toLowerCase().replace(/ /g,'_')+'.txt',blob=new Blob([t],{type:'text/plain'}),dl=await dlP;
  try{if(dl)await dl.save({filename:nom,data:blob});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;a.click()}toast('Partida guardada en '+nom+'. Llévate el archivo para seguir en otro ordenador.')}catch(e){}}
async function cargaPartida(txt){try{const [b,fi]=txt.trim().split('.'),j=d64(b),o=JSON.parse(j);if((await sha(SECRETO+'|partida|'+normal(o.n)+'|'+j)).slice(0,16)!==fi)throw 0;
    REV=false;empieza(o.n,o.s,o.z);G.f=o.f;G.fase=o.fa;G.t0=Date.now()-o.el;pinta();toast('Partida recuperada.');return true}
  catch(e){G=nuevo();G.msg=['Eso no es una partida válida de este juego.','mal'];pinta();return false}}

let PFOK=false,PFT='guia',PFMAL=false,PFC='';try{PFOK=ls.get('prof-'+JUEGO)===PFH}catch(e){}

async function compCert(n,c){const m=/^(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d{12})-([0-9A-F]{8})$/.exec(String(c).trim().toUpperCase());if(!m||!n.trim())return {ok:false};
  if(await firma(n,m.slice(1,11).join('-'))!==m[11])return {ok:false};const v=i=>coma(m[i]/100);
  return {ok:true,nota:v(1),n1:v(2),n2:v(3),n3:v(4),err:m[5],pis:m[6],sem:m[7],vez:m[8],min:m[9]+' min',f:`${m[10].slice(6,8)}/${m[10].slice(4,6)}/${m[10].slice(0,4)} ${m[10].slice(8,10)}:${m[10].slice(10)}h`,apto:esApto(m[1]/100,m[4]/100)}}
function pProf(){if(!PFOK)return `<h2>Acceso del profesorado</h2><p class="ins">Escriba la clave que le ha facilitado el autor.</p><div class="fila"><input class="txt" id="pfk" type="password" autocomplete="off" style="flex:1"><button class="pri" data-a="pfent">Entrar</button></div>${PFMAL?'<div class="msg mal">La clave no es correcta.</div>':''}`;
  const tb=(v,t)=>`<button class="${PFT===v?'pri':'sec'}" data-a="pftab" data-v="${v}" style="padding:5px 10px">${t}</button>`;
  return `<h2>Página del profesorado</h2><div class="fila" style="margin:0 0 12px">${tb('guia','Guía')}${tb('cert','Comprobar certificados')}${tb('sim','Revisar y simular')}${tb('cat','Catálogo y vigencia')}${tb('cen','Mi centro')}<button class="sec" data-a="pfsal" style="margin-left:auto;padding:5px 10px">Cerrar sesión</button></div>
  ${PFT==='cert'?pCert():PFT==='sim'?pSim():PFT==='cat'?pCat():PFT==='cen'?pCentro():pGuia()}`}
function pGuia(){const cu=centro()?PFURL+'?centro='+encodeURIComponent(centro()):PFURL,li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  return `<div class="aviso"><b>Para el alumnado:</b> <span class="mono" style="word-break:break-all">${esc(cu)}</span><br><b>Para usted:</b> el mismo enlace terminado en <span class="mono">#profesor</span>, con la clave. No comparta ni lo uno ni lo otro con el alumnado.</div>
  <h3>Qué es</h3><p class="ins">Juego de una sola página para 1º CFGS de Diseño y Amueblamiento. Cada partida trae un encargo de mobiliario (cocina, armario, vestidor o salón modular) con estilo, calidad, medidas, grosores y densidades propios del alumno y del intento. Tres láminas: conjunto, interior sin frentes y detalles de herrajes. Sin instalación ni registro.</p>
  <h3>Fases y nota</h3>${li(['Fase 1 · Lectura de planos (20 %): 10–12 zonas marcadas en 3 láminas; familia y tipo de herraje.','Fase 2 · Cálculos (35 %): 8–10 problemas: bisagras con la notación de Häfele (constante C de la tabla de solapes, D calculada con G = C + E − D, base comercial igual o inmediatamente superior), pesos, carga de un cajón y su guía (calidad normal), número de bisagras, elevable Free por altura y peso, guías por longitud mínima de montaje, equipamiento por ancho interior, iluminación LED, recuentos con lo dibujado, Sistema 32.','Fase 3 · Hoja de pedido (45 %): Nº de artículo real de Häfele, cantidad y unidad por línea, con las piezas que van aparte.','Nota de fase = aciertos / N × 10 − 0,25 × 10 / N por cada fallo nuevo al comprobar − 0,35 por pista (mínimo 0).','Nota final = F1 × 0,20 + F2 × 0,35 + F3 × 0,45. APTO con 5 en la final y 5 en la fase 3.'])}
  <h3>Criterios de taller que aplica</h3>${li(['Bisagras de mueble: 2 hasta 900 mm de alto, 3 hasta 1600, 4 por encima; una base por bisagra.','Guías: 1 juego por cajón · Tiradores: 1 por puerta, cajón o frente · Portaestantes: 4 por balda móvil · Colgadores: 2 por mueble alto · Patas: 4 por módulo en el suelo (los clips de zócalo no se piden aparte) · Tornillos de unión: 2 por unión de bajos o altos, 4 entre cuerpos altos.','Elevables Free: 1 juego por frente (el Free flap H 1.5 ya es un juego de dos piezas); modelo por altura del mueble y peso del frente; si dos modelos lo admiten, el más fuerte.','Guías: 30 kg en calidad normal salvo el cajón con carga pesada del enunciado (50 kg); 50 kg en calidad alta.','Minifix (armario y vestidor): 2 por encuentro de techo o suelo con costado, 3 si el fondo pasa de 500 mm.','Barras: 1 por tramo y 2 soportes; soporte central si supera 1000 mm (roble) o 1300 mm (aluminio).','LED: barra con perfil + tira (rollos de 5 m) + transformador según potencia + 1 interruptor o sensor por mueble.','Si la ficha técnica da un criterio distinto de la regla general, manda la ficha.'])}
  <h3>Limitaciones</h3><p class="ins">No hay servidor: partidas e intentos se guardan en el navegador. El código del certificado detecta cambios en nombre y notas, pero el archivo es público: si cuenta para la evaluación, el certificado no debería ser la única prueba. Los catálogos cambian cada curso: revise la pestaña «Catálogo y vigencia» al empezar el curso.</p>
  <h3>Autoría</h3><p class="ins">© 2026 Gustavo Hernández Sánchez · I.E.S. Virgen de la Esperanza · Departamento de Madera. CC BY-NC 4.0.</p>`}
function pCert(){const P=G.prof||{n:'',c:'',r:null},r=P.r;let t='';

  else if(r)t='<div class="msg mal">El código no corresponde a ese nombre o está mal copiado.</div>';
  return `<p class="ins">Copie el nombre tal como aparece en el certificado y su código.</p><label class="ayu">Nombre y apellidos</label><input class="txt" id="pn" style="width:100%" value="${esc(P.n)}"><label class="ayu">Código</label><input class="txt mono" id="pc" style="width:100%" value="${esc(P.c)}"><div class="fila" style="margin-top:8px"><button class="pri" data-a="compC">Comprobar</button></div>${t}`}

  else if(a==='zoom'){if(+v===0){G.vb=null;aplicaVb()}else zoom(+v)}

  else if(a==='pfsal'){PFOK=false;ls.del('prof-'+JUEGO);pinta()}
  else if(a==='compC'){G.prof={n:$('#pn').value,c:$('#pc').value};G.prof.r=await compCert(G.prof.n,G.prof.c);pinta()}
  else if(a==='simver'||a==='simrnd'){let n=$('#sn').value.trim()||'Alumno de prueba',s=+$('#ss').value;if(a==='simrnd'||!s)s=1+Math.floor(Math.random()*999998);G.sim={n,s:String(s),C:caso(n,s,centro())};pinta()}
  else if(a==='simir'){const S=G.sim;REV=true;const keep=G.sim;empieza(S.n,+S.s,0);G.sim=keep;const k=+v;for(let i=1;i<k;i++){autofill(i);G.f[i].nota=notaFase(NITEMS(i).length,aciertos(i),0,0);G.f[i].hecha=true}G.fase='f'+k;G.msg=null;pinta()}
  else if(a==='copcat'){try{await navigator.clipboard.writeText(JSON.stringify(CATALOGO_DB,null,1));el.textContent='Copiado'}catch(_){toast('No se ha podido copiar.')}}
  else if(a==='pfcen'){PFC=($('#pfc').value||'').replace(/[<>&"'`]/g,'').replace(/\s+/g,' ').trim();pinta()}
  else if(a==='pfcop'){try{await navigator.clipboard.writeText(PFURL+'?centro='+encodeURIComponent(PFC));el.textContent='Copiado'}catch(_){}}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='calcE'){G.calc.e=t.value;$('#calcR').textContent=calcVal(t.value);return}
  if(!t.dataset||!t.dataset.k)return;const k=+t.dataset.k,F=G.f[k],id=t.dataset.id;
  if(k===2)F.resp[id]=t.value;else{F.resp[id]=F.resp[id]||{};F.resp[id][t.dataset.c]=t.value}
  if(F.ok[id]!==undefined){F.ok[id]=undefined;const it=t.closest('.item');if(it)it.classList.remove('ok','mal')}
  if(k===1&&t.dataset.c==='fam'){F.resp[id].tipo=null;pinta()}else autoGuarda()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.k==='1'&&t.dataset.c==='tipo'){G.f[1].resp[t.dataset.id].tipo=t.value===''?null:+t.value;autoGuarda()}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;if(t.id==='calcE'){const r=calcVal(t.value);if(r&&r!=='…'){G.calc.h.push(t.value+' '+r);G.calc.e='';pinta()}}if(t.id==='pfk')pfEntra();if(t.id==='nom'){const b=$('[data-a="empezar"]');if(b)b.click()}});
$('#fpar').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)cargaPartida(await f.text())});
document.addEventListener('focusin',e=>{const it=e.target.closest&&e.target.closest('.item[data-id^="z"]');if(it&&G.fase==='f1'){const z=G.C.f1.find(z=>z.id===it.dataset.id);if(z&&G.zAct!==z.id){G.zAct=z.id;if(G.lam!==z.lam-1){G.lam=z.lam-1;G.vb=null;pintaVisor()}else marcasZonas();$$('.item').forEach(x=>x.classList.toggle('act',x.dataset.id===z.id))}}});
G=nuevo();pinta();
function vistaProfesor(){if(location.hash==='#profesor'&&(G.fase==='inicio'||G.fase==='prof')){G.fase='prof';pinta()}}
addEventListener('hashchange',vistaProfesor);vistaProfesor();

</script>
