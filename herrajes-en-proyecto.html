<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herrajes en proyecto</title>
<meta name="description" content="Juego didáctico de selección de herrajes: a partir de los planos de un mueble, buscar en el catálogo en PDF de Häfele el Nº de artículo, la cantidad y la unidad de cada herraje. Gustavo Hernández Sánchez · IES Virgen de la Esperanza · CC BY-NC 4.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Oficina técnica: grafito, azul plano y acento cobre sobre papel claro de estudio */
:root{--gr:#1e293b;--gr2:#334155;--gr3:#64748b;--az:#0284c7;--az2:#e0f2fe;--co:#b8692e;--co2:#fbeee3;--fo:#eef1f4;--pa:#ffffff;--li:#cbd5e1;--ok:#15803d;--ok2:#dcfce7;--ma:#b91c1c;--ma2:#fee2e2;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif;--f-b:"Barlow","Segoe UI",system-ui,sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--fo);color:var(--gr);font:15px/1.45 var(--f-b);padding:8px 16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--az);outline-offset:1px}
a{color:var(--az)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:4px 0 8px;border-bottom:2px solid var(--gr)}
h1{margin:0;font:700 26px/1 var(--f-d);letter-spacing:.01em}
h1 small{font:500 14px var(--f-b);color:var(--gr3);margin-left:8px}
#etapas{display:flex;gap:4px;flex:1 1 auto;min-width:0;overflow-x:auto}
#etapas span{padding:3px 10px;font:600 15px var(--f-d);letter-spacing:.03em;color:var(--gr3);white-space:nowrap;border-bottom:3px solid var(--li)}
#etapas span.ya{color:var(--gr);border-color:var(--co)}#etapas span.hecho{color:var(--ok);border-color:var(--ok)}
.nota{display:flex;align-items:baseline;gap:6px;color:var(--gr3);font-size:13px}.nota b{font:600 20px var(--f-m);color:var(--gr)}
#app{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:10px;height:calc(100vh - 64px);padding-top:8px}
#app.ancho{grid-template-columns:minmax(0,1fr);height:auto}#app.ancho #visor{display:none}
#visor{background:var(--pa);border:1px solid var(--li);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px;border-bottom:1px solid var(--li);background:#f8fafc}
#tabs button{border:1px solid var(--li);background:#fff;padding:3px 10px;font:600 15px var(--f-d);letter-spacing:.02em;border-radius:4px}
#tabs button.si{background:var(--gr);color:#fff;border-color:var(--gr)}
#tabs .zoom{margin-left:auto;display:flex;gap:4px}#tabs .zoom button{min-width:34px}
#hoja{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#9aa4ae;cursor:grab;touch-action:none;padding:4px}
#hoja svg{width:100%;height:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#hoja circle[data-z]{cursor:pointer}
#der{background:var(--pa);border:1px solid var(--li);overflow:auto;padding:12px 16px;min-height:0}
h2{font:700 22px/1.1 var(--f-d);margin:2px 0 8px}
h3{font:700 17px var(--f-d);margin:14px 0 6px;color:var(--co);letter-spacing:.02em}
.ins{margin:4px 0 10px}.ayu{color:var(--gr3);font-size:13px}
.fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pri,.sec,.ter{border-radius:6px;padding:8px 14px;font-weight:600;border:1px solid var(--gr)}
.pri{background:var(--gr);color:#fff}.pri:hover{background:var(--gr2)}
.sec{background:#fff}.sec:hover{background:#f1f5f9}
.ter{background:var(--co);border-color:var(--co);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input.txt,select.sel,input.num{border:1px solid var(--li);border-radius:5px;padding:6px 8px;background:#fff;min-width:0}
input.num{width:96px;font-family:var(--f-m);text-align:right}
input.ref{width:130px;font-family:var(--f-m)}
.item{border:1px solid var(--li);border-left:5px solid var(--li);border-radius:6px;padding:8px 10px;margin:8px 0;background:#fff}
.item.ok{border-left-color:var(--ok);background:#f7fdf9}.item.mal{border-left-color:var(--ma);background:#fff8f8}.item.act{box-shadow:0 0 0 2px var(--az2)}
.item .cab{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.item .n{font:600 14px var(--f-m);color:var(--co)}
.item .tt{font-weight:600}
.item .desc{font-size:14px;color:var(--gr2);margin:3px 0 6px}
.pista{font-size:13px;background:var(--co2);border:1px solid #f1c9a6;border-radius:5px;padding:5px 8px;margin-top:6px}
.bpis{border:1px solid var(--co);color:var(--co);background:#fff;border-radius:5px;padding:2px 8px;font-size:13px;white-space:nowrap}
.msg{padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px}.msg.bien{background:var(--ok2);color:#14532d}.msg.mal{background:var(--ma2);color:#7f1d1d}.msg.info{background:var(--az2);color:#0c4a6e}
.barra{position:sticky;bottom:-12px;background:linear-gradient(transparent,#fff 30%);padding:14px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.herr{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.herr button{border:1px solid var(--li);background:#f8fafc;border-radius:5px;padding:4px 10px;font:600 14px var(--f-d);letter-spacing:.02em}
.herr button.si{background:var(--az);color:#fff;border-color:var(--az)}
.caja{border:1px solid var(--li);border-radius:6px;padding:8px 10px;margin:0 0 10px;background:#f8fafc}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--li);padding:4px 6px;text-align:left;vertical-align:top}th{background:#f1f5f9;font-weight:600}td.n,th.n{text-align:right;font-family:var(--f-m)}
.mono{font-family:var(--f-m)}
.calc input{width:100%;font-family:var(--f-m)}.calc .res{font:600 18px var(--f-m);margin-top:4px}.calc .hist{font:13px var(--f-m);color:var(--gr3);max-height:90px;overflow:auto}
.encargo{border-left:4px solid var(--co);padding-left:10px;margin:6px 0 10px}
.aviso{border:2px solid var(--co);background:var(--co2);border-radius:8px;padding:10px 14px;margin:0 0 12px}
.lineas .item{padding:8px}
.lineas .campos{display:grid;grid-template-columns:auto auto auto auto;gap:6px 8px;align-items:center;justify-content:start}
.lineas label{font-size:12px;color:var(--gr3);display:block}
.grupo{font:700 18px var(--f-d);margin:14px 0 2px;border-bottom:2px solid var(--gr)}
#cert img{width:100%;border:1px solid var(--li);margin:8px 0;display:block}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);max-width:90vw;background:var(--gr);color:#fff;padding:10px 16px;border-radius:8px;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.pie{color:var(--gr3);font-size:12px;margin-top:16px;border-top:1px solid var(--li);padding-top:6px}
@media (max-width:900px){#app{grid-template-columns:1fr;height:auto}#visor{height:70vh}.lineas .campos{grid-template-columns:1fr 1fr}}
.campos input.cok,.campos select.cok{border-color:var(--ok);background:#f0fdf4}.campos input.cmal,.campos select.cmal{border-color:var(--ma);background:#fef2f2}
.lineas .campos label{display:block;font-size:12px;color:var(--gr2)}
.crit li{margin:2px 0}
</style>
</head>
<body>
<header><h1>Herrajes en proyecto<small>Autor: Gustavo Hernández Sánchez</small></h1><div id="etapas"></div><div class="nota" id="notaCab" hidden>Nota <b id="nota">10,00</b></div></header>
<div id="app"><section id="visor"><div id="tabs"></div><div id="hoja"></div></section><section id="der"></section></div>
<input type="file" id="fpar" accept=".txt,text/plain" hidden>

const normal=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase().replace(/\s+/g,' ');
function hashStr(n){let h=2166136261;for(const c of String(n)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
/* generador pseudoaleatorio determinista: misma cadena → misma secuencia */
function RNG(str){let h=hashStr(str)||1;const nx=()=>{h=Math.imul(h^h>>>15,2246822519)>>>0;h=Math.imul(h^h>>>13,3266489917)>>>0;h=(h^h>>>16)>>>0;return h};
  return {n:nx,el:L=>L[nx()%L.length],ra:(a,b,p=1)=>{const L=[];for(let v=a;v<=b+1e-9;v+=p)L.push(Math.round(v*10)/10);return L[nx()%L.length]},p:x=>nx()/4294967296<x,mezcla:L=>{const c=L.slice();for(let i=c.length-1;i>0;i--){const j=nx()%(i+1);[c[i],c[j]]=[c[j],c[i]]}return c}}}
const coma=(v,d=2)=>Number(v).toFixed(d).replace('.',',');
const n1=v=>{const r=Math.round(v*10)/10;return Number.isInteger(r)?String(r):String(r).replace('.',',')};

const num=s=>{const t=String(s||'').trim().replace(/\s/g,'').replace(',','.').replace(/^[−–]/,'-');return t===''||isNaN(+t)?NaN:+t};

/* ======================================================================
   MOTOR (versión 3): catálogo, generación del encargo, hoja de pedido y nota.
   Una sola fase: para cada herraje, Nº de artículo, cantidad y unidad,
   buscados en el catálogo en PDF de Häfele (International 2020).
   No usa el DOM: se puede cargar en Node para las simulaciones masivas.
   ====================================================================== */
const ART={};for(const a of CATALOGO_DB.articulos)ART[a.id]=a;
const art=id=>{const a=ART[id];if(!a)throw new Error('Artículo no está en CATALOGO_DB: '+id);return a};
const ARTS=f=>CATALOGO_DB.articulos.filter(f);
const REF=id=>art(id).ref;
const UNIDADES=['pieza','par','juego','metro','rollo'];

const ESTILOS=['Moderno','Rústico','Clásico','Industrial'],CALIDADES=['Normal','Alta'];
const MAT={mel:['Aglomerado melaminado',650],dml:['DM lacado',750],dmr:['DM rechapado de roble',760],con:['Contrachapado de abedul',680],
  ali:['Tablero alistonado de pino',500],pin:['Pino macizo',520],rob:['Roble macizo',720]};
const MONT={sup:{n:'puerta superpuesta',b:'bisagra recta',h:'montaje angular'},media:{n:'puerta a media',b:'bisagra acodada',h:'montaje intermedio/gemelo'},int:{n:'puerta interior',b:'bisagra superacodada',h:'montaje enrasado'}};

const FRENTE={Moderno:[['dml',19],['mel',19]],Industrial:[['con',18],['mel',19]],Rústico:[['pin',22],['rob',22]],Clásico:[['rob',22],['dmr',19]]};
function frentes(rect,n,dir,juego){const L=[];for(let i=0;i<n;i++){if(dir==='h'){const w=(rect.w-(n+1)*juego)/n;L.push({x:rect.x+juego+i*(w+juego),y:rect.y+juego,w,h:rect.h-2*juego})}else{const h=(rect.h-(n+1)*juego)/n;L.push({x:rect.x+juego,y:rect.y+juego+i*(h+juego),w:rect.w-2*juego,h})}}return L}
function frSup(m,n,dir,g,y0,h){const r={x:m.x,y:m.y+(y0||0),w:m.w,h:h||m.h};return frentes({x:r.x-g/2,y:r.y-g/2,w:r.w+g,h:r.h+g},n,dir,g)}
function frInt(m,n,dir,F,E,y0,h){const r={x:m.x+E,y:m.y+E+(y0||0),w:m.w-2*E,h:(h||m.h)-2*E};return frentes(r,n,dir,F)}
function mod(id,nombre,kind,x,y,w,h,d){return {id,nombre,kind,x,y,w,h,d,fr:[],baldas:0,equip:[]}}
function puertas(M,m,n,dir,y0,h,lado){
  const L=M.mont==='int'?frInt(m,n,dir,M.F,M.E,y0,h):frSup(m,n,dir,M.g,y0,h);
  L.forEach((f,i)=>{f.tipo='puerta';f.par=n>1;f.bis=n===1?(lado||'der'):(i===0?'izq':'der');m.fr.push(f)});return L}
function cajones(M,m,n,y0,h){const L=M.mont==='int'?frInt(m,n,'v',M.F,M.E,y0,h):frSup(m,n,'v',M.g||3,y0,h);L.forEach(f=>{f.tipo='cajon';m.fr.push(f)});return L}

  if(M.mont){
    M.K=r.el([3,4,5,6]);                 /* distancia de la cazoleta al canto de la puerta (solo para el dibujo) */
    if(M.mont==='sup')M.g=r.el([2,3,4]);else if(M.mont==='media'){M.J=r.el([2,3,4]);M.g=3}else{M.F=r.el([2,3]);M.g=M.F}
    M.D=r.el([0,2,3,6]);                 /* altura de la placa de montaje que da el plano de detalle */
    M.serie=calidad==='Alta'?'plus':'duo';
    M.esq=r.el(calidad==='Alta'?['45/9,5','48/6','52/5,5']:['48/6','52/5,5'])}
  ({cocina:genCocina,salon:genSalon,armario:genArmario,vestidor:genVestidor})[tipo](r,M);
  return M}

function genCocina(r,M){
  M.Z=r.el([100,110,130,150,160]);const Z=M.Z,hb=720,db=560,ha=r.el([720,900]),da=330,enc=40,sep=r.el([550,600]);
  const wC=600,w1=r.el([800,900]),w2=r.el([500,600]),w3=r.el([400,450,500]);
  const top=Z+hb+enc+sep+ha;M.hb=hb;M.ha=ha;M.top=top;M.sep=sep;M.enc=enc;
  const C=mod('C','Columna despensa','col',0,Z,wC,top-Z,db),B1=mod('B1','Bajo fregadero','bajo',wC,Z,w1,hb,db),B2=mod('B2','Bajo cajonera','bajo',wC+w1,Z,w2,hb,db),B3=mod('B3','Bajo','bajo',wC+w1+w2,Z,w3,hb,db);
  const he=r.el([360,400,450,500]);
  const A1=mod('A1','Alto escurridor','alto',wC,top-ha,w1,ha,da),A2=mod('A2','Alto sobre campana','alto',wC+w1,top-he,w2,he,da),A3=mod('A3','Alto','alto',wC+w1+w2,top-ha,w3,ha,da);
  const split=r.el([1260,1300,1340]);
  puertas(M,C,1,'h',0,split,'izq');puertas(M,C,1,'h',split,C.h-split,'izq');C.baldas=r.el([3,4,5]);
  puertas(M,B1,2,'h');cajones(M,B2,r.el([3,4]));puertas(M,B3,1,'h',0,0,'der');B3.baldas=1;
  puertas(M,A1,2,'h');A1.baldas=ha>800?2:1;puertas(M,A2,1,'h',0,0,r.el(['izq','der']));puertas(M,A3,1,'h',0,0,'der');A3.baldas=A1.baldas;
  M.mods=[C,B1,B2,B3,A1,A2,A3];M.prof=r.el([500,510,520,530,540]);M.cajonera=B2}

function genSalon(r,M){
  M.Z=r.el([100,110,130,150]);const Z=M.Z,hb=r.el([480,520,560,600]),db=450,da=350;
  const w1=r.el([600,800]),w2=r.el([900,1000,1100,1200]),w3=r.el([600,800]);
  const B1=mod('B1','Bajo cajonera','bajo',0,Z,w1,hb,db),B2=mod('B2','Bajo con puertas','bajo',w1,Z,w2,hb,db),B3=mod('B3','Bajo cajonera','bajo',w1+w2,Z,w3,hb,db);
  const nc=r.el([2,3]);cajones(M,B1,nc);puertas(M,B2,2,'h');B2.baldas=1;cajones(M,B3,nc);
  const he1=r.el([360,400,450,500,550,600]),he2=r.el([360,400,450,500,550,600]),sep=r.el([450,500,550]);
  const wa1=r.el([900,1000,1200]),wa2=r.el([600,800,900]);
  const yb=Z+hb+sep,xA=Math.max(0,Math.round((w1+w2+w3-wa1-wa2)/2/10)*10);
  const A1=mod('A1','Alto','alto',xA,yb,wa1,he1,da),A2=mod('A2','Alto','alto',xA+wa1,yb,wa2,he2,da);
  puertas(M,A1,2,'h');A1.baldas=1;if(wa2>=800){puertas(M,A2,2,'h')}else puertas(M,A2,1,'h',0,0,'der');A2.baldas=1;
  M.hb=hb;M.sep=sep;M.mods=[B1,B2,B3,A1,A2];M.prof=r.el([400,410,420,430]);M.cajonera=B1}

function genArmario(r,M){
  M.Z=r.el([90,100,110]);const Z=M.Z,h=r.el([2200,2300,2400]),d=600,E=M.E,clas=M.estilo==='Rústico'||M.estilo==='Clásico';
  const t=r.el([2,3]),ti=r.el(clas?[800,850,900,950,1000]:[800,900,1000,1100]);
  M.ti=ti;M.h=h;M.t=t;const tramos=[];
  if(M.mont==='media'){const W=t*ti+(t+1)*E,m=mod('AR','Armario','arm',0,Z,W,h,d);m.tramos=t;M.mods=[m];
    for(let i=0;i<t;i++)tramos.push({m,x:E+i*(ti+E),i});
    const off=1.5;/* las puertas de los extremos (bisagra recta) tapan casi todo el costado exterior */
    for(let i=0;i<t;i++){const xl=i===0?off:E+i*(ti+E)-E/2+M.J/2,xr=i===t-1?W-off:E+(i+1)*(ti+E)-E/2-M.J/2,w=(xr-xl-3)/2;
      [[xl,'izq',i===0?'sup':'media'],[xl+w+3,'der',i===t-1?'sup':'media']].forEach(([x,lado,mt])=>m.fr.push({tipo:'puerta',x:m.x+x,y:Z+M.g/2,w,h:h-M.g,bis:lado,mont:mt}))}}
  else{const W=ti+2*E;for(let i=0;i<t;i++){const m=mod('AR'+(i+1),'Cuerpo '+(i+1),'arm',i*W,Z,W,h,d);M.mods.push(m);tramos.push({m,x:E,i})}
    M.mods.forEach(m=>puertas(M,m,2,'h'))}
  /* interior: el tramo de la izquierda lleva cajones interiores y baldas; los demás, maletero y barra (o elevador en calidad alta) */
  tramos.forEach((T,k)=>{T.ti=ti;if(k===0){T.cajInt=3;T.baldas=r.el([2,3])}else{T.maletero=true;T.barra=true}});
  if(M.calidad==='Alta'){const T=tramos[tramos.length-1];T.barra=false;T.equip='elevador'}
  M.tramos=tramos;M.prof=r.el([480,500,520,540,560,580])}

function genVestidor(r,M){
  M.Z=r.el([90,100,110]);const Z=M.Z,h=r.el([2200,2300,2400]),d=r.el([500,550,600]),E=M.E,alta=M.calidad==='Alta';
  const w1=r.el([1000,1100,1200,1400]),w2=r.el([600,700,800]),w3=r.el([600,700,800]);
  const L=[[w1,'Colgar'],[w2,'Cajonera'],[w3,'Baldas']];let x=0;
  M.mods=L.map(([wi,nm],i)=>{const m=mod('V'+(i+1),nm,'vest',x,Z,wi+2*E,h,d);m.ti=wi;x+=m.w;return m});
  const [m1,m2,m3]=M.mods;
  m1.tramo={ti:w1,barra:!(alta&&w1<=1200),equip:alta&&w1<=1200?'elevador':null};
  m2.tramo={ti:w2,baldas:r.el([1,2])};cajones({mont:'sup',g:3},m2,4,0,Math.round(h*0.36));
  m3.tramo={ti:w3,baldas:r.el([3,4])};
  M.h=h;M.prof=d-r.el([40,60,80]);M.cajonera=m2}

/* ======================================================================
   CASO COMPLETO
   ====================================================================== */
function caso(nombre,semilla,centro){
  const r=RNG(normal(nombre)+'#'+semilla+'#'+normal(centro||'')+'#v3');
  const mob=genMob(r);
  const C={nombre,semilla,centro:centro||'',mob};
  C.mats=materiales(C);C.lineas=pedido(C,r);
  C.f1=C.lineas.filter(l=>l.ancla).map(l=>({id:'l'+l.n,n:l.n,lam:l.lam,ancla:l.ancla}));
  return C}
function materiales(C){const M=C.mob,L=[];
  L.push({corto:'Casco',comp:'Casco (costados, techo, suelo)',mat:MAT.mel[0],e:M.E,dens:MAT.mel[1]});
  if(M.fmat)L.push({corto:'Frentes',comp:'Puertas y frentes',mat:MAT[M.fmat][0],e:M.ef,dens:MAT[M.fmat][1]});
  L.push({corto:'Trasera',comp:'Trasera',mat:'DM',e:M.tipo==='vestidor'?16:8,dens:750});
  return L}

/* ---------------- listas auxiliares ---------------- */
const todasPuertas=M=>M.mods.flatMap(m=>m.fr.filter(f=>f.tipo==='puerta').map(f=>Object.assign({m},f)));
const todosCajones=M=>M.mods.flatMap(m=>m.fr.filter(f=>f.tipo==='cajon').map(f=>Object.assign({m},f)));
const fmt=v=>Number.isInteger(v)?String(v):n1(v);
function posBis(h){const n=nBis(h);return Array.from({length:n},(_,i)=>100+(h-200)*i/(n-1))}
function juntas(M){const J=[];const alto=m=>m.kind==='alto';
  M.mods.forEach(a=>M.mods.forEach(b=>{if(a===b||Math.abs(a.x+a.w-b.x)>=1)return;const y0=Math.max(a.y,b.y),y1=Math.min(a.y+a.h,b.y+b.h);if(y1-y0>100)J.push({a,b,x:b.x,y0,y1,alto:alto(a)||alto(b)})}));return J}
function tramosInt(M){if(M.tramos)return M.tramos.map((T,k)=>Object.assign(T,{k}));if(M.tipo==='vestidor')return M.mods.map((m,k)=>Object.assign(m.tramo,{k,m,x:M.E}));return []}
function nBaldas(M){return M.mods.reduce((s,m)=>s+(m.baldas||0),0)+tramosInt(M).reduce((s,T)=>s+(T.baldas||0),0)}
const ALTOS=['col','arm','vest'];/* módulos de suelo a techo: columnas */

/* ======================================================================
   HOJA DE PEDIDO (solución). Cada línea: ids aceptados, cantidad y unidad.
   ====================================================================== */
const ESTILO_TIR={Moderno:'inox',Industrial:'D',Clásico:'porcelana',Rústico:'H1970'};
const COLOR_ELEV={Moderno:'blanco',Industrial:'negro con brazo y perchero niquelados',Clásico:'gris',Rústico:'gris'};
function pedido(C,r){const M=C.mob,L=[],alta=M.calidad==='Alta';
  const ad=o=>{o.n=L.length+1;const a=art(o.ids[0]);o.ud=a.ud;o.ff=a.ff;o.pdf=a.pdf;o.refs=o.ids.map(REF);L.push(o);return o};
  const pu=todasPuertas(M),frIdx=p=>p.m.fr.findIndex(f=>f.x===p.x&&f.y===p.y);
  /* bisagras: una línea por tipo de montaje */
  let nb=0;const grupos={};pu.forEach(p=>{const mt=p.mont||M.mont;(grupos[mt]=grupos[mt]||[]).push(p)});
  ['sup','media','int'].filter(mt=>grupos[mt]).forEach(mt=>{const g=grupos[mt],n=g.reduce((s,p)=>s+nBis(p.h),0);nb+=n;
    const id=`${M.serie}_${mt}_${M.esq.slice(0,2)}`;
    const det=g.map(p=>`${p.m.id} ${fmt(r1(p.h))} × ${fmt(r1(p.w))}`).join('; ');
    const dondeA=M.tipo==='armario'&&M.mont==='media'?(mt==='sup'?' (las dos puertas de los extremos del armario)':' (las puertas que comparten un costado intermedio)'):'';
    ad({k:'bis',tit:`Bisagras · ${MONT[mt].n}`,ids:[id],cant:n,
      desc:`Bisagra de cazoleta de 110° para ${MONT[mt].n}${dondeA} (${MONT[mt].b}), ${alta?'con amortiguación integrada (cierre suave)':'con autocierre, sin amortiguación'}, cazoleta para atornillar, esquema de taladro ${M.esq}. Puertas (Alto × Ancho, mm): ${det}.`,
      calc:`${g.length} puertas: ${g.map(p=>`${fmt(r1(p.h))} → ${nBis(p.h)}`).join(', ')} = ${n} bisagras. Serie ${alta?'Duomatic Plus 110°':'Duomatic 110°'}, ${MONT[mt].h}, esquema ${M.esq}.`,
      ancla:{mod:g[0].m.id,fr:frIdx(g[0]),que:'bis'},lam:1})});
  if(nb){const otra=pu.find(p=>p.m.id!==pu[0].m.id)||pu[pu.length-1];
    ad({k:'placa',tit:'Bases de las bisagras',ids:['placa_'+M.D],cant:nb,
      desc:`Placa de montaje en cruz para esas bisagras, con montaje rápido, para atornillar con tornillos para aglomerado, altura D = ${M.D} mm. Una por bisagra.`,
      calc:`Una placa por bisagra: ${nb}. Placa Duomatic SM con tornillos para aglomerado, D = ${M.D} mm.`,ancla:{mod:otra.m.id,fr:frIdx(otra),que:'bis'},lam:1})}
  /* guías de cajón */
  const caj=todosCajones(M),cajInt=tramosInt(M).reduce((s,T)=>s+(T.cajInt||0),0),nCaj=caj.length+cajInt;
  if(nCaj){const tipo=alta?'a':'c',g=ARTS(a=>a.id.startsWith('uma_'+tipo+'_')&&a.p.prof<=M.prof).sort((a,b)=>b.p.NL-a.p.NL)[0];if(!g)throw new Error('Sin corredera para el fondo '+M.prof);
    const donde=caj.length?[...new Set(caj.map(c=>c.m.id))].map(id=>`${id}: ${caj.filter(c=>c.m.id===id).length}`).join(', '):'';
    ad({k:'guia',tit:'Guías de los cajones',ids:[g.id],cant:nCaj,
      desc:`Guía oculta de montaje inferior (bajo el cajón), de extracción completa, para 30 kg, ${alta?'con autocierre y amortiguación':'con autocierre'}. Profundidad interior del cuerpo: ${M.prof} mm; elige la longitud nominal más larga que quepa. Cajones: ${[donde,cajInt?`${cajInt} cajones interiores (lámina 2)`:''].filter(Boolean).join('; ')}.`,
      calc:`${nCaj} cajones → ${nCaj} pares. Profundidad ${M.prof} mm → longitud ${g.p.NL} mm (pide ${g.p.prof} mm de profundidad del cuerpo).`,
      ancla:caj.length?{mod:caj[0].m.id,que:'caj'}:{que:'cajint'},lam:caj.length?1:2})}
  /* tiradores */
  const nTir=pu.length+caj.length;
  if(nTir){const gr=ESTILO_TIR[M.estilo];let ids,txt;
    if(gr==='inox'){const c=r.el([128,160,192]);ids=['jal_inox_'+c];txt=`jaladera curva de Ø10 mm de acero inoxidable mate cepillado, de ${c} mm entre ejes`}
    else if(gr==='D'){const a=r.el(ARTS(x=>x.p.grupo==='D').map(x=>x.p.acabado)),c=r.el([96,128,160,192]);ids=ARTS(x=>x.p.grupo==='D'&&x.p.acabado===a&&x.p.C===c).map(x=>x.id);txt=`jaladera en forma de «D» de acero, ${a}, de ${c} mm entre ejes`}
    else if(gr==='porcelana'){const c=r.el([96,128]);ids=['jal_porc_'+c];txt=`jaladera curva de péndulo de porcelana blanca con base oro pulido, de ${c} mm entre ejes`}
    else{const a=r.el(ARTS(x=>x.p.grupo==='H1970'));ids=[a.id];txt=`jaladera curva de fundición de zinc, modelo H1970, ${a.p.acabado}`}
    ad({k:'tir',tit:'Tiradores',ids,cant:nTir,desc:`Tirador (Häfele lo llama «jaladera»): ${txt}. Uno por puerta y uno por cajón${cajInt?' (los cajones interiores no llevan)':''}.`,
      calc:`${pu.length} puertas + ${caj.length} cajones = ${nTir}.`,ancla:{que:'tir'},lam:1})}
  /* portaestantes */
  const nbal=nBaldas(M);
  if(nbal){const kg=r.el([10,25,35,45,60]),ids=ARTS(a=>a.id.startsWith('porta_')&&a.p.kg*4>=kg-1e-9).map(a=>a.id);
    ad({k:'porta',tit:'Soportes de las baldas',ids,cant:4*nbal,
      desc:`Soporte para estante de fundición de zinc, para taladro de Ø5 mm (Sistema 32), que aguante una carga de ${kg} kg por balda con 4 soportes. Para todas las baldas móviles (lámina 2).`,
      calc:`${nbal} baldas móviles × 4 = ${4*nbal}. Carga ${kg} kg por balda: valen los soportes de ${kg/4} kg por pieza o más.`,ancla:{que:'balda'},lam:2})}
  /* patas */
  const suelo=M.mods.filter(m=>m.kind!=='alto');
  {const ids=ARTS(a=>a.id.startsWith('pata_')&&M.Z>=a.p.hmin&&M.Z<=a.p.hmax).map(a=>a.id);if(!ids.length)throw new Error('Sin pata para Z '+M.Z);
    ad({k:'pata',tit:'Patas del zócalo',ids,cant:4*suelo.length,desc:`Pata regulable de acero para el zócalo (Häfele: «zoclo») que dé la altura del zócalo del alzado (lámina 1). Cuatro por cada módulo que apoya en el suelo.`,
      calc:`${suelo.length} módulos en el suelo × 4 = ${4*suelo.length}. Zócalo ${M.Z} mm.`,ancla:{mod:suelo[0].id,que:'pata'},lam:1})}
  /* colgadores */
  const altos=M.mods.filter(m=>m.kind==='alto');
  if(altos.length){[['izq','izquierdo','colgI'],['der','derecho','colg']].forEach(([l,t,q])=>ad({k:'colg_'+l,tit:`Colgadores · lado ${t}`,ids:['colg_'+l],cant:altos.length,
    desc:`Colgador para atornillar de mueble alto (Häfele: «colgador de gabinete»), niquelado, 52 kg por pieza, ${t}. Uno de cada lado por mueble alto.`,
    calc:`${altos.length} muebles altos → ${altos.length} ${t}s.`,ancla:{mod:altos[0].id,que:q},lam:1}))}
  /* tornillos de unión */
  const J=juntas(M);
  if(J.length){const g=2*M.E,ids=ARTS(a=>a.id.startsWith('union_')&&g>=a.p.gmin&&g<=a.p.gmax).map(a=>a.id),n=J.reduce((s,j)=>s+(ALTOS.includes(j.a.kind)&&ALTOS.includes(j.b.kind)?4:2),0);
    ad({k:'union',tit:'Unión entre módulos',ids,cant:n,desc:`Tornillo de unión M6 con su casquillo, para taladro pasante de Ø8 mm, para coser dos costados de módulos contiguos (grueso del casco en el cuadro de materiales). Dos por unión entre módulos y cuatro entre columnas.`,
      calc:`${J.map(j=>`${j.a.id}–${j.b.id}: ${ALTOS.includes(j.a.kind)&&ALTOS.includes(j.b.kind)?4:2}`).join(', ')} = ${n}. Grosor de madera ${M.E} + ${M.E} = ${g} mm.`,ancla:{que:'union',j:0},lam:1})}
  /* barras de colgar y elevador */
  const TB=tramosInt(M).filter(T=>T.barra);
  if(TB.length){const ti=Math.max(...TB.map(T=>T.ti)),b=ARTS(a=>a.id.startsWith('barra_')&&a.p.L>=ti).sort((a,b)=>a.p.L-b.p.L)[0];
    ad({k:'barra',tit:'Barras de colgar',ids:[b.id],cant:TB.length,desc:`Barra de armario OVA 30 × 15 mm de tubo de acero soldado, cromada: la longitud comercial más corta que cubra el ancho interior del tramo (lámina 2). Se corta a medida en el taller. Una por tramo de colgar.`,
      calc:`${TB.length} tramos de colgar de ${ti} mm → barra de ${b.p.L} mm.`,ancla:{que:'barra',k:TB[0].k},lam:2});
    ad({k:'sop',tit:'Soportes de las barras',ids:['sop_260','sop_250'],cant:2*TB.length,desc:`Soporte lateral para esa barra OVA 30 × 15 mm, de fundición de zinc cromada, que se atornilla al costado. Dos por barra.`,
      calc:`${TB.length} barras × 2 = ${2*TB.length}.`,ancla:{que:'barra',k:TB[0].k},lam:2})}
  const TE=tramosInt(M).filter(T=>T.equip==='elevador');
  if(TE.length){const T=TE[0],col=COLOR_ELEV[M.estilo],ids=ARTS(a=>a.id.startsWith('elev_')&&a.p.color===col&&T.ti>=a.p.min&&T.ti<=a.p.max).map(a=>a.id);
    ad({k:'elev',tit:'Elevador de la barra',ids,cant:TE.length,desc:`Elevador para guardarropas (barra que baja hacia delante), ${col}, para el ancho interior del tramo señalado en la lámina 2.`,
      calc:`Ancho interior ${T.ti} mm, color ${col}.`,ancla:{que:'equip',eq:'elevador',k:T.k},lam:2})}
  return L}

/* ======================================================================
   NOTA (como un examen, decisión del profesor del 24/11/2026)
   Nota = 10 × Σ (0,6·R + 0,3·C + 0,1·U) / número de líneas
   R, C, U = 1 si el Nº de artículo, la cantidad o la unidad están bien a la primera; 0 si han fallado alguna vez
   (aunque luego se corrijan). Con pista, el Nº de artículo de esa línea vale 0.
   Apto: nota ≥ 5 y al menos la mitad de los Nº de artículo encontrados sin pista y sin fallo.
   ====================================================================== */
const CAMPOS=['ref','cant','ud'],PESO_C={ref:.6,cant:.3,ud:.1};
function okCampo(l,c,v){if(v==null||v==='')return false;if(c==='ref')return l.refs.some(r=>refN(r)===refN(v));if(c==='cant')return num(v)===l.cant;return v===l.ud}
function valorCasilla(l,c,F){const k='l'+l.n+':'+c;if(F.fallo[k])return 0;if(!okCampo(l,c,(F.resp['l'+l.n]||{})[c]))return 0;return c==='ref'&&F.pistas['l'+l.n]?0:1}
function notaDe3(L,F){if(!L.length)return 0;let s=0;L.forEach(l=>CAMPOS.forEach(c=>s+=PESO_C[c]*valorCasilla(l,c,F)));return s/L.length*10}
const refsPropias=(L,F)=>L.filter(l=>valorCasilla(l,'ref',F)===1).length;
const esApto=(nf,rp,nl)=>nf>=5-1e-9&&2*rp>=nl;

if(typeof module!=='undefined')module.exports={caso,posBis,juntas,tramosInt,nBaldas,notaDe3,okCampo,esApto,refsPropias,valorCasilla,PESO_C,ART,art,MONT,nBis,RNG,normal,refN,CAMPOS};

/* ======================================================================
   PLANOS SVG: lámina A3 apaisada en mm (420 × 297), márgenes 15 mm a la
   izquierda y 7 mm en el resto, cajetín 100 × 36, letra de trazo SIMPLEX
   (Hershey Roman Simplex) de 2,5 mm como mínimo, sistema europeo (planta
   debajo del alzado, vista lateral izquierda a la derecha) y vista 3D
   isométrica sin recuadro a la izquierda del cajetín.
   Cada lámina se compone en celdas fijas para que nada se solape.
   ====================================================================== */
const PH=420,PV=297,MIZ=15,MOT=7,CW=100,CH=36,HMIN=2.5;
const CAJ={x:PH-MOT-CW,y:PV-MOT-CH},ISOB={x:196,y:231,w:112,h:56};
/* ---------- letra SIMPLEX ---------- */
const ACC={'á':'a','é':'e','í':'i','ó':'o','ú':'u','Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','ü':'u','Ü':'U','ñ':'n','Ñ':'N','ö':'o','Ö':'O','ä':'a','Ä':'A'};
const GC={};
function glifo(ch){if(GC[ch])return GC[ch];let g;
  if(ch===' ')g=[[],16];
  else if(ACC[ch]){const b=ACC[ch],[st,w]=HERSHEY[b],up=b!==b.toLowerCase();let tr=st.map(s=>s.slice());if(b==='i')tr=tr.filter(s=>!s.every(p=>p[1]>11));const cx=w/2,top=(up?21:14)+3;
    if('ñÑ'.includes(ch))tr.push([[cx-5,top+1],[cx-3,top+3],[cx,top+1.5],[cx+3,top],[cx+5,top+2]]);else if('üÜöÖäÄ'.includes(ch))tr.push([[cx-3,top+1],[cx-2.6,top+1.4]],[[cx+3,top+1],[cx+3.4,top+1.4]]);else tr.push([[cx-1.5,top],[cx+2.5,top+4]]);g=[tr,w]}
  else if(ch==='º'||ch==='ª'){const [st,w]=HERSHEY[ch==='º'?'o':'a'];const tr=st.map(s=>s.map(([x,y])=>[.55*x+1,.55*y+10]));tr.push([[1,8],[.55*w,8]]);g=[tr,.55*w+3]}
  else if(ch==='³'||ch==='²'){const [st,w]=HERSHEY[ch==='³'?'3':'2'];g=[st.map(s=>s.map(([x,y])=>[.55*x+1,.55*y+11])),.55*w+2]}
  else if(ch==='°'){const t=[];for(let i=0;i<=16;i++){const a=i/16*2*Math.PI;t.push([4+3*Math.cos(a),18+3*Math.sin(a)])}g=[[t],10]}
  else if(ch==='Ø'||ch==='ø'){const [st,w]=HERSHEY.O;g=[st.concat([[[1,-2],[w-1,23]]]),w]}
  else if(ch==='×')g=[[[[3,4],[13,14]],[[3,14],[13,4]]],16];
  else if(ch==='·')g=[[[[4,9],[4.6,9.6]]],9];
  else if(ch==='±')g=[[[[8,6],[8,18]],[[2,12],[14,12]],[[2,3],[14,3]]],16];
  else if(ch==='≈')g=[[[[2,8],[5,10],[8,8],[11,6],[14,8]],[[2,14],[5,16],[8,14],[11,12],[14,14]]],16];
  else if(ch==='≥')g=[[[[2,18],[14,13],[2,8]],[[2,4],[14,4]]],16];
  else if(ch==='≤')g=[[[[14,18],[2,13],[14,8]],[[2,4],[14,4]]],16];
  else if(ch==='–'||ch==='—'||ch==='−')g=[[[[2,9],[ch==='—'?20:14,9]]],ch==='—'?22:16];
  else if(ch==='→')g=[[[[1,10],[15,10]],[[10,14],[15,10],[10,6]]],17];
  else if(ch==='’'||ch==='‘')g=HERSHEY["'"];
  else if('“”«»'.includes(ch))g=HERSHEY['"'];

  return GC[ch]=g}
const anchoT=(s,h=HMIN)=>[...String(s)].reduce((a,c)=>a+glifo(c)[1],0)*h/21;
function trazo(x,y,s,h=HMIN,ancla='start',rot=0){const k=h/21,W=anchoT(s,h),dx=ancla==='middle'?-W/2:ancla==='end'?-W:0,c=Math.cos(-rot*Math.PI/180),sn=Math.sin(-rot*Math.PI/180);let d='',xa=dx;
  for(const ch of String(s)){const [st,w]=glifo(ch);for(const t of st){t.forEach(([gx,gy],i)=>{const px=xa+gx*k,py=-gy*k,X=x+px*c-py*sn,Y=y+px*sn+py*c;d+=(i?'L':'M')+X.toFixed(2)+' '+Y.toFixed(2)})}xa+=w*k}return d}
/* texto que se reduce (sin bajar de hmin) o se recorta para caber en un ancho */
function ajusta(s,w,h,hmin){let t=String(s);while(anchoT(t,h)>w&&h>hmin+.05)h-=.1;while(anchoT(t,h)>w&&t.length>3)t=t.slice(0,-2)+'.';return [t,h]}
/* ---------- acumulador de dibujo ---------- */
const f2=v=>Math.round(v*100)/100;
function Lienzo(){return {o:[],t:{},add(s){this.o.push(s);return this},
  txt(x,y,s,h=HMIN,a='start',rot=0,cls='t'){(this.t[cls]=this.t[cls]||[]).push(trazo(x,y,s,h,a,rot));return this},
  ln(x1,y1,x2,y2,c='f'){return this.add(`<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}" class="${c}"/>`)},
  re(x,y,w,h,c='g',ex=''){return this.add(`<rect x="${f2(x)}" y="${f2(y)}" width="${f2(w)}" height="${f2(h)}" class="${c}" ${ex}/>`)},
  pl(P,c='g',cerr=true){return this.add(`<${cerr?'polygon':'polyline'} points="${P.map(p=>f2(p[0])+','+f2(p[1])).join(' ')}" class="${c}"/>`)},
  ci(x,y,r,c='f'){return this.add(`<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}" class="${c}"/>`)},
  svg(){let s=this.o.join('');for(const k in this.t)s+=`<path class="${k}" d="${this.t[k].join('')}"/>`;return s}}}
/* rectángulo seccionado: contorno grueso y rayado a 45° dibujado línea a línea */
function seccion(L,x,y,w,h,paso=1.2,inv=false){L.re(x,y,w,h,'sb');for(let d=-h;d<w;d+=paso){let x1=x+d,y1=y+h,x2=x+d+h,y2=y;if(x1<x){y1-=x-x1;x1=x}if(x2>x+w){y2+=x2-(x+w);x2=x+w}if(x1<=x2){if(inv)L.ln(2*x+w-x1,y1,2*x+w-x2,y2,'ra');else L.ln(x1,y1,x2,y2,'ra')}}L.re(x,y,w,h,'g')}
/* ---------- cotas ---------- */
function flecha(L,x,y,dx,dy){const a=2.2,b=.55;const px=-dy,py=dx;L.add(`<polygon class="fl" points="${f2(x)},${f2(y)} ${f2(x+dx*a+px*b)},${f2(y+dy*a+py*b)} ${f2(x+dx*a-px*b)},${f2(y+dy*a-py*b)}"/>`)}
function cota(L,x1,y1,x2,y2,off,txt,h=HMIN,abajo=false){const hz=Math.abs(y1-y2)<1e-6;const sg=off>=0?1:-1;
  if(hz){const y=y1+off;L.ln(x1,y1+sg*.8,x1,y+sg*1.5,'c').ln(x2,y2+sg*.8,x2,y+sg*1.5,'c');const ancho=Math.abs(x2-x1),fuera=ancho<5;
    L.ln(Math.min(x1,x2)-(fuera?4:0),y,Math.max(x1,x2)+(fuera?4:0),y,'c');const a=Math.min(x1,x2),b=Math.max(x1,x2);if(fuera){flecha(L,a,y,-1,0);flecha(L,b,y,1,0)}else{flecha(L,a,y,1,0);flecha(L,b,y,-1,0)}
    if(txt!=='')(anchoT(txt,h)+2>ancho)?L.txt(b+(fuera?5:1.2),y-.8,txt,h,'start'):L.txt((a+b)/2,y-.8,txt,h,'middle')}
  else{const x=x1+off;L.ln(x1+sg*.8,y1,x+sg*1.5,y1,'c').ln(x2+sg*.8,y2,x+sg*1.5,y2,'c');const a=Math.min(y1,y2),b=Math.max(y1,y2),fuera=b-a<5;L.ln(x,a-(fuera?4:0),x,b+(fuera?4:0),'c');
    if(fuera){flecha(L,x,a,0,-1);flecha(L,x,b,0,1)}else{flecha(L,x,a,0,1);flecha(L,x,b,0,-1)}
    if(txt!=='')(anchoT(txt,h)+2>b-a)?(abajo?L.txt(x-.8,b+(fuera?5:1.2),txt,h,'end',90):L.txt(x-.8,a-(fuera?5:1.2),txt,h,'start',90)):L.txt(x-.8,(a+b)/2,txt,h,'middle',90)}}
function parte(t,w,h=HMIN){const L=[''];String(t).split(' ').forEach(p=>{const k=L.length-1;if(L[k]&&anchoT(L[k]+' '+p,h)>w)L.push(p);else L[k]=L[k]?L[k]+' '+p:p});return L}
const corto=m=>({Aglomerado:'Aglom.',Contrachapado:'Contrach.',Tablero:'Alistonado'}[m.split(' ')[0]]||m.split(' ')[0]);
function titulo(L,x,y,t,esc){L.txt(x,y,t,3.5,'start',0,'tb');if(esc)L.txt(x+anchoT(t,3.5)+3,y,esc,HMIN,'start')}
/* ---------- marco, cajetín y símbolo europeo ---------- */
function marco(L){L.re(MIZ,MOT,PH-MIZ-MOT,PV-2*MOT,'mg')}
/* sistema europeo (primer diedro): cono truncado de perfil con el extremo estrecho a la izquierda y, a su derecha,
   su vista desde la izquierda (dos circunferencias concéntricas) */
function simboloEuropeo(L,x,yc,h){const hb=h,ht=h*.55,Lc=h*1.1;L.pl([[x,yc-ht/2],[x+Lc,yc-hb/2],[x+Lc,yc+hb/2],[x,yc+ht/2]],'f');const cx=x+Lc+h*.75;L.ci(cx,yc,hb/2,'f').ci(cx,yc,ht/2,'f');L.ln(x-1,yc,cx+hb/2+1,yc,'e').ln(cx,yc-hb/2-1,cx,yc+hb/2+1,'e')}
function cajetin(L,d){const x0=CAJ.x,y0=CAJ.y;L.re(x0,y0,CW,CH,'mg','style="fill:#fff"');
  const lab=(x,y,t)=>L.txt(x+.8,y+2.4,t,1.8,'start',0,'lb');
  const cols=[['Curso',null,38],['Fecha',d.fecha,26],['Escala',d.escala,19],['Nº Plano',d.n,17]];let x=x0;
  cols.forEach(([l,v,w],i)=>{L.re(x,y0,w,8,'cf');if(v==null){L.txt(x+.8,y0+2.5,'Curso: 1º CFGS',1.8,'start',0,'lb');L.txt(x+.8,y0+5,'Diseño y Amueblamiento',1.8,'start',0,'lb')}else{lab(x,y0,l);const [t,h]=ajusta(v,w-1.6,HMIN,HMIN);L.txt(x+w/2,y0+7,t,h,'middle',0,i===3?'tb':'t')}x+=w});
  L.re(x0,y0+8,CW,8.5,'cf');lab(x0,y0+8,'Proyecto');{const [t,h]=ajusta(d.proyecto,CW-4,3.2,HMIN);L.txt(x0+2,y0+15.4,t,h,'start',0,'tb')}
  L.re(x0,y0+16.5,62,8,'cf');lab(x0,y0+16.5,'Componente');{const [t,h]=ajusta(d.comp,58,HMIN,HMIN);L.txt(x0+2,y0+23.4,t,h)}
  L.re(x0+62,y0+16.5,38,8,'cf');lab(x0+62,y0+16.5,'Material · kg/m³');{const [t,h]=ajusta(d.mat,34,HMIN,HMIN);L.txt(x0+64,y0+23.4,t,h)}
  const yb=y0+24.5,hb=CH-24.5,lw=(hb-1.2)*202/170;

  const wa=x0+CW-17-xa;L.re(xa,yb,wa,hb,'cf');L.txt(xa+2,yb+4,'Gustavo Hernández Sánchez',HMIN);{const [t,h]=ajusta(d.centro||'I.E.S. Virgen de la Esperanza',wa-4,2,1.8);L.txt(xa+2,yb+7.5,t,h)}L.txt(xa+2,yb+10.8,'Departamento de Madera',2);
  const xs=x0+CW-17;L.re(xs,yb,17,hb,'cf');simboloEuropeo(L,xs+2.6,yb+hb*.4,4.4);L.txt(xs+8.5,yb+hb-1,'cotas mm',1.8,'middle',0,'lb')}
/* ---------- proyección isométrica (vista desde delante, la derecha y arriba) ---------- */
const ISO={c:Math.cos(Math.PI/6),s:Math.sin(Math.PI/6)};
function isoP(x,y,z){return [ISO.c*(x+y),ISO.s*(x-y)-z]} /* x ancho, y fondo (0 delante), z alto */
function cajaIso(b){const {x,y,z,w,d,h}=b;const P=isoP;return {front:[P(x,y,z),P(x+w,y,z),P(x+w,y,z+h),P(x,y,z+h)],side:[P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],top:[P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)]}}
function vistaIso(L,cajas,B){let xs=[],ys=[];cajas.forEach(b=>{const c=cajaIso(b);[...c.front,...c.side,...c.top].forEach(p=>{xs.push(p[0]);ys.push(p[1])})});
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),k=Math.min(B.w/(maxx-minx),B.h/(maxy-miny));
  const T=p=>[B.x+B.w-(maxx-p[0])*k,B.y+B.h-(maxy-p[1])*k];
  cajas.slice().sort((a,b)=>(a.x+a.w+a.z+a.h-(a.y))-(b.x+b.w+b.z+b.h-(b.y))).forEach(b=>{const c=cajaIso(b);
    L.pl(c.top.map(T),'iso3');L.pl(c.side.map(T),'iso2');L.pl(c.front.map(T),'iso1');(b.fr||[]).forEach(f=>L.pl([isoP(f.x,b.y,f.z),isoP(f.x+f.w,b.y,f.z),isoP(f.x+f.w,b.y,f.z+f.h),isoP(f.x,b.y,f.z+f.h)].map(T),'isof'))})}
/* ---------- marcadores de zona (fase 1) ---------- */
function marcador(L,n,ax,ay,dx,dy,usados){let mx=ax+dx,my=ay+dy;for(let i=0;i<20&&usados.some(u=>Math.hypot(u[0]-mx,u[1]-my)<8.2);i++){my+=dy>=0?4:-4;if(i%3===2)mx+=dx>=0?4:-4}usados.push([mx,my,n]);
  const dd=Math.hypot(mx-ax,my-ay)||1;L.ln(ax,ay,mx-(mx-ax)*3.3/dd,my-(my-ay)*3.3/dd,'z').ci(ax,ay,.7,'zp').add(`<circle cx="${f2(mx)}" cy="${f2(my)}" r="3.3" class="zc" data-z="${n}"/>`).txt(mx,my+1.25,String(n),HMIN,'middle',0,'zt')}
const zonaDe=(C,lam,pred)=>C.f1.find(z=>z.lam===lam&&pred(z.ancla));

/* ---------- símbolos del alzado ----------
   Apertura (criterio del profesor): triángulo de trazos con la BASE en el canto de las bisagras
   y el VÉRTICE en el centro del canto que abre (lado del tirador). En los frentes que abren hacia
   arriba la base queda arriba y el vértice abajo. */
function simPuerta(L,X,Y,f){const hx=f.bis==='izq'?f.x:f.x+f.w,ox=f.bis==='izq'?f.x+f.w:f.x;L.pl([[X(hx),Y(f.y+f.h)],[X(ox),Y(f.y+f.h/2)],[X(hx),Y(f.y)]],'ap',false)}
/* elevables: basculante (triángulo con la base arriba), plegable (línea de división con charnelas y un
   triángulo por hoja) y paralelo (flechas verticales: el frente sube sin girar) */
function simElev(L,X,Y,f){const x0=f.x,x1=f.x+f.w,y0=f.y,y1=f.y+f.h,cx=(x0+x1)/2;
  if(f.free==='space'){[1/3,2/3].forEach(q=>{const x=x0+f.w*q;L.ln(X(x),Y(y0+f.h*.2),X(x),Y(y1-f.h*.12),'ap');flecha(L,X(x),Y(y1-f.h*.12),0,1)})}
  else if(f.free==='fold'){const ym=(y0+y1)/2;L.ln(X(x0),Y(ym),X(x1),Y(ym),'fr');[.22,.78].forEach(q=>L.re(X(x0+f.w*q)-.9,Y(ym)-.6,1.8,1.2,'chn'));
    L.pl([[X(x0),Y(y1)],[X(cx),Y(ym)],[X(x1),Y(y1)]],'ap',false);L.pl([[X(x0),Y(ym)],[X(cx),Y(y0)],[X(x1),Y(ym)]],'ap',false)}
  else if(f.free==='abajo')L.pl([[X(x0),Y(y0)],[X(cx),Y(y1)],[X(x1),Y(y0)]],'ap',false);/* tapa que abre hacia abajo: base abajo (bisagras), vértice arriba */
  else L.pl([[X(x0),Y(y1)],[X(cx),Y(y0)],[X(x1),Y(y1)]],'ap',false)}
/* entrada de llave en un frente: círculo con ranura */
function simLlave(L,x,y){L.ci(x,y,.75,'g');L.add(`<rect x="${f2(x-.22)}" y="${f2(y-.2)}" width=".44" height="1.6" class="tirb"/>`)}
/* cazoletas de las bisagras en el canto de bisagras de una puerta (vistas a través del frente) */
const xCaz=(f,M)=>f.bis==='izq'?f.x+M.K+17.5:f.x+f.w-M.K-17.5;
function simCaz(L,x,y,r){L.ci(x,y,r,'czA');L.ln(x-r,y,x+r,y,'czl').ln(x,y-r,x,y+r,'czl')}
function cazoletas(L,X,Y,f,M,k){posBis(f.h).forEach(v=>simCaz(L,X(xCaz(f,M)),Y(f.y+v),Math.max(.6,17.5*k)))}

/* ======================================================================
   LÁMINA 1: CONJUNTO DE MOBILIARIO (alzado, planta, lateral, materiales)
   ====================================================================== */
function bbox(M){let W=0,H=0,D=0;M.mods.forEach(m=>{W=Math.max(W,m.x+m.w);H=Math.max(H,m.y+m.h);D=Math.max(D,m.d)});if(M.hojas)M.hojas.forEach(h=>W=Math.max(W,h.x+h.w));return {W,H,D}}
function lamina1(C,opt){const M=C.mob,L=Lienzo(),us=[];marco(L);const {W,H,D}=bbox(M);
  const esc=[20,25,30].find(e=>W/e+D/e<=232&&(H+D)/e<=168)||30,k=1/esc;
  const xA=MIZ+16,yA=MOT+30+H*k;const X=v=>xA+v*k,Y=v=>yA-v*k;
  titulo(L,MIZ+7,MOT+9,`${TIPO_MOB[M.tipo].toUpperCase()} · ESTILO ${M.estilo.toUpperCase()} · CALIDAD ${M.calidad.toUpperCase()}`);
  /* --- alzado --- */
  L.ln(X(-120),Y(0),X(W+120),Y(0),'g');
  M.mods.forEach(m=>{L.re(X(m.x),Y(m.y+m.h),m.w*k,m.h*k,'g');
    if(m.kind!=='alto'&&m.y>0){L.ln(X(m.x),Y(m.y),X(m.x+m.w),Y(m.y),'f');const [t]=ajusta(m.id,m.w*k-2,HMIN,HMIN);if(m.y*k>=3.2)L.txt(X(m.x+m.w/2),Y(m.y/2)+1.25,t,HMIN,'middle')}
    m.fr.forEach(f=>{L.re(X(f.x),Y(f.y+f.h),f.w*k,f.h*k,'fr');
      if(f.tipo==='puerta'){simPuerta(L,X,Y,f);if(M.K!=null)cazoletas(L,X,Y,f,M,k)}
      if(f.tipo==='elev')simElev(L,X,Y,f);
      if(f.tipo==='tapa')simElev(L,X,Y,Object.assign({},f,{free:'abajo'}));
      if(f.cerr)simLlave(L,X(f.x+f.w/2+130),Y(f.y+f.h/2));
      if(f.pesado&&M.pesado&&M.pesado.lam===1)L.txt(X(f.x)+1,Y(f.y+f.h)+3.3,M.pesado.et,HMIN);/* etiqueta del cajón con carga pesada */
      if(!M.push&&['puerta','cajon','elev','extraible','tapa'].includes(f.tipo)){const pz=f.tipo==='puerta',tx=pz?(f.bis==='izq'?f.x+f.w-50:f.x+50):f.x+f.w/2,ty=pz?(m.kind==='alto'?f.y+120:Math.max(f.y+150,Math.min(f.y+f.h-120,1100))):f.tipo==='elev'?f.y+50:f.tipo==='tapa'?f.y+f.h-50:f.y+f.h/2;
        if(pz)L.ln(X(tx),Y(ty-80),X(tx),Y(ty+80),'tir');else L.ln(X(tx-80),Y(ty),X(tx+80),Y(ty),'tir')}})});
  if(M.ledBajo)M.ledBajo.forEach(m=>L.ln(X(m.x+15),Y(m.y)+.7,X(m.x+m.w-15),Y(m.y)+.7,'led'));/* perfil con luz bajo el mueble alto */
  if(M.hojas)M.hojas.forEach(h=>{L.re(X(h.x),Y(h.y+h.h),h.w*k,h.h*k,h.fila?'fr':'frb');L.ln(X(h.x+40),Y(h.y+h.h/2-100),X(h.x+40),Y(h.y+h.h/2+100),'tir')});
  /* vestidor (sin frentes): se ve el interior; el equipamiento se dibuja en la lámina 2 */
  if(M.tipo==='vestidor')M.mods.forEach(m=>{const E=M.E,t=m.tramo;L.re(X(m.x+E),Y(m.y+m.h-E),(m.w-2*E)*k,(m.h-2*E)*k,'f');

/* alzado interior: devuelve los puntos de anclaje de las zonas */

  /* barra abatible (alzado): sin estante; barra arriba, dos brazos largos que bajan hasta una caja de mecanismo en cada costado

  const abatible=(x,w,yt)=>{const yb=yt-30,yc=yb-830;

    L.ln(X(x+45),Y(yb),X(x+w-45),Y(yb),'barra');L.ln(X(x+w/2),Y(yb),X(x+w/2),Y(yb-150),'g');L.add(`<path class="g" d="M${f2(X(x+w/2-35))} ${f2(Y(yb-150))}h${f2(T(70))}"/>`);

${msg()}

/* --- herramientas del panel --- */
function herramientas(){const t=G.herr,b=(k,n)=>`<button class="${t===k?'si':''}" data-a="herr" data-v="${k}">${n}</button>`;
  return `<div class="herr">${b('enc','Encargo')}${b('crit','Criterios del taller')}${b('voc','Vocabulario de Häfele')}${b('cat','Catálogo')}${b('no','Ocultar')}</div>${t==='no'?'':`<div class="caja">${t==='enc'?hEnc():t==='crit'?hCrit():t==='voc'?hVoc():hCat()}</div>`}`}
function hEnc(){const M=G.C.mob;return `<b>${TIPO_MOB[M.tipo]}</b> · estilo ${M.estilo.toLowerCase()} · calidad ${M.calidad.toLowerCase()} · ${M.mods.length} ${M.mods.length>1?'módulos':'módulo'}${M.mont?` · ${MONT[M.mont].n}`:''}
  <table style="margin-top:6px"><tr><th>Componente</th><th>Material</th><th class="n">e (mm)</th></tr>${G.C.mats.map(m=>`<tr><td>${m.comp}</td><td>${m.mat}</td><td class="n">${m.e}</td></tr>`).join('')}</table>
  <p class="ayu">Los números en círculo de las láminas son los números de línea del pedido: púlsalos para ir a la línea.</p>`}
function hCrit(){return `<ul class="crit">
<li><b>Bisagras:</b> 2 por puerta de hasta 900 mm de alto, 3 hasta 1600 mm y 4 por encima. Una base (placa de montaje) por bisagra.</li>
<li><b>Guías de cajón:</b> 1 par por cajón. La longitud nominal es la más larga que cabe en la profundidad interior del cuerpo (la ficha da la profundidad mínima para cada longitud).</li>
<li><b>Tiradores:</b> 1 por puerta y 1 por cajón.</li>
<li><b>Soportes de baldas:</b> 4 por balda móvil. La carga de la balda se reparte entre los 4.</li>
<li><b>Patas:</b> 4 por módulo que apoya en el suelo; la altura de construcción tiene que cubrir la altura del zócalo.</li>
<li><b>Colgadores:</b> uno izquierdo y uno derecho por mueble alto.</li>
<li><b>Tornillos de unión:</b> 2 por unión entre módulos y 4 entre columnas (de suelo a techo). El grosor de madera que unen es la suma de los dos costados.</li>
<li><b>Barras de colgar:</b> 1 por tramo, de la longitud comercial más corta que cubra el ancho interior; 2 soportes por barra.</li>
<li><b>Cantidad:</b> siempre lo que se monta, en la unidad en que el catálogo cuenta ese artículo (pieza, par, juego…), aunque se venda en cajas.</li></ul>`}
function hVoc(){return `<p class="ins" style="margin-top:0">El catálogo está en español de América. Así llama a lo que en el taller decimos de otra forma:</p><table><tr><th>Taller</th><th>Catálogo de Häfele</th></tr>
<tr><td>Tirador</td><td>Jaladera</td></tr><tr><td>Guía de cajón</td><td>Corredera</td></tr><tr><td>Mueble, módulo</td><td>Gabinete, cuerpo</td></tr><tr><td>Zócalo</td><td>Zoclo</td></tr><tr><td>Mueble alto de cocina</td><td>Alacena</td></tr><tr><td>Armario</td><td>Clóset, guardarropa</td></tr><tr><td>Barra de colgar</td><td>Barra de armario, riel para clóset</td></tr><tr><td>Base de la bisagra</td><td>Placa de montaje</td></tr><tr><td>Puerta superpuesta / a media / interior</td><td>Montaje angular / intermedio (gemelo) / enrasado</td></tr><tr><td>Balda</td><td>Estante, entrepaño</td></tr><tr><td>Nº de artículo</td><td>Cat. No.</td></tr><tr><td>Unidad de venta</td><td>Empaque</td></tr></table>`}
function hCat(){return `<p style="margin-top:0">${visorA('Abrir el catálogo de Häfele (visor de hafele.es)')}</p><p class="ayu">Las páginas se citan como <b>FF capítulo.página</b> (por ejemplo, FF 4.17 = capítulo 4, página 17). Empieza por el índice de cada capítulo y usa el buscador del visor con palabras del catálogo (mira el vocabulario). En cada ficha, lee la tabla entera: el Nº de artículo depende de la medida, el acabado y la versión.</p>`}

/* --- la hoja de pedido --- */
function pJuego(){const F=G.F,L=G.C.lineas,M=G.C.mob;
  let h=`<h2>Hoja de pedido <span class="ayu">(${L.length} líneas · ${L.length*3} casillas)</span></h2>${REV?'<div class="msg info">Revisión del profesor: no se guarda ni cuenta como intento. <button class="sec" data-a="autofill">Autocompletar con la solución</button></div>':''}
  <p class="ins">${TIPO_MOB[M.tipo]} de estilo ${M.estilo.toLowerCase()} y calidad ${M.calidad.toLowerCase()}. Busca cada herraje en el ${visorA('catálogo de Häfele')} y escribe su Nº de artículo, la cantidad y la unidad. Mira los planos: los números en círculo son las líneas.</p>${herramientas()}${msg()}<div class="lineas">`;
  L.forEach(l=>h+=itemLinea(l,F));h+='</div>';
  const n=L.length*3,ok=L.reduce((s,l)=>s+CAMPOS.filter(c=>F.est['l'+l.n+':'+c]==='ok').length,0);
  h+=`<div class="barra"><button class="sec" data-a="comprobar">Comprobar</button><button class="pri" data-a="entregar">Entregar el pedido</button><span class="ayu">Nota ${coma(nota())} · Nº de artículo encontrados solo ${rProp()} de ${L.length} (mínimo ${Math.ceil(L.length/2)}) · falladas ${nFallos()} · pistas ${nPistas()}</span></div>`;
  if(!REV)h+=`<div class="aviso" style="margin-top:12px"><b>La partida se guarda sola en este ordenador.</b> ¿Vas a seguir en otro? <button class="ter" data-a="gguarda">Guardar en un archivo</button></div>`;
  return h}
function itemLinea(l,F){const id='l'+l.n,v=F.resp[id]||{},cl=c=>{const e=F.est[id+':'+c];return e==='ok'?'cok':e==='mal'?'cmal':''};
  const fam=art(l.ids[0]).nombre.split(',')[0];
  return `<div class="item ${estLinea(l)}${G.zAct===id?' act':''}" data-id="${id}"><div class="cab"><span><span class="n">${l.n}.</span> <span class="tt">${l.tit}</span>${l.lam?` <button class="sec" style="padding:1px 7px" data-a="verl" data-v="${l.n}">Ver en la lámina ${l.lam}</button>`:''}</span><button class="bpis" data-a="pista" data-v="${id}" ${F.pistas[id]?'disabled':''}>Pista</button></div><div class="desc">${l.desc}</div>
  <div class="campos"><div><label>Nº de artículo</label><input class="txt ref ${cl('ref')}" data-id="${id}" data-c="ref" value="${esc(v.ref||'')}" autocomplete="off" placeholder="000.00.000" style="width:120px"></div><div><label>Cantidad</label><input class="num ${cl('cant')}" style="width:70px" data-id="${id}" data-c="cant" inputmode="numeric" value="${esc(v.cant||'')}"></div><div><label>Unidad</label><select class="sel ${cl('ud')}" data-id="${id}" data-c="ud"><option value="">—</option>${UNIDADES.map(u=>`<option ${v.ud===u?'selected':''}>${u}</option>`).join('')}</select></div></div>
  ${F.pistas[id]?`<div class="pista">💡 Está en la página <b>${l.ff}</b> del catálogo: «${esc(fam)}». Lee la tabla para elegir la medida y la versión.</div>`:''}</div>`}

/* --- comprobar, pista y entregar --- */
function comprobar(){const F=G.F,L=G.C.lineas;let nuevas=0,mal=0,bien=0,vac=0;
  L.forEach(l=>{const id='l'+l.n,v=F.resp[id]||{};CAMPOS.forEach(c=>{const k=id+':'+c,x=v[c];if(x==null||x===''){vac++;F.est[k]=undefined;return}
    if(okCampo(l,c,x)){F.est[k]='ok';bien++}else{F.est[k]='mal';mal++;if(!F.fallo[k]){F.fallo[k]=1;nuevas++}}})});
  F.comp++;
  G.msg=mal?[`${bien} casillas bien y ${mal} mal${vac?` (${vac} sin rellenar)`:''}.${nuevas?` ${nuevas>1?nuevas+' casillas nuevas dejan':'1 casilla nueva deja'} de puntuar.`:''} Corrige las rojas: hay que tenerlas bien para aprender, aunque ya no sumen.`,'mal']:[vac?`Todo lo que has rellenado está bien (${bien} casillas). Faltan ${vac}.`:'¡Todo correcto! Ya puedes entregar el pedido.','bien'];
  pinta()}
function pista(id){const F=G.F;if(F.pistas[id])return;if(!confirm('La pista te dice en qué página del catálogo está el artículo. El Nº de artículo de esta línea dejará de puntuar y no contará para el mínimo de artículos encontrados por ti. ¿La quieres?'))return;F.pistas[id]=1;pinta()}
function entregar(){const L=G.C.lineas,ok=L.filter(lineaOk).length;if(ok<L.length&&!confirm(`Tienes ${ok} de ${L.length} líneas completas y correctas. Lo que no esté bien no puntúa. ¿Entregas el pedido?`))return;
  L.forEach(l=>CAMPOS.forEach(c=>{const k='l'+l.n+':'+c;if(!okCampo(l,c,(G.F.resp['l'+l.n]||{})[c]))G.F.fallo[k]=G.F.fallo[k]||1}));
  G.msg=null;G.fase='fin';pinta();emitir()}
function autofill(){G.C.lineas.forEach(l=>{G.F.resp['l'+l.n]={ref:l.refs[0],cant:String(l.cant),ud:l.ud}});G.msg=['Pedido autocompletado con la solución (revisión).','info'];pinta()}

/* ======================================================================
   GUARDADO DE PARTIDA (navegador + archivo firmado)
   ====================================================================== */
async function partidaTxt(){const o={v:3,n:G.nombre,s:G.sem,z:G.vez,c:centro(),F:G.F,el:Date.now()-G.t0},j=JSON.stringify(o);return b64(j)+'.'+(await sha(SECRETO+'|partida|'+normal(o.n)+'|'+j)).slice(0,16)}
let tAuto=0;function autoGuarda(){if(REV||!G||!G.nombre||!G.C)return;clearTimeout(tAuto);tAuto=setTimeout(async()=>{if(G.fase==='juego')ls.set(claveP(G.nombre),await partidaTxt());else if(G.fase==='fin')ls.del(claveP(G.nombre))},300)}
async function guardaArchivo(){const t=await partidaTxt(),nom='Partida_herrajes_'+normal(G.nombre).toLowerCase().replace(/ /g,'_')+'.txt',blob=new Blob([t],{type:'text/plain'}),dl=await dlP;
  try{if(dl)await dl.save({filename:nom,data:blob});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;a.click()}toast('Partida guardada en '+nom+'. Llévate el archivo para seguir en otro ordenador.')}catch(e){}}
async function cargaPartida(txt){try{const [b,fi]=txt.trim().split('.'),j=d64(b),o=JSON.parse(j);if(o.v!==3||(await sha(SECRETO+'|partida|'+normal(o.n)+'|'+j)).slice(0,16)!==fi)throw 0;
    REV=false;empieza(o.n,o.s,o.z);G.F=o.F;G.t0=Date.now()-o.el;pinta();toast('Partida recuperada.');return true}
  catch(e){G=nuevo();G.msg=['Eso no es una partida válida de esta versión del juego.','mal'];pinta();return false}}

/* ======================================================================
   CERTIFICADO
   Código: 4-nota×100-Nº de artículo encontrados solo-líneas-casillas falladas-pistas-semilla-intento-minutos-fecha-FIRMA
   ====================================================================== */
async function emitir(){const d=new Date(),f=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}`,mins=Math.max(1,Math.round((Date.now()-G.t0)/60000));
  const nf=nota(),datos=`4-${Math.round(nf*100)}-${rProp()}-${G.C.lineas.length}-${nFallos()}-${nPistas()}-${G.sem}-${G.vez}-${mins}-${f}`;
  const cod=REV?'REVISIÓN DEL PROFESOR · SIN VALIDEZ':`${datos}-${await firma(G.nombre,datos)}`;
  if(!REV){const k=claveH(G.nombre);let H=[];try{H=JSON.parse(ls.get(k)||'[]')}catch(e){}H=H.filter(r=>r.v!==G.vez);H.push({v:G.vez,n:nf,m:mins,f:`${pad(d.getDate())}/${pad(d.getMonth()+1)}`});ls.set(k,JSON.stringify(H));G.hist=H}
  const im1=await svgImg(isoSVG(G.C)),im2=await svgImg(laminaSVG(G.C,0,{fecha:hoy(),centro:centro()}).replace(/<image[^>]*\/>/,''));
  G.cert={cod,mins,nf,ap:aptoAhora(),pags:[pagina1(d,cod,mins,nf,im1,im2).toDataURL('image/jpeg',.9),pagina2(cod).toDataURL('image/jpeg',.9)]};pinta()}
function pagina1(d,cod,mins,nf,im1,im2){const [C,x]=lienzoBase(),ap=aptoAhora(),L=G.C.lineas,N=L.length*3,rp=rProp();cabecera(x,'Certificado · 1º CFGS Diseño y Amueblamiento · Herrajes con el catálogo de Häfele');
  tx(x,G.nombre,50,170,`600 42px ${FB}`);tx(x,`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}h · ${mins} min · intento ${G.vez}`,50,206,`500 23px ${FB}`,'#475569');

  const dato=(a,e,v)=>{tx(x,e,a,262,`500 21px ${FB}`,'#475569');tx(x,v,a,306,`600 38px ${FM}`)};
  dato(50,'Nota',coma(nf));dato(270,'Artículos encontrados solo',`${rp} de ${L.length}`);dato(620,'Casillas falladas',String(nFallos()));dato(860,'Pistas',String(nPistas()));
  tx(x,'Cada línea: Nº de artículo 60 %, cantidad 30 %, unidad 10 %. No puntúa lo fallado ni el Nº de artículo con pista.',50,356,`500 19px ${FB}`,'#475569');tx(x,`Apto: 5 de nota y al menos ${Math.ceil(L.length/2)} Nº de artículo encontrados solo (sin pista y sin fallo).`,50,382,`500 19px ${FB}`,'#475569');
  {const cx=1420,cy=232,R=86,oro=ap?'#C79A1E':'#B9C2BD';x.save();if(ap){for(const sd of[-1,1])for(let i=0;i<10;i++){const a=Math.PI/2+sd*(.3+i*.265),px=cx+(R+13)*Math.cos(a),py=cy+(R+13)*Math.sin(a);for(const tl of[-.55,.55]){x.save();x.translate(px,py);x.rotate(a-sd*Math.PI/2+tl*sd);x.beginPath();x.ellipse(0,0,18,6.6,0,0,7);x.fillStyle=tl<0?'#D9B23A':'#B88A12';x.fill();x.restore()}}}
    x.beginPath();x.arc(cx,cy,R-8,0,7);x.fillStyle=ap?'#FFF8E1':'#F1F3F0';x.fill();x.lineWidth=3;x.strokeStyle=oro;x.stroke();x.restore();tx(x,'NOTA',cx,cy-34,`600 18px ${FB}`,'#475569','center');tx(x,coma(nf),cx,cy+24,`700 54px ${FM}`,'#1e293b','center');
    tx(x,ap?'APTO — PEDIDO VALIDADO':'TODAVÍA NO APTO',cx,cy+R+50,`700 24px ${FD}`,ap?'#8A6A0A':'#8A1A0A','center');tx(x,ap?'PARA COMPRAS Y TALLER':nf<5?'Hace falta un 5. Se puede repetir.':'Faltan Nº de artículo encontrados solo.',cx,cy+R+76,`600 19px ${FB}`,ap?'#8A6A0A':'#475569','center')}
  const M=G.C.mob;let y=440;tx(x,'Resumen del encargo',50,y,`600 26px ${FB}`);y+=36;
  const lin=t=>{tx(x,t,50,y,`500 20px ${FB}`);y+=28};
  lin(`${TIPO_MOB[M.tipo]} · estilo ${M.estilo.toLowerCase()} · calidad ${M.calidad.toLowerCase()} · ${M.mods.length} ${M.mods.length>1?'módulos':'módulo'}${M.mont?' · '+MONT[M.mont].n:''}`);
  lin(`Casco de ${M.E} mm${M.fmat?` · frentes de ${MAT[M.fmat][0][0].toLowerCase()+MAT[M.fmat][0].slice(1)} de ${M.ef} mm`:''} · zócalo ${M.Z} mm`);
  lin(`Hoja de pedido: ${L.length} líneas · ${L.filter(lineaOk).length} completas y correctas`);
  if(im1){const bw=600,bh=420,bx=50,by=y+20,k=Math.min(bw/im1.width,bh/im1.height);x.drawImage(im1,bx,by,im1.width*k,im1.height*k)}
  if(im2){const bw=900,bh=470,bx=734,by=660,k=Math.min(bw/im2.width,bh/im2.height);x.strokeStyle='#cbd5e1';x.lineWidth=2;x.strokeRect(bx,by,im2.width*k,im2.height*k);x.drawImage(im2,bx,by,im2.width*k,im2.height*k)}
  {const H=(G.hist||[]).slice(-3);if(H.length){tx(x,'Intentos en este navegador',1634,470,`600 20px ${FB}`,'#1e293b','right');H.forEach((r,i)=>tx(x,`${r.v} · ${r.f} · ${coma(r.n)} · ${r.m} min`,1634,498+i*26,`500 18px ${FM}`,'#475569','right'))}}
  pie(x,cod,1);return C}
function pagina2(cod){const [C,x]=lienzoBase();cabecera(x,`Hoja de pedido de ${G.nombre} · intento ${G.vez}`);let y=160;const L=G.C.lineas,F=G.F;
  const cols=[['Nº',50],['Herraje',100],['Nº de artículo',820],['Cant.',1010],['Unidad',1100],['Página',1230],['Solución',1634]];cols.forEach(([t,a],i)=>tx(x,t,a,y,`600 19px ${FB}`,'#475569',i===6?'right':'left'));y+=10;x.fillStyle='#1e293b';x.fillRect(50,y,1584,2);y+=30;
  const rh=Math.min(64,Math.floor(900/Math.max(1,L.length)));
  const marca=(l,c,a)=>{const v=valorCasilla(l,c,F);const p=c==='ref'&&F.pistas['l'+l.n]&&!F.fallo['l'+l.n+':ref']&&okCampo(l,c,(F.resp['l'+l.n]||{})[c]);tx(x,v===1?'✓':p?'P':'✗',a,y,`700 20px ${FB}`,v===1?'#15803d':p?'#b45309':'#b91c1c')};
  L.forEach(l=>{const v=F.resp['l'+l.n]||{};tx(x,String(l.n),50,y,`500 18px ${FM}`);
    let t=l.tit;x.font=`600 18px ${FB}`;tx(x,t,100,y,`600 18px ${FB}`);
    let d=art(l.ids[0]).nombre.split(',')[0];x.font=`500 15px ${FB}`;while(x.measureText(d).width>690&&d.length>10)d=d.slice(0,-2);tx(x,d,100,y+22,`500 15px ${FB}`,'#64748b');
    marca(l,'ref',795);tx(x,v.ref||'—',820,y,`600 18px ${FM}`);marca(l,'cant',985);tx(x,v.cant||'—',1010,y,`500 18px ${FM}`);marca(l,'ud',1075);tx(x,v.ud||'—',1100,y,`500 18px ${FB}`);tx(x,l.ff,1230,y,`500 17px ${FB}`,'#475569');
    if(!lineaOk(l))tx(x,`${l.refs.join(' / ')} · ${l.cant} ${l.ud}`,1634,y,`500 15px ${FM}`,'#94a3b8','right');y+=rh});
  tx(x,'✓ bien a la primera · P Nº de artículo encontrado con pista (no puntúa) · ✗ fallado o vacío (en gris, la solución).',50,1130,`500 17px ${FB}`,'#475569');pie(x,cod,2);return C}
async function descargar(){const data=pdfDesde(G.cert.pags),nom='Herrajes_'+normal(G.nombre).toLowerCase().replace(/(^| )\w/g,c=>c.toUpperCase()).replace(/ /g,'_')+'.pdf',dl=await dlP;
  if(dl){try{await dl.save({filename:nom,data:new Blob([data],{type:'application/pdf'})});toast('Certificado guardado. Súbelo a la tarea de Classroom.')}catch(e){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));a.download=nom;a.click();toast('Certificado guardado. Súbelo a la tarea de Classroom.')}}
function pFin(){if(!G.cert)return `<h2>Preparando el certificado…</h2>`;const ap=G.cert.ap;
  return `<h2>Certificado ${ap?'· APTO — PEDIDO VALIDADO':'· todavía no apto'}</h2><div class="fila"><button class="pri" data-a="desc">Descargar el certificado (PDF)</button>${REV?'<button class="sec" data-a="prof">Volver al profesorado</button>':'<button class="sec" data-a="otra">Hacer otro intento</button>'}</div>
  <p class="ayu">Sube el PDF a la tarea de Classroom. Código: <span class="mono">${esc(G.cert.cod)}</span></p><div id="cert">${G.cert.pags.map(u=>`<img src="${u}" alt="Página del certificado">`).join('')}</div>`}

/* ======================================================================
   PROFESORADO (#profesor)
   ====================================================================== */
let PFOK=false,PFT='guia',PFMAL=false,PFC='';try{PFOK=ls.get('prof-'+JUEGO)===PFH}catch(e){}
async function pfEntra(){const k=$('#pfk');if(!k)return;const h=await sha('IESVE-prof|'+k.value.trim());if(h===PFH){PFOK=true;PFMAL=false;ls.set('prof-'+JUEGO,PFH)}else PFMAL=true;pinta()}
const fechaCod=s=>`${s.slice(6,8)}/${s.slice(4,6)}/${s.slice(0,4)} ${s.slice(8,10)}:${s.slice(10)}h`;
async function compCert(n,c){const t=String(c).trim().toUpperCase();if(!n.trim())return {ok:false};
  let m=/^4-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d+)-(\d{12})-([0-9A-F]{8})$/.exec(t);
  if(m){if(await firma(n,'4-'+m.slice(1,10).join('-'))!==m[10])return {ok:false};return {ok:true,v:4,nota:coma(m[1]/100),rp:m[2]+' de '+m[3],fal:m[4],pis:m[5],sem:m[6],vez:m[7],min:m[8]+' min',f:fechaCod(m[9]),apto:esApto(m[1]/100,+m[2],+m[3])}}
  return {ok:false}}
function pProf(){if(!PFOK)return `<h2>Acceso del profesorado</h2><p class="ins">Escriba la clave que le ha facilitado el autor.</p><div class="fila"><input class="txt" id="pfk" type="password" autocomplete="off" style="flex:1"><button class="pri" data-a="pfent">Entrar</button></div>${PFMAL?'<div class="msg mal">La clave no es correcta.</div>':''}`;
  const tb=(v,t)=>`<button class="${PFT===v?'pri':'sec'}" data-a="pftab" data-v="${v}" style="padding:5px 10px">${t}</button>`;
  return `<h2>Página del profesorado</h2><div class="fila" style="margin:0 0 12px">${tb('guia','Guía')}${tb('cert','Comprobar certificados')}${tb('sim','Revisar y simular')}${tb('cat','Catálogo')}${tb('cen','Mi centro')}<button class="sec" data-a="pfsal" style="margin-left:auto;padding:5px 10px">Cerrar sesión</button></div>
  ${PFT==='cert'?pCert():PFT==='sim'?pSim():PFT==='cat'?pCat():PFT==='cen'?pCentro():pGuia()}`}
function pGuia(){const cu=centro()?PFURL+'?centro='+encodeURIComponent(centro()):PFURL,li=a=>'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  return `<div class="aviso"><b>Para el alumnado:</b> <span class="mono" style="word-break:break-all">${esc(cu)}</span><br><b>Para usted:</b> el mismo enlace terminado en <span class="mono">#profesor</span>, con la clave. No comparta ni lo uno ni lo otro con el alumnado.</div>
  <h3>Qué es</h3><p class="ins">Juego de una sola página para 1º CFGS de Diseño y Amueblamiento (versión 3, 24/11/2026). Cada partida trae un mueble (cocina, armario, vestidor o salón modular) con sus planos (conjunto e interior con Sistema 32) y la lista de herrajes que lleva, distintos para cada alumno y en cada intento. Para cada herraje, el alumno busca en el catálogo en PDF de Häfele (International 2020, el del visor de hafele.es) el Nº de artículo, la cantidad y la unidad.</p>
  <h3>Qué aprende</h3>${li(['A manejar un catálogo técnico real: capítulos, índice, páginas FF, tablas por medida, acabado y versión.','El vocabulario del fabricante, que no es el del taller (jaladera, corredera, zoclo, gabinete, montaje angular…).','A sacar las cantidades de los planos con los criterios del taller.','Que la cantidad se cuenta en la unidad del catálogo (pieza, par, juego).'])}
  <h3>Nota (como un examen)</h3><p class="ins">Nota = 10 × Σ (0,6·R + 0,3·C + 0,1·U) / número de líneas. R, C y U valen 1 si el Nº de artículo, la cantidad o la unidad están bien a la primera, y 0 si han fallado alguna vez al comprobar, aunque luego se corrijan. Con la pista (página del catálogo), el Nº de artículo de esa línea vale 0. <b>Apto:</b> nota de 5 o más y, además, al menos la mitad de los Nº de artículo encontrados por el alumno sin pista y sin fallo. Pidiendo la pista en todas las líneas se saca un 4. Hay que corregir lo que sale en rojo para entregar el pedido completo, aunque ya no sume.</p>
  <h3>Criterios de taller que aplica</h3>${li(['Bisagras: 2 hasta 900 mm de alto de puerta, 3 hasta 1600 y 4 por encima; una base por bisagra.','Guías: 1 par por cajón, la longitud nominal más larga que cabe en la profundidad interior.','Tiradores: 1 por puerta y 1 por cajón (los cajones interiores del armario no llevan).','Portaestantes: 4 por balda móvil.','Patas: 4 por módulo en el suelo.','Colgadores: 1 izquierdo y 1 derecho por mueble alto.','Tornillos de unión: 2 por unión entre módulos y 4 entre columnas.','Barras: 1 por tramo (la longitud comercial más corta) y 2 soportes por barra. Calidad alta: elevador en un tramo de colgar.'])}
  <h3>Variabilidad</h3><p class="ins">Tipo de mueble, estilo, calidad, medidas, grosores, tipo de puerta, esquema de taladro, altura de la base, zócalo, profundidad, tirador, carga de las baldas… Cada combinación de nombre, intento y centro da un encargo distinto, con 6 a 10 líneas de pedido.</p>
  <h3>Limitaciones</h3><p class="ins">No hay servidor: partidas e intentos se guardan en el navegador. El código del certificado detecta cambios en nombre y nota, pero el archivo es público: si cuenta para la evaluación, el certificado no debería ser la única prueba. El catálogo es la edición de 2020: alguna referencia puede no estar ya a la venta en la tienda web, pero el juego se resuelve con el catálogo.</p>
  <h3>Autoría</h3><p class="ins">© 2026 Gustavo Hernández Sánchez · I.E.S. Virgen de la Esperanza · Departamento de Madera. CC BY-NC 4.0.</p>`}
function pCert(){const P=G.prof||{n:'',c:'',r:null},r=P.r;let t='';
  if(r&&r.ok){const fila=(a,b)=>`<tr><td>${a}</td><td class="n">${b}</td></tr>`;
    t=`<div class="msg bien">Certificado válido ${r.apto?'· APTO':'· no apto'}</div><table>${fila('Fecha',r.f)}${fila('Nota',r.nota)}${fila('Nº de artículo encontrados solo',r.rp)}${fila('Casillas falladas',r.fal)}${fila('Pistas',r.pis)}${fila('Intento',r.vez)}${fila('Tiempo',r.min)}${fila('Semilla',r.sem)}</table><p class="ayu">Con el nombre y la semilla puede ver su encargo y la solución en «Revisar y simular».</p>`}
  else if(r)t='<div class="msg mal">El código no corresponde a ese nombre o está mal copiado.</div>';
  return `<p class="ins">Copie el nombre tal como aparece en el certificado y su código.</p><label class="ayu">Nombre y apellidos</label><input class="txt" id="pn" style="width:100%" value="${esc(P.n)}"><label class="ayu">Código</label><input class="txt mono" id="pc" style="width:100%" value="${esc(P.c)}"><div class="fila" style="margin-top:8px"><button class="pri" data-a="compC">Comprobar</button></div>${t}`}
function pSim(){const S=G.sim||{n:'',s:''};let t='';
  if(S.C){const C=S.C,M=C.mob;t=`<h3>Encargo</h3><p class="ins">${TIPO_MOB[M.tipo]} · ${M.estilo} · ${M.calidad}${M.mont?` · ${MONT[M.mont].n}`:''} · casco ${M.E} mm · zócalo ${M.Z} mm · profundidad interior ${M.prof} mm</p>
    <div class="fila"><button class="sec" data-a="simir">Jugar este caso (revisión)</button></div>
    <h3>Solución</h3><table><tr><th>Nº</th><th>Línea</th><th>Nº de artículo</th><th class="n">Cant.</th><th>Ud.</th><th>Página</th></tr>${C.lineas.map(l=>`<tr><td>${l.n}</td><td><b>${l.tit}</b><br><span class="ayu">${esc(l.calc)}</span></td><td class="mono">${l.refs.join('<br>')}</td><td class="n">${l.cant}</td><td>${l.ud}</td><td>${l.ff}</td></tr>`).join('')}</table>`}
  return `<p class="ins">Escriba un nombre y una semilla (la del certificado) o genere un caso aleatorio para ver la solución y jugarlo en revisión.</p><div class="fila"><input class="txt" id="sn" placeholder="Nombre y apellidos" value="${esc(S.n)}" style="flex:2"><input class="txt mono" id="ss" placeholder="Semilla" value="${esc(S.s)}" style="width:120px"><button class="pri" data-a="simver">Ver</button><button class="sec" data-a="simrnd">Caso aleatorio</button></div>${t}`}
function pCat(){const D=CATALOGO_DB;
  return `<p class="ins">Catálogo: <b>${esc(D.catalogo)}</b> (${visorA('visor de hafele.es')}). ${D.articulos.length} referencias, cada una comprobada en su página del PDF el ${D.verificado.split('-').reverse().join('/')}.</p><table><tr><th>Nº de artículo</th><th>Artículo</th><th>Unidad</th><th>Página</th></tr>${D.articulos.map(a=>`<tr><td class="mono">${a.ref}</td><td>${esc(a.nombre)}</td><td>${a.ud}</td><td>${a.ff}</td></tr>`).join('')}</table>`}
function pCentro(){const u=PFC?PFURL+'?centro='+encodeURIComponent(PFC):'';return `<p class="ins">Escriba el nombre de su centro. Con ese enlace, el cajetín de los planos y el certificado muestran su centro; la autoría no cambia. El encargo también depende del centro.</p><div class="fila"><input class="txt" id="pfc" maxlength="60" value="${esc(PFC)}" placeholder="Por ejemplo: IES Sierra Luna" style="flex:1"><button class="pri" data-a="pfcen">Crear enlace</button></div>${u?`<div class="aviso" style="margin-top:10px"><span class="mono" style="word-break:break-all">${esc(u)}</span> <button class="sec" data-a="pfcop">Copiar</button></div>`:''}`}

/* ======================================================================
   EVENTOS
   ====================================================================== */
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==='empezar'){const n=$('#nom').value;if(n.trim().split(/\s+/).length<2){G.msg=['Escribe tu nombre y al menos un apellido.','mal'];G.nombre=n;pinta();return}REV=false;empieza(n)}
  else if(a==='seguir'){const n=($('#nom').value||'').trim();const t=n?ls.get(claveP(n)):null;if(t)cargaPartida(t);else{G.msg=['No hay ninguna partida guardada con ese nombre en este navegador. Puedes cargarla desde un archivo.','mal'];G.nombre=n;pinta()}}
  else if(a==='cargar')$('#fpar').click();
  else if(a==='gguarda')guardaArchivo();
  else if(a==='lam'){G.lam=+v;G.vb=null;pintaVisor()}
  else if(a==='zoom'){if(+v===0){G.vb=null;aplicaVb()}else zoom(+v)}
  else if(a==='herr'){G.herr=v;pinta()}
  else if(a==='verl')irLinea(+v);
  else if(a==='pista')pista(v);
  else if(a==='comprobar')comprobar();
  else if(a==='entregar')entregar();
  else if(a==='autofill'&&REV)autofill();
  else if(a==='desc')descargar();
  else if(a==='otra'){const n=G.nombre;G=nuevo();G.nombre=n;pinta()}
  else if(a==='prof'){G=nuevo();G.fase='prof';REV=false;pinta()}
  else if(a==='pfent')pfEntra();
  else if(!PFOK)return;
  else if(a==='pftab'){PFT=v;pinta()}
  else if(a==='pfsal'){PFOK=false;ls.del('prof-'+JUEGO);pinta()}
  else if(a==='compC'){G.prof={n:$('#pn').value,c:$('#pc').value};G.prof.r=await compCert(G.prof.n,G.prof.c);pinta()}
  else if(a==='simver'||a==='simrnd'){let n=$('#sn').value.trim()||'Alumno de prueba',s=+$('#ss').value;if(a==='simrnd'||!s)s=1+Math.floor(Math.random()*999998);G.sim={n,s:String(s),C:caso(n,s,centro())};pinta()}
  else if(a==='simir'){const S=G.sim;REV=true;empieza(S.n,+S.s,0);G.sim=S;G.msg=null;pinta()}
  else if(a==='pfcen'){PFC=($('#pfc').value||'').replace(/[<>&"'`]/g,'').replace(/\s+/g,' ').trim();pinta()}
  else if(a==='pfcop'){try{await navigator.clipboard.writeText(PFURL+'?centro='+encodeURIComponent(PFC));el.textContent='Copiado'}catch(_){}}});
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.c||G.fase!=='juego')return;const id=t.dataset.id,c=t.dataset.c,F=G.F;
  F.resp[id]=F.resp[id]||{};F.resp[id][c]=t.value;const k=id+':'+c;if(F.est[k]!==undefined){F.est[k]=undefined;t.classList.remove('cok','cmal')}autoGuarda()});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.c==='ud'&&G.fase==='juego'){const F=G.F;F.resp[t.dataset.id]=F.resp[t.dataset.id]||{};F.resp[t.dataset.id].ud=t.value;const k=t.dataset.id+':ud';if(F.est[k]!==undefined){F.est[k]=undefined;t.classList.remove('cok','cmal')}autoGuarda()}});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;if(t.id==='pfk')pfEntra();if(t.id==='nom'){const b=$('[data-a="empezar"]');if(b)b.click()}});
$('#fpar').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(f)cargaPartida(await f.text())});
document.addEventListener('focusin',e=>{const it=e.target.closest&&e.target.closest('.item[data-id^="l"]');if(it&&G.fase==='juego'&&G.zAct!==it.dataset.id){const l=G.C.lineas.find(l=>'l'+l.n===it.dataset.id);if(!l)return;G.zAct=it.dataset.id;if(l.lam&&G.lam!==l.lam-1){G.lam=l.lam-1;G.vb=null;pintaVisor()}else marcasZonas();$$('.item').forEach(x=>x.classList.toggle('act',x.dataset.id===G.zAct))}});
G=nuevo();pinta();
function vistaProfesor(){if(location.hash==='#profesor'&&(G.fase==='inicio'||G.fase==='prof')){G.fase='prof';pinta()}}
addEventListener('hashchange',vistaProfesor);vistaProfesor();

</script>
