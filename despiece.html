<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Del plano al despiece</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Mesa de trabajo del taller: el plano en papel a un lado y la nota de madera al otro. Misma familia visual que Turno en la escuadradora. */
:root{
  color-scheme:dark;
  --bg:#1C2B28; --panel:#26383A; --panel2:#30464A; --ink:#EEF3EC; --ink2:#AFC0B9; --line:#47605F;
  --am:#F2C230; --ro:#EE6049; --ve:#63D192; --az:#8DB6FF;
  --papel:#F4F1E8; --tinta:#1D2A2C; --trazo:#59686A;
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow","Segoe UI",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--am);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,60fr) minmax(0,40fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "plano der";gap:10px}
#app.ancho{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "der"}
#app.ancho #plano{display:none}
header{grid-area:top;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
h1{margin:0;font:700 26px/1 var(--f-disp);letter-spacing:.01em}
#etapas{display:flex;gap:3px;flex:1 1 auto;min-width:0;overflow-x:auto}
#etapas span{padding:3px 9px;font:600 15px var(--f-disp);letter-spacing:.03em;color:var(--ink2);white-space:nowrap;border-bottom:2px solid var(--line)}
#etapas span.hecho{color:var(--ve);border-color:var(--ve)}
#etapas span.ya{color:var(--ink);border-color:var(--am)}
.nota{display:flex;align-items:baseline;gap:7px;margin-left:auto;color:var(--ink2);font-size:13px}
.nota b{font:600 22px var(--f-num);color:var(--ink)}
#plano{grid-area:plano;background:var(--panel);border:1px solid var(--line);min-height:0;display:flex;flex-direction:column;overflow:auto}
#hoja{background:#fff;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px;cursor:grab;touch-action:none}
#tabs{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--line)}
#tabs button{border:1px solid var(--line);background:var(--panel2);padding:3px 9px;font:600 15px var(--f-disp);letter-spacing:.02em}
#tabs button.si{background:var(--am);color:#1C2B28;border-color:var(--am)}
#tabs .zoom{margin-left:auto;display:flex;gap:3px}
#tabs .zoom button{min-width:32px}
#hoja svg{display:block;width:100%;height:100%;max-height:100%}
#tresd{flex:1 1 auto;min-height:320px;position:relative;cursor:grab}
#tresd canvas{display:block;width:100%;height:100%}
#datos{padding:8px 10px 10px;border-top:1px solid var(--line);flex:0 0 auto}
#datos h3,.tit3{margin:0 0 5px;font:600 15px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel2);padding:2px 7px;font-size:13px;line-height:1.3;text-align:left}
.chip b{font:600 13px var(--f-num);color:var(--am);margin-left:5px}
button.chip:hover{border-color:var(--am)}
.chip.ro{cursor:default}
.reglas{margin:7px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2);display:grid;gap:1px}
#der{grid-area:der;background:var(--panel);border:1px solid var(--line);overflow:auto;min-height:0;padding:12px 14px 14px;min-width:0}
h2{margin:0 0 6px;font:700 26px/1.1 var(--f-disp);text-wrap:balance}
p.ins{margin:0 0 10px;color:var(--ink2)}
p.ins b{color:var(--ink)}
.msg{margin:0 0 10px;padding:7px 10px;border:1px solid var(--line);background:#101A18;font-weight:500}
.msg.mal{border-color:var(--ro);color:#FFD4CB}
.msg.bien{border-color:var(--ve);color:#CFF3DE}
.pri{border:0;background:var(--am);color:#1C2B28;font-weight:600;padding:9px 16px}
.pri:disabled{opacity:.42;cursor:not-allowed}
.sec{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;font-weight:500}
.fila{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input.txt{width:100%;max-width:360px;padding:8px 9px;background:#101A18;border:1px solid var(--line);margin:0 0 10px;display:block}
label.et{display:block;margin:0 0 3px;font-size:13px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 13.5px var(--f-disp);letter-spacing:.03em;text-align:left;color:var(--ink2);padding:2px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:1px 5px;border-bottom:1px solid rgba(71,96,95,.55)}
.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
th.n{font-family:var(--f-disp)}
.banda{background:var(--panel2);padding:3px 6px;font:600 15px var(--f-disp);letter-spacing:.04em;margin-top:8px}
.tw{overflow-x:auto}
.tw table td:nth-child(3){white-space:nowrap}/*nowrap-mat*/
.cel{width:100%;min-width:40px;border:1px solid var(--line);background:#101A18;padding:1px 4px;text-align:right;font:500 13.5px var(--f-num)}
.cel.ok{border-color:var(--ve);color:var(--ve);background:#16302A}
.cel.mal{border-color:var(--ro);color:#FFD4CB;background:#3a201b}
tr.resal td:first-child,tr.resal td:nth-child(2){color:var(--am)}
.lista{display:grid;gap:3px}
.lin{display:grid;grid-template-columns:22px minmax(0,1fr) 62px minmax(0,190px);gap:6px;align-items:center;padding:2px 0;border-bottom:1px solid rgba(71,96,95,.55)}
.lin input[type=number],.lin select,.ej input,.lin input[type=number]{width:100%}
.lin select{width:100%;font-size:13px}
.lin .cab{font:600 13.5px var(--f-disp);color:var(--ink2)}
.err{outline:1px solid var(--ro)}
.u input{width:58px;text-align:right;font-family:var(--f-num)}
.rep{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.rep li{padding:5px 8px;border:1px solid var(--ro);background:#2b1f1c;font-size:14px}
.rep b{color:#FFD4CB}
.av{font:500 13px var(--f-num);color:var(--ink2)}
.cert{display:block;width:100%;max-width:640px;border:1px solid var(--line);margin:0 0 8px}
.cod{display:block;font:600 14px var(--f-num);margin-bottom:8px;word-break:break-all}
.res2{font-weight:600;margin:10px 0}
.ayb{flex-wrap:wrap;align-items:center;margin:0 0 8px}
.ayu{font-size:13px;color:var(--ink2);margin:6px 0}
.pas{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.cuenta{font:500 16px/1.4 var(--f-num);background:#101A18;border:1px solid var(--line);padding:7px 9px;margin:0 0 9px}
.cuenta b{color:var(--am)}
.por{border:1px solid var(--am);background:#101A18;padding:8px 11px;margin:0 0 9px;line-height:1.38}
.por b{color:var(--am);font:600 15px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
@media (max-width:900px){
  html,body{height:auto}
  #app,#app.ancho{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "plano" "der"}
  #hoja{min-height:360px}#tresd{min-height:340px}
  .lin{grid-template-columns:22px minmax(0,1fr) 54px}.lin select{grid-column:2/4}
}
</style>
<div id="app">

  <section id="plano"><div id="tabs"></div><div id="hoja"></div><div id="tresd" hidden></div></section>
  <section id="der"></section>
</div>

  const tam=()=>{const w=box.clientWidth,h=box.clientHeight;if(w&&h){R.setSize(w,h,false);R.domElement.style.width='100%';R.domElement.style.height='100%';C.aspect=w/h;C.updateProjectionMatrix()}};
  let arr=null;R.domElement.addEventListener('pointerdown',e=>{arr=[e.clientX,e.clientY]});addEventListener('pointerup',()=>arr=null);addEventListener('pointermove',e=>{if(!arr)return;st.th-=(e.clientX-arr[0])*.008;st.ph=Math.max(.05,Math.min(1.2,st.ph+(e.clientY-arr[1])*.006));arr=[e.clientX,e.clientY]});
  const bucle=()=>{if(!st.vivo)return;st.raf=requestAnimationFrame(bucle);tam();cam();const t=performance.now();st.anim=st.anim.filter(a=>a(t));R.render(S,C)};bucle();TR={S,st,R,parar(){st.vivo=false;cancelAnimationFrame(st.raf);R.dispose()}};return true}
function piezas3D(){const v=id=>{const x=G.med[id],l=linea(id);return {L:l.swap?x.A.v:x.L.v,A:l.swap?x.L.v:x.A.v,Gr:x.Gr?x.Gr.v:null}};const c=G.cot,a=c.A,f=c.F,h=c.H,g=c.G,P=c.P,Ai=a-2*g,hp=h-3*g-c.hc,wp=(a-2*g-3*c.j)/2,dh=hp-2*c.j,L=[];
  const mal=id=>(G.informe.err||[]).some(e=>e.id===id);
  /* add: centro, ejes en los que van largo y ancho, grueso en el tercero */
  const add=(id,cx,cy,cz,ejL,ejA,gr,col,grp)=>{const q=v(id),s={x:0,y:0,z:0};s[ejL]=q.L;s[ejA]=q.A;const e3='xyz'.split('').find(k=>k!==ejL&&k!==ejA);s[e3]=gr!==null?gr:q.Gr;L.push({id,cx,cy,cz,sx:s.x,sy:s.y,sz:s.z,col:mal(id)?MAL:col,grp})};
  const xp=a/2-c.rp-c.pa/2,zp=f/2-c.rp-c.pa/2;for(const sx of[-1,1])for(const sz of[-1,1])add('pat',sx*xp,P/2,sz*zp,'y','x',null,PINO);
  const zt=f/2-c.rp-c.off-c.gp/2,xt=a/2-c.rp-c.off-c.gp/2;for(const s2 of[-1,1])add('tla',0,P-c.ap/2,s2*zt,'x','y',null,PINO);for(const s2 of[-1,1])add('tco',s2*xt,P-c.ap/2,0,'z','y',null,PINO);
  add('tec',0,P+g/2,0,'x','z',g,DM);for(const s2 of[-1,1])add('cos',s2*(a/2-g/2),P+h/2,0,'y','z',g,DM);add('tec',0,P+h-g/2,0,'x','z',g,DM);
  add('res',0,P+h/2,-f/2+c.tr+c.grP/2,'x','y',c.grP,CUAR);const yd=P+h-g-c.hc-g/2;add('div',0,yd,f/2-(f-c.tr-c.grP)/2,'x','z',g,DM);
  const LC=f-c.tr-c.grP-g-c.mt,zf=f/2-g,ycb=yd+g/2+5,yc=ycb+c.ac/2,xc=Ai/2-c.gu-c.gc/2;
  for(const s2 of[-1,1])add('lat',s2*xc,yc,zf-LC/2,'z','y',c.gc,DM,'caj');const yc2=ycb+c.fb+c.grP+(c.ac-c.fb-c.grP)/2;add('ftr',0,yc2,zf-c.gc/2,'x','y',c.gc,DM,'caj');add('ftr',0,yc2,zf-LC+c.gc/2,'x','y',c.gc,DM,'caj');add('fon',0,ycb+c.fb+c.grP/2,zf-LC/2,'z','x',c.grP,CUAR,'caj');add('fre',0,P+h-g-c.hc/2,f/2-g/2,'x','y',g,DM,'caj');
  const ydb=P+g+c.j,yC=ydb+dh/2,z=f/2-c.gb/2;for(const[s2,grp] of[[-1,null],[1,'pue']]){const xd=s2*(c.j/2+wp/2);for(const m of[-1,1])add('lar',xd+m*(wp/2-c.b/2),yC,z,'y','x',null,PINO,grp);for(const m of[-1,1])add('tpu',xd,yC+m*(dh/2-c.b/2),z,'x','y',null,PINO,grp);add('cua',xd,yC,z,'y','x',c.grP,CUAR,grp)}
  {const zc=-f/2+c.tr+c.grP+(f-c.tr-c.grP-c.rt)/2,w=(Ai-g)/2;if(linea('dvi'))add('dvi',0,P+g+hp/2,zc,'y','z',g,DM);
   if(linea('bal'))for(const[x,n]of(c.dv?[[-(g/2+w/2),c.nbi],[g/2+w/2,c.nbd]]:[[0,c.nb]]))for(let i=1;i<=n;i++)add('bal',x,P+g+hp*i/(n+1),zc,'x','z',g,DM);
   add('enc',0,P+h+c.ge/2,c.vu/2,'x','z',c.ge,PINO)}
  return L}
function montar(){G.fase='montaje';G.msg=null;const err=[];G.informe={err,n:0,tot:0,fin:false};pinta();
  const ok=iniciaTres();const L=piezas3D();G.informe.tot=L.length;pinta();
  const acaba=()=>{G.informe.fin=true;pinta()};if(!ok){const b=$('#tresd');b.innerHTML='<p class="ins" style="padding:14px">Este equipo no puede mostrar el mueble en 3D. El resultado del montaje aparece al lado.</p>';acaba();return}
  const {S,st}=TR,c=G.cot,grp={caj:new THREE.Group(),pue:new THREE.Group()},T=c.P+c.H,pz=c.F/2,px=(c.j/2+((c.A-2*c.G-3*c.j)/2));grp.pue.position.set(px,0,pz);S.add(grp.caj,grp.pue);st.dist=Math.max(c.A,T)*7.3;st.cy=T*.5;
  const lento=window.__rapido?0:1;L.forEach((p,i)=>{const ge=new THREE.BoxGeometry(p.sx,p.sy,p.sz),m=new THREE.Mesh(ge,new THREE.MeshStandardMaterial({color:p.col,roughness:.72}));m.castShadow=m.receiveShadow=true;m.add(new THREE.LineSegments(new THREE.EdgesGeometry(ge),new THREE.LineBasicMaterial({color:CANTO,transparent:true,opacity:.55})));
    const ox=p.grp==='pue'?-px:0,oz=p.grp==='pue'?-pz:0,padre=p.grp?grp[p.grp]:S;m.position.set(p.cx+ox,p.cy+700,p.cz+oz);m.visible=false;padre.add(m);
    setTimeout(()=>{if(G.fase!=='montaje')return;m.visible=true;const t0=performance.now();st.anim.push(t=>{const k=Math.min(1,(t-t0)/(lento?260:1)),e=1-Math.pow(1-k,3);m.position.y=p.cy+700*(1-e);return k<1});G.informe.n=i+1;const a=$('#der .av');if(a)a.textContent=`${i+1} de ${L.length} piezas`},i*170*lento)});
  setTimeout(()=>{if(G.fase!=='montaje')return;const t0=performance.now();st.anim.push(t=>{const k=Math.min(1,(t-t0)/(lento?900:1)),e=1-Math.pow(1-k,3);grp.caj.position.z=210*e;grp.pue.rotation.y=1.7*e;return k<1});acaba()},L.length*170*lento+350*lento)}

document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==='empezar'){const n=$('#nom').value;if(n.trim().split(/\s+/).length<2){G.msg=['Escribe tu nombre y al menos un apellido.','mal'];pinta();return}empieza(n)}
  else if(a==='ejemplo'){G.fase='ejemplo';G.ejem=0;G.lam=HOJA[PASOS_EJ[0].id]-1;G.vb=null;pinta()}
  else if(a==='ejS'||a==='ejA'){G.ejem+=a==='ejS'?1:-1;G.lam=HOJA[PASOS_EJ[G.ejem].id]-1;G.vb=null;pinta()}
  else if(a==='lam'){G.lam=+v;G.vb=null;$('#tabs').innerHTML=tabsHtml();$('#hoja').innerHTML=plano()}
  else if(a==='zoom'){if(+v===0){G.vb=null;aplicaVb()}else zoom(+v)}
  else if(a==='prof'){G.fase='prof';G.prof={n:'',c:'',r:null};pinta()}
  else if(a==='compC'){const n=$('#pn').value,c=$('#pc').value;G.prof={n,c,r:await compCert(n,c)};pinta()}
  else if(a==='otra'){if(TR){TR.parar();TR=null;$('#tresd').innerHTML=''}G=nuevo();pinta()}
  else if(a==='pz'){const n=G.orden[+v];G.sel[n]=G.sel[n]||{};G.sel[n].on=el.checked;$('#der').innerHTML=pPiezas()}
  else if(a==='compP')compP();
  else if(a==='montar')montar();
  else if(a==='terminar'){if(TR){TR.parar();TR=null;$('#tresd').innerHTML=''}G.fase='fin';G.msg=null;pinta();emitir()}
  else if(a==='desc')descargar();
  else if(a==='ayuda')ayuda();
  else if(a==='ayudaNo'){G.ay=null;replano();ayBoton()}
});

(()=>{const h=$('#hoja');let arr=null;h.addEventListener('wheel',e=>{e.preventDefault();const r=h.getBoundingClientRect();zoom(e.deltaY<0?1.15:.87,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});h.addEventListener('pointerdown',e=>{if(G.vb){arr=[e.clientX,e.clientY];h.setPointerCapture(e.pointerId)}});h.addEventListener('pointermove',e=>{if(!arr||!G.vb)return;const r=h.getBoundingClientRect(),v=G.vb;v[0]=Math.max(0,Math.min(PH-v[2],v[0]-(e.clientX-arr[0])*v[2]/r.width));v[1]=Math.max(0,Math.min(PV-v[3],v[1]-(e.clientY-arr[1])*v[3]/r.height));arr=[e.clientX,e.clientY];aplicaVb()});h.addEventListener('pointerup',()=>arr=null)})();
