<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Del plano al corte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Mesa de trabajo del taller: el plano en papel a un lado y la nota de madera al otro. Misma familia visual que Turno en la escuadradora. */
:root{
  color-scheme:dark;
  --bg:#1C2B28; --panel:#26383A; --panel2:#30464A; --ink:#EEF3EC; --ink2:#AFC0B9; --line:#47605F;
  --am:#F2C230; --ro:#EE6049; --ve:#63D192; --az:#8DB6FF;
  --papel:#F4F1E8; --tinta:#1D2A2C; --trazo:#59686A;
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow","Segoe UI",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--am);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,60fr) minmax(0,40fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "plano der";gap:10px}
#app.ancho{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "der"}
#app.ancho #plano{display:none}
header{grid-area:top;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
h1{margin:0;font:700 26px/1 var(--f-disp);letter-spacing:.01em}
#etapas{display:flex;gap:3px;flex:1 1 auto;min-width:0;overflow-x:auto}
#etapas span{padding:3px 9px;font:600 15px var(--f-disp);letter-spacing:.03em;color:var(--ink2);white-space:nowrap;border-bottom:2px solid var(--line)}
#etapas span.hecho{color:var(--ve);border-color:var(--ve)}
#etapas span.ya{color:var(--ink);border-color:var(--am)}
.nota{display:flex;align-items:baseline;gap:7px;margin-left:auto;color:var(--ink2);font-size:13px}
.nota b{font:600 22px var(--f-num);color:var(--ink)}
#plano{grid-area:plano;background:var(--panel);border:1px solid var(--line);min-height:0;display:flex;flex-direction:column;overflow:auto}
#hoja{background:#fff;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px;cursor:grab;touch-action:none}
#tabs{display:flex;flex-wrap:wrap;gap:3px;align-items:center;padding:5px 6px;border-bottom:1px solid var(--line)}
#tabs button{border:1px solid var(--line);background:var(--panel2);padding:3px 9px;font:600 15px var(--f-disp);letter-spacing:.02em}
#tabs button.si{background:var(--am);color:#1C2B28;border-color:var(--am)}
#tabs .zoom{margin-left:auto;display:flex;gap:3px}
#tabs .zoom button{min-width:32px}
#hoja svg{display:block;width:100%;height:100%;max-height:100%}
#tresd{flex:1 1 auto;min-height:320px;position:relative;cursor:grab}
#tresd canvas{display:block;width:100%;height:100%}
#datos{padding:8px 10px 10px;border-top:1px solid var(--line);flex:0 0 auto}
#datos h3,.tit3{margin:0 0 5px;font:600 15px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--panel2);padding:2px 7px;font-size:13px;line-height:1.3;text-align:left}
.chip b{font:600 13px var(--f-num);color:var(--am);margin-left:5px}
button.chip:hover{border-color:var(--am)}
.chip.ro{cursor:default}
.reglas{margin:7px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2);display:grid;gap:1px}
#der{grid-area:der;background:var(--panel);border:1px solid var(--line);overflow:auto;min-height:0;padding:12px 14px 14px;min-width:0}
h2{margin:0 0 6px;font:700 26px/1.1 var(--f-disp);text-wrap:balance}
p.ins{margin:0 0 10px;color:var(--ink2)}
p.ins b{color:var(--ink)}
.msg{margin:0 0 10px;padding:7px 10px;border:1px solid var(--line);background:#101A18;font-weight:500}
.msg.mal{border-color:var(--ro);color:#FFD4CB}
.msg.bien{border-color:var(--ve);color:#CFF3DE}
.pri{border:0;background:var(--am);color:#1C2B28;font-weight:600;padding:9px 16px}
.pri:disabled{opacity:.42;cursor:not-allowed}
.sec{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;font-weight:500}
.fila{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
input.txt{width:100%;max-width:360px;padding:8px 9px;background:#101A18;border:1px solid var(--line);margin:0 0 10px;display:block}
label.et{display:block;margin:0 0 3px;font-size:13px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font:600 13.5px var(--f-disp);letter-spacing:.03em;text-align:left;color:var(--ink2);padding:2px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:1px 5px;border-bottom:1px solid rgba(71,96,95,.55)}
.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
th.n{font-family:var(--f-disp)}
.banda{background:var(--panel2);padding:3px 6px;font:600 15px var(--f-disp);letter-spacing:.04em;margin-top:8px}
.tw{overflow-x:auto}
.tw table td:nth-child(3){white-space:nowrap}/*nowrap-mat*/
.cel{width:100%;min-width:40px;border:1px solid var(--line);background:#101A18;padding:1px 4px;text-align:right;font:500 13.5px var(--f-num)}
.cel.ok{border-color:var(--ve);color:var(--ve);background:#16302A}
.cel.mal{border-color:var(--ro);color:#FFD4CB;background:#3a201b}
tr.resal td:first-child,tr.resal td:nth-child(2){color:var(--am)}
.lista{display:grid;gap:3px}
.lin{display:grid;grid-template-columns:22px minmax(0,1fr) 62px minmax(0,190px);gap:6px;align-items:center;padding:2px 0;border-bottom:1px solid rgba(71,96,95,.55)}
.lin input[type=number],.lin select,.ej input,.lin input[type=number]{width:100%}
.lin select{width:100%;font-size:13px}
.lin .cab{font:600 13.5px var(--f-disp);color:var(--ink2)}
.err{outline:1px solid var(--ro)}
.u input{width:58px;text-align:right;font-family:var(--f-num)}
.rep{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.rep li{padding:5px 8px;border:1px solid var(--ro);background:#2b1f1c;font-size:14px}
.rep b{color:#FFD4CB}
.av{font:500 13px var(--f-num);color:var(--ink2)}
.cert{display:block;width:100%;max-width:640px;border:1px solid var(--line);margin:0 0 8px}
.cod{display:block;font:600 14px var(--f-num);margin-bottom:8px;word-break:break-all}
.res2{font-weight:600;margin:10px 0}
.ayb{flex-wrap:wrap;align-items:center;margin:0 0 8px}
.ayu{font-size:13px;color:var(--ink2);margin:6px 0}
.pas{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.cuenta{font:500 16px/1.4 var(--f-num);background:#101A18;border:1px solid var(--line);padding:7px 9px;margin:0 0 9px}
.cuenta b{color:var(--am)}
#cwrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#cmaq{position:relative;flex:1 1 62%;min-height:260px;background:#6E807C;overflow:hidden;touch-action:none}
#cvc{display:block;width:100%;height:100%;cursor:grab}
#mesac{flex:0 0 32%;min-height:120px;background:#EEF0EA;overflow:auto;padding:4px 6px;touch-action:none}
#mesac svg{display:block;width:100%;height:auto;max-height:100%}
#cmsg{position:absolute;left:8px;right:8px;top:8px;padding:8px 11px;background:#101A18;border:1px solid var(--line);font-weight:500;z-index:3}
#cmsg.mal{border-color:var(--ro);color:#FFD4CB}#cmsg.bien{border-color:var(--ve);color:#CFF3DE}
.herr{position:absolute;right:8px;bottom:8px;display:flex;gap:5px;align-items:center;background:rgba(28,43,40,.9);padding:5px 7px;font-size:13px}
.herr button{border:2px solid var(--line);background:var(--panel2);padding:3px 6px;line-height:0}
.herr button.si{border-color:var(--am);background:#3b4a2a}
.lupa{position:absolute;left:8px;bottom:8px;width:min(430px,calc(100% - 150px));background:rgba(28,43,40,.95);border:1px solid var(--am);padding:6px 8px}
.lupa .lt{font-size:13px;margin-bottom:4px}.lupa .sec{padding:4px 7px;font:500 13px var(--f-num)}
.fant{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--am);color:#1C2B28;font-weight:600;padding:5px 10px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.opc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel2);padding:7px 10px}
.opc.si{border-color:var(--am);background:#3b4a2a}.opc i{flex:0 0 20px;height:20px;border:1px solid var(--ink2);font-style:normal;text-align:center;line-height:18px;color:var(--am)}
.opc small{display:block;color:var(--ink2);font-size:13px}.opc b{font-weight:500}
.discos{display:grid;gap:5px}.discos .opc svg{flex:0 0 auto}
.hecho{list-style:none;margin:0 0 8px;padding:0;color:var(--ve);font-size:14px}
.cab2{display:flex;gap:10px;align-items:flex-start;margin:0 0 6px}.mini{flex:0 0 46%;max-width:240px;height:auto;border:1px solid var(--line)}
.tog{display:flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--panel2);padding:6px 10px;font-weight:500}
.tog.si{border-color:var(--ve)}.tog i{width:18px;height:18px;border:1px solid var(--ink2);font-style:normal;line-height:16px;text-align:center;color:var(--ve)}
.cm{border:1px solid var(--line);background:#182522;padding:8px;margin:0 0 8px;max-width:430px}
.cm-led{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.cm-led small{color:var(--ink2);font-size:12px}
.led{background:#0B1210;border:1px solid #2c3d3a;color:#FF5A3C;font:600 24px var(--f-num);text-align:right;padding:2px 8px}.led.act{border-color:var(--am)}
.cm-tec{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.k{grid-column:span 2;border:1px solid var(--line);background:var(--panel2);padding:7px 0;font:600 16px var(--f-num);display:flex;align-items:center;justify-content:center;min-height:40px}
.k.fn{grid-column:span 3;color:var(--am)}.k.fn.on{background:var(--am);color:#1C2B28}
.k.jog{grid-column:span 3;font-size:22px;color:var(--am)}.k.st{grid-column:span 3;background:#1f5a3a}.k.sp{grid-column:span 3;background:#5a2a22}
.cm-inf{display:flex;gap:8px;margin-top:9px;align-items:center}
.marcha,.paro,.emer{border:0;font:700 15px var(--f-disp);letter-spacing:.05em;padding:11px 14px;color:#fff;border-radius:6px}
.marcha{background:#1E9E5A;flex:1}.marcha.vivo{box-shadow:0 0 0 3px #9BF0C2 inset}.paro{background:#D8452D;flex:1}.emer{background:#F2C230;color:#8A1A0A;border:3px solid #D8452D;border-radius:999px}
.epis{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}.epi{border:3px solid transparent;background:none;padding:2px;border-radius:50%;line-height:0}.epi svg{width:100%;height:auto}.epi.si{border-color:var(--am);box-shadow:0 0 0 3px rgba(242,194,48,.35)}
.cq{background:#D9CB9E;color:#1C2B28;padding:9px;max-width:440px;margin:0 0 8px;border:2px solid #8E8257}
.cq-sup{display:grid;grid-template-columns:156px 44px 1fr 62px;gap:8px;align-items:start}
.lf{display:grid;grid-template-columns:1fr 46px;gap:5px;align-items:center}.lf>.led{order:-1}.lf .q{min-height:30px}.lf .q svg{height:22px;width:auto}.rpm{font:600 12px var(--f-num);text-align:center;color:#1C2B28}.cq .cq-fn{grid-template-columns:1fr}.cq .cq-fn .q{min-height:44px;font-size:24px}
.cq-led{display:grid;gap:4px}.cq .led{font-size:20px;padding:1px 6px;background:#3A0D0A;border-color:#1C2B28;color:#FF4B3A}.cq .led.act{outline:2px solid #1B5AA0}.tapa{height:26px;background:#111}
.cq-fn{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cq-num{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.cq-ss{display:grid;gap:5px}
.q{border:2px solid #1C2B28;background:#EFE6C6;color:#1C2B28;border-radius:6px;font:600 17px var(--f-num);min-height:36px;display:flex;align-items:center;justify-content:center;padding:0}
.q.fn{color:#1C2B28}.q.fn.on{background:#1B5AA0;color:#fff}.q.st{background:#1E9E5A;color:#fff;font-size:14px}.q.sp{background:#D8452D;color:#fff;font-size:14px}
.cq-inf{display:flex;gap:16px;align-items:flex-end;margin-top:12px}.pul{display:grid;justify-items:center;gap:2px}.pul small{font:600 12px var(--f-disp);letter-spacing:.04em}
.seta{width:66px;height:66px;background:#F2C230;border:0;display:grid;place-items:center;margin-right:auto}.seta span{width:50px;height:50px;border-radius:50%;background:#D8452D;color:#fff;font:700 12px var(--f-disp);display:grid;place-items:center;box-shadow:0 2px 0 #7a1c10}
.rv{width:40px;height:40px;border-radius:50%;border:4px solid #B9B9B0}.rv.verde{background:#12683B}.rv.verde.vivo{background:#38E08A;box-shadow:0 0 10px #38E08A}.rv.rojo{background:#D8452D}.rv:disabled{opacity:.45}
.camb{position:absolute;inset:0;background:#22302E;display:flex;flex-direction:column;z-index:2}.camb svg{flex:1 1 auto;min-height:0;width:100%;touch-action:none}
.cb-bot{display:flex;flex-wrap:wrap;gap:6px;padding:7px 8px;align-items:center}.cb-bot .marcha,.cb-bot .paro{flex:0 0 auto}.inter.on{border-color:var(--ro);color:#FFD4CB}.inter{border-color:var(--ve);color:#CFF3DE}
@keyframes giraD{to{transform:rotate(360deg)}}.gira{animation:giraD .5s linear infinite}.frena{animation:giraD 2.6s cubic-bezier(.1,.6,.3,1) 1}
.pic{display:inline-block;vertical-align:middle;color:var(--am);line-height:0}
.nc{display:inline-block;min-width:21px;height:21px;line-height:21px;border-radius:11px;background:var(--ink);color:#1C2B28;text-align:center;font:600 13px/21px var(--f-num);padding:0 4px}
.por{border:1px solid var(--am);background:#101A18;padding:8px 11px;margin:0 0 9px;line-height:1.38}
.por b{color:var(--am);font:600 15px var(--f-disp);letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
@media (max-width:900px){
  html,body{height:auto}
  #app,#app.ancho{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "plano" "der"}
  #hoja{min-height:360px}#tresd{min-height:340px}
  .lin{grid-template-columns:22px minmax(0,1fr) 54px}.lin select{grid-column:2/4}
}
</style>
<div id="app">

  <section id="der"></section><input type="file" id="fpar" accept=".txt,text/plain" hidden>
</div>

/* ---------- medidas de cada alumno ---------- */
const normal=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toUpperCase().replace(/\s+/g,' ');
function semilla(n){let h=2166136261;for(const c of normal(n)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function medidas(n,intento=0,vez=1){let h=semilla(n+'#'+intento);const elige=L=>{h=Math.imul(h^h>>>15,2246822519)>>>0;const v=L[(h>>>8)%L.length];return v},rango=(a,b,p)=>{const L=[];for(let v=a;v<=b;v+=p)L.push(v);return L};
  const m={A:elige(rango(745,895,10)),H:elige(rango(550,650,10)),F:elige(rango(350,420,10)),P:elige(rango(220,280,10)),G:elige([16,19]),hc:elige(rango(130,160,10)),b:elige([60,70,80]),e:elige([25,30,35]),ap:elige([60,70,80])};
  /* tres materiales por mueble: un grueso de alistonado, uno de rechapado grueso y uno de rechapado fino.
     Con el fino de 11 el alistonado es de 25 o 30, para que el canelador deje pared suficiente */
  m.gf=elige([6,11]);m.ga=elige(m.gf===11?[25,30]:[18,22,25,30]);m.pa=elige(rango(45,80,5).filter(v=>v>=m.ga+25));m.rc=elige([6,8,10]);m.vu=elige([10,15,20,25,30]);m.dv=elige([0,1]);m.nb=elige([0,1,2]);m.nbi=elige([0,1,2]);m.nbd=elige([0,1,2]);
  /* sentido de la veta en respaldo y fondo de cajón: 1 = gira respecto a la medida mayor habitual */
  m.vr=elige([0,1]);m.vf=elige([0,1]);
  /* el módulo cambia de tablero con veta a tablero sin veta en cada intento */
  m.mv=(vez+semilla(n))%2;m.tm=elige(m.mv?['Rechapado pino ','Melamina roble ']:['Melamina blanca ','DM ']);ajustaTablero(m);m.h=h;return m}

function cotas(m){return {rb:4,fb:8,off:0,ep:Math.min(30,Math.floor((m.pa-m.ga-8)/5)*5),A:m.A,H:m.H,F:m.F,P:m.P,G:m.G,hc:m.hc,b:m.b,pa:m.pa,rp:20,ap:m.ap,e:m.e,gb:m.ga,gp:m.ga,gfr:m.ga,rc:m.rc,rcj:m.rc,tr:10,grP:m.gf,j:3,gu:13,gc:m.G,mt:5,ac:m.hc-30,ge:m.ga,vu:m.vu,dv:m.dv,nb:m.dv?0:m.nb,nbi:m.dv?m.nbi:0,nbd:m.dv?m.nbd:0,hb:5,rt:m.ga+5,vr:m.vr,vf:m.vf,mv:m.mv,tm:m.tm}}

  const suma=()=>{let v=prod();while(tk[i]==='+'||tk[i]==='-'){const o=tk[i++],d=prod();v=o==='+'?v+d:v-d}return v};
  try{const v=suma();return i===tk.length?v:null}catch(e){return null}}

function opDe(t){if(t.ing){const Q=t.R,w=r1(Q.y1-Q.y0),h=r1(Q.x1-Q.x0);return {t:'corte',ing:1,R:Q,a:'y',c:Q.y1,m:w,w,h,resto:false,e0:{L:'c',R:'n',B:'n',T:'n'},met:'adel'}}const Q=t.R,c=S.map.get(clave(Q)),Sk=(Q.y0>M||t.canto)?'n':'b',Wk=(Q.x0>M||t.cabeza)?'n':'b',Nk=Q.y1<H0?'n':'b',Ek=Q.x1<W0?'n':'b',dx=Wk==='b'?M:0,dy=Sk==='b'?M:0;
  if(c.a==='x'&&Wk==='b')return {t:'testa',R:Q,w:r1(Q.x1),h:r1(Q.y1-Q.y0+dy),e0:{L:'b',R:Ek,B:Sk,T:Nk}};
  if(c.a==='y'&&Sk==='b')return {t:'sanear',R:Q,w:r1(Q.y1),h:r1(Q.x1-Q.x0+dx),e0:{L:'b',R:Nk,B:Wk,T:Ek}};

function colocar(sig){const s=paso(),prev=S.pz;S.feed=0;S.sub='montaje';S.recorte=null;

function posicion(){const s=paso(),p=S.pz;if(s.t==='corte')situar();else p.x=-p.w-150;S.fy=-220-p.h}

function girar(d){if(S.sub!=='montaje')return;const p=S.pz,e=p.e;[p.w,p.h]=[p.h,p.w];p.beta=p.beta==='h'?'v':'h';p.e=d>0?{R:e.T,B:e.R,L:e.B,T:e.L}:{R:e.B,T:e.R,L:e.T,B:e.L};posicion()}

function empiezaTablero(){const k=S.bs[S.bi];S.paso=0;S.mesa=[];S.map=new Map(secuencia(k).map(c=>[clave(c.R),c]));S.trozo={id:++S.nid,R:{x0:M,y0:M,x1:W0,y1:H0},cabeza:false,canto:false};S.op=opDe(S.trozo);S.prot=false;S.f='altura';S.pz=null}

  if(s.t!=='corte'){if(p.w!==s.w)return 'El tablero está girado: el borde en bruto tiene que quedar hacia el disco.';if(p.e.T==='b'&&p.e.B!=='b')return 'Contra la regla tiene que ir un canto limpio, no el canto en bruto. Gira el tablero.';if(p.e.R!=='b')return 'El borde en bruto tiene que quedar hacia el disco. Voltea el tablero.';const o=sobra();if(o<4)return 'Tiene que sobresalir unos 10 mm de la línea del disco. Ahora el disco no limpia todo el canto.';if(o>30)return 'Sobresale demasiado. Bastan unos 10 mm para sanear.';return null}

  if(s.met!=='tope'&&uso()==='tope')return 'Este corte sigue la pieza a lo largo: es un corte al ancho y se hace con la guía lateral. Levanta el tope abatible.';

  if(uso()==='tope'&&S.guia<Math.min(sobra()+10,1300))return `La guía lateral estorba: el sobrante, de ${n1(sobra())} mm, pasaría por encima de ella. Apártala: pulsa el botón de la guía y las teclas + y −, o escribe una medida mayor.`;

  if(s.met!=='adel'&&p.e.T==='b'&&p.e.B!=='b')return 'Contra la regla tiene que ir un canto limpio, no el canto en bruto. Gira el tablero.';

const pideEmp=()=>{const s=paso();return s.t==='corte'&&uso()==='guia'&&s.m<=250};
function empezarAvance(wx){if(S.f!=='corte'||S.sub==='hecho')return false;
  if(!S.on){av('La máquina está parada. Pulsa MARCHA.','mal');return false}
  if(S.rpm<.9){av('Espera a que el disco coja todas sus vueltas.','mal');return false}
  if(!S.prot){falta('resg');av('El protector tiene que estar bajado hasta casi tocar la pieza. Se descuenta y no se corta.','mal');return false}
  if(!S.asp){av('Conecta la aspiración antes de cortar.','mal');return false}
  if(Math.abs(wx)<70&&S.herr!=='emp'){falta('manos');av(pideEmp()?'La pieza es estrecha y va contra la guía: no hay sitio seguro para la mano. Coge el empujador.':'Esa mano está en la línea del disco. Agarra lejos de ella.','mal');return false}
  if(S.sub==='montaje'){const r=revisar();if(r){av(r,'mal');return false}
    {const s=paso(),qi=s.ing?45:0;if(S.incl!==qi){av(s.ing?`Este corte es a inglete: el disco tiene que estar inclinado a 45° y está a ${S.incl}°.`:`El disco está inclinado a ${S.incl}°. Para este corte tiene que estar recto, a 0°.`,'mal');return false}}
    {const nd=discoNec();if(S.disco!==nd){av(`Disco equivocado. Está montado el de ${nomD(S.disco)} y este corte pide el de ${nomD(nd)}: ${DISCOS.find(d=>d.id===nd).s.toLowerCase()}. Cambia el disco.`,'mal');return false}}
    if(S.herr==='emp'&&!pideEmp()){av('El empujador solo se usa con piezas de hasta 250 mm cortadas contra la guía lateral. Aquí se empuja con la mano, lejos del disco.','mal');S.herr='mano';pinta();return false}S.sub='avance'}

function terminarCorte(){const s=paso(),p=S.pz;

function dentro(Q){return plan(S.bs[S.bi]).filter(p=>p.x>=Q.x0-.5&&p.y>=Q.y0-.5&&p.x+p.w<=Q.x1+.5&&p.y+p.h<=Q.y1+.5)}

async function partidaTxt(){const f=G.fase==='montaje'?'medidas':G.fase,o={v:1,n:G.nombre,i:G.intento,z:G.vez,f,sel:G.sel,med:G.med,fa:[G.fallos,G.fP,G.fO,G.fC,G.ayudas||0],ayU:G.ayU,el:Date.now()-G.t0,fiP:G.fiP||'',sw:G.lin.filter(l=>l.swap).map(l=>l.id),opt:G.opt?{pz:G.opt.pz.map(p=>[p.b,p.x,p.y,p.rot]),ok:G.opt.ok,pen:G.opt.pen,inf:G.opt.inf,cur:G.opt.cur}:null},j=JSON.stringify(o);return b64(j)+'.'+(await sha(SECRETO+'|partida|'+normal(o.n)+'|'+j)).slice(0,16)}

async function guardaArchivo(){const t=await partidaTxt(),nom='Partida_'+normal(G.nombre).toLowerCase().replace(/ /g,'_')+'.txt',blob=new Blob([t],{type:'text/plain'}),dl=await dlP;try{if(dl)await dl.save({filename:nom,data:blob});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;a.click()}toast('Partida guardada en '+nom+'. Llévate el archivo para continuar en otro ordenador.')}catch(e){}}
async function cargaPartida(txt){try{const[b,fi]=txt.trim().split('.'),j=d64(b),o=JSON.parse(j);if((await sha(SECRETO+'|partida|'+normal(o.n)+'|'+j)).slice(0,16)!==fi)throw 0;

/* ---------- profesorado: clave, guía, certificados, revisión y centro ---------- */
const PFH='8f63732a48bea89838cc14135f3007c26eabe930788c8a8ac85c3e339ec542cd',PFURL='https://ghersan935-creator.github.io/Escuadradora/corte.html';
let PFOK=false,PFT='guia',PFMAL=false,PFC='';try{PFOK=localStorage.getItem('prof-corte')===PFH}catch(e){}
function centro(){try{const c=new URLSearchParams(location.search).get('c');return c?c.replace(/[<>&"'`]/g,'').replace(/\s+/g,' ').trim().slice(0,60):''}catch(e){return ''}}
function pfLineas(t,n){const r=[''];t.split(' ').forEach(w=>{const k=r.length-1;if(r[k]&&(r[k]+' '+w).length>n&&r.length<3)r.push(w);else r[k]=r[k]?r[k]+' '+w:w});return r}
const pfEsc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function pfGuia(){const li=a=>'<ol style="margin:6px 0 14px;padding-left:22px;line-height:1.5">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ol>',h=t=>`<h3 style="margin:16px 0 4px;font:700 19px var(--f-disp);color:var(--am)">${t}</h3>`;
const cu=centro()?PFURL+'?c='+encodeURIComponent(centro()):PFURL;return `<div style="border:2px solid #c8891e;background:#fff6e0;color:#3a2a10;border-radius:8px;padding:10px 14px;margin:0 0 6px;line-height:1.5"><b style="font-size:17px">Enlaces: cuál dar al alumnado y cuál es el suyo</b><br><b>Para el alumnado:</b> <span style="font-family:monospace;word-break:break-all">${pfEsc(cu)}</span><br><b>Para usted:</b> ese mismo enlace terminado en <span style="font-family:monospace">#profesor</span>, más la clave.<br>Es el mismo juego; solo cambia el final de la dirección. No comparta con el alumnado ni <span style="font-family:monospace">#profesor</span> ni la clave. Si quiere que los planos y el certificado lleven el nombre de su centro, cree su enlace en la pestaña «Mi centro» y use ese para todo.</div>${h('Qué es y para quién')}<p class="ins">Un juego de una sola página para el alumnado de carpintería y mueble. Recorre el trabajo completo sobre un aparador, <b>del plano al corte</b>, para practicarlo antes de hacerlo con proyectos de verdad en el taller. No necesita instalación, registro ni conexión a ningún servicio.</p>
${h('Fases y qué se aprende')}<table><tr><td><b>Piezas</b></td><td>Leer los planos e identificar cada pieza, sus unidades y su material.</td></tr><tr><td><b>Despiece</b></td><td>Calcular las medidas de la nota de tableros a partir de las cotas, holguras y uniones.</td></tr><tr><td><b>Montaje</b></td><td>Ver el mueble montado en 3D con las piezas calculadas.</td></tr><tr><td><b>Plan de corte</b></td><td>Colocar las piezas en el tablero aprovechando el material y con el menor número de cortes.</td></tr><tr><td><b>Escuadradora</b></td><td>Cortar siguiendo su propio plan: protecciones, disco, altura, guía, tope, empujador e ingletes.</td></tr><tr><td><b>Certificado</b></td><td>PDF con la nota y un código de comprobación, para entregar.</td></tr></table>
${h('Cómo se puntúa')}<p class="ins">Se parte de 10. Peso de cada fase: piezas 15 %, despiece 35 %, plan de corte 20 % y escuadradora 30 %. Cada error resta 0,25 y cada ayuda gráfica 0,5; en el plan de corte restan también el desperdicio y los cortes de más. El certificado dice <b>«Apto para el taller»</b> solo con un 5 o más de nota global <b>y</b> un 5 o más en la escuadradora.</p>
${h('Por qué no sirve copiar')}<p class="ins">Cada alumno tiene sus propias medidas, que además cambian en cada intento. El tablero del módulo alterna entre con veta y sin veta de un intento a otro, y cambian grosores, canelador y espigas.</p>
${h('Cómo usarlo en clase')}<p class="ins">El tiempo es muy variable: de 2 a 6 horas o más según el alumno, así que conviene repartirlo en varias sesiones. La partida se guarda sola en el ordenador y se puede llevar a otro con «Guardar en un archivo». El alumno puede repetir el juego cuantas veces quiera: el objetivo es que aprenda, y cuantas más repeticiones haga, mejor asimila el proceso. Al terminar entrega el certificado PDF y usted lo comprueba en la pestaña «Comprobar certificados».</p>
${h('La máquina del juego')}<p class="ins">La escuadradora está basada en la del taller del autor, con regulación <b>digital</b> de la guía, de la altura y de la inclinación del disco. El resto del manejo no suele variar de una máquina a otra.</p>${h('Criterios de taller que aplica el juego')}<p class="ins"><b>Despiece</b></p>${li(['La primera medida es siempre el largo. Con veta, el largo es la medida que sigue la veta; sin veta, es el lado mayor. El grueso va en el material.','Puertas y frente de cajón: juego de 3 mm en todo el contorno.','Holgura de 5 mm entre las puertas y las baldas y la división.','Las escopleaduras son 2 mm más profundas que el largo de la espiga.','Respaldo y fondos van en canelador; su profundidad la indica la hoja de taller de cada intento.','Los cantos no se tienen en cuenta en las medidas.'])}<p class="ins"><b>Plan de corte</b></p>${li(['Tablero de 2440 × 1220 mm; se sanean 10 mm y cada corte consume 3,2 mm de disco.','Todos los cortes van de lado a lado de la pieza que se corta.','Primero se cortan las tiras al ancho. La cabeza no se sanea en el tablero entero, sino en cada tira antes de cortarla al largo.','Se respeta la dirección de la veta.','Todo el material de un mismo grosor debe salir de un solo tablero. Restan nota el desperdicio y los cortes de más.'])}<p class="ins"><b>Escuadradora</b></p>${li(['Protección obligatoria: auditiva, ocular (gafas o pantalla), calzado de seguridad y ropa de trabajo. Es un error usar guantes, casco, chaleco o arnés. La mascarilla ni suma ni resta.','Disco según el material: alistonado al hilo, 24 dientes con limitador; alistonado a través, 60 dientes alternos; DM y rechapado, 80 dientes; melamina, 96 dientes de diente cóncavo.','Cambio de disco: parar, desconectar, abrir la puerta, aflojar con la llave en el sentido de giro del disco, montar el disco con los dientes en el sentido correcto, colocar el cuchillo divisor y girar a mano antes de cerrar.','Altura del disco: entre 10 y 20 mm por encima de la pieza, con al menos un diente completo fuera.','Orden de trabajo: lo marca el plan de corte del alumno. Lo habitual es sanear un canto, cortar las tiras al ancho con la guía lateral y después cortar cada tira al largo con el tope del carro; si el plan empieza cortando a través, primero se sanea la cabeza del tablero.','Al cortar con el tope, la guía lateral se retira para que no quede bajo el retal.','Empujador con piezas estrechas y siempre en los ingletes; la mano nunca cerca del disco.','Ingletes de las patas: disco inclinado a 45° y guía lateral adelantada, ajustada al ancho de la pieza.'])}
${h('Limitaciones')}<p class="ins">No hay servidor: las partidas y el número de intento se guardan en el navegador de cada alumno. El código del certificado detecta cambios en el nombre o en la nota, pero el archivo del juego es público; si la nota cuenta para la evaluación, el certificado no debería ser la única prueba.</p>
${h('Autoría y uso')}<p class="ins">© 2026 Gustavo Hernández Sánchez · IES Virgen de la Esperanza (La Línea de la Concepción). Uso educativo libre y gratuito citando al autor. No se permite el uso comercial ni retirar esta mención. Esta página y su clave son solo para el profesorado: no las comparta con el alumnado.</p>`}
function pfCentro(){const u=PFC?PFURL+'?c='+encodeURIComponent(PFC):'';return `<p class="ins">Escriba el nombre de su centro. Obtendrá un enlace para su alumnado: con él, el <b>cajetín de los planos</b> y el <b>certificado</b> muestran su centro en lugar del IES Virgen de la Esperanza. La autoría del juego no cambia.</p><label>Nombre del centro</label><div class="fila"><input id="pfc" maxlength="60" value="${pfEsc(PFC)}" placeholder="Por ejemplo: IES Sierra Luna" style="flex:1"><button data-a="pfcen">Crear enlace</button></div>${u?`<p class="ins" style="margin-top:12px">Enlace para su alumnado:</p><p style="word-break:break-all;padding:8px 10px;border:1px solid var(--am);font-family:monospace">${pfEsc(u)}</p><div class="fila"><button class="sec" data-a="pfcop">Copiar enlace</button><a class="sec" href="${pfEsc(u)}" target="_blank" rel="noopener" style="padding:6px 10px">Abrir</a></div><p class="ayu">Para comprobar certificados o revisar el juego, use ese mismo enlace terminado en #profesor.</p>`:''}`}
function pProf(){if(!PFOK)return `<h2>Acceso del profesorado</h2><p class="ins">Escriba la clave que le ha facilitado el autor.</p><label>Clave</label><div class="fila"><input id="pfk" type="password" autocomplete="off" style="flex:1"><button data-a="pfent">Entrar</button></div>${PFMAL?'<div class="msg mal">La clave no es correcta.</div>':''}`;
const tb=(v,t)=>`<button class="sec" data-a="pftab" data-v="${v}" style="padding:5px 10px${PFT===v?';border-color:var(--am);color:var(--am)':''}">${t}</button>`;
return `<h2>Página del profesorado</h2><div class="fila" style="margin:0 0 12px;flex-wrap:wrap">${tb('guia','Guía')}${tb('cert','Comprobar certificados')}${tb('cen','Mi centro')}<button class="sec" data-a="pfrev" style="padding:5px 10px">Revisar el juego</button><button class="sec" data-a="pfsal" style="padding:5px 10px;margin-left:auto">Cerrar sesión de profesor</button></div>${PFT==='cert'?pProfCert():PFT==='cen'?pfCentro():pfGuia()}`}
async function pfEntra(){const k=$('#pfk');if(!k)return;const h=await sha('IESVE-prof|'+k.value.trim());if(h===PFH){PFOK=true;PFMAL=false;try{localStorage.setItem('prof-corte',PFH)}catch(e){}}else PFMAL=true;pinta()}
